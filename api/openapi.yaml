  /forms/{formId}/submissions:
    parameters:
      - { name: formId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [forms]
      operationId: submitForm
      summary: Isi form; membuat item sesuai pengaturan respons dalam satu transaksi (FORM-06)
      description: |
        `application/json` dengan `{answers}` bila form tanpa lampiran, atau `multipart/form-data` dengan bagian `answers`
        (JSON) dan bagian `file:<key>` untuk tiap berkas pada pertanyaan attachment. Item dibuat atas nama pengisi.
        Semua kesalahan jawaban dikembalikan sekaligus di `errors` (field `answers.<key>`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              additionalProperties: false
              properties:
                answers: { type: object, additionalProperties: true }
          multipart/form-data:
            schema:
              type: object
              required: [answers]
              properties:
                answers: { type: string, description: Objek JSON jawaban }
              additionalProperties: { type: string, format: binary }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormSubmitted' }
        '404': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /events:
    get:
