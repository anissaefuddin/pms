        definition: { $ref: '#/components/schemas/ReportDefinition' }
        template: { type: string, enum: [active_tasks_by_assignee, weekly_project_status, overdue, due_this_month, unassigned, time_spent, utilization], description: Pakai definisi template; tidak boleh bersama definition }
    ReportUpdate:
