      tags: [views]
      operationId: listSpaceViews
      responses:
        '200': { $ref: '#/components/responses/ViewList' }
        '404': { $ref: '#/components/responses/Problem' }

  # ───────────────────────── ITEMS ─────────────────────────
  /items:
    post:
      tags: [items]
      operationId: createItem
      summary: Buat project, folder, atau task (SPC-05, SPC-06, TASK-01, TASK-02)
      description: |
        `locations` wajib berisi minimal satu lokasi. Untuk subtask, isi `parent_item_id` dengan task induk.
        `default_view_type` hanya berlaku untuk project/folder; nilainya table, board, gantt, calendar, files, atau chart.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemCreate' }
      responses:
        '201':
          description: Dibuat
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /items/{itemId}:
    parameters:
      - { $ref: '#/components/parameters/ItemId' }
    get:
      tags: [items]
      operationId: getItem
      summary: Detail item (SPC-07, TASK-03)
      responses:
        '200':
          description: OK
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [items]
      operationId: updateItem
      summary: Ubah item (nama, status, tanggal, deskripsi, assignee, milestone)
      description: |
        `status_id` memerlukan kemampuan `change_status`; field lain memerlukan `edit`.
        Perubahan tanggal atau durasi dapat menggeser jadwal dalam transaksi yang sama.
        Effort dan allocation mengubah jadwal hanya saat `recalculate_duration` bernilai true.
        `affected_items` berisi penerus yang bergeser dan dapat dilihat pemanggil.
        Pergeseran urutan memakai endpoint `reorder`.
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemUpdate' }
      responses:
        '200':
          description: OK
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemPatchResult' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [items]
      operationId: deleteItem
      summary: Pindahkan item dan turunannya ke Recycle bin (BIN-01)
      responses:
        '204': { description: Dipindahkan ke Recycle bin }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /items/{itemId}/dependencies:
    parameters:
      - { $ref: '#/components/parameters/ItemId' }
    get:
      tags: [items]
      operationId: listItemDependencies
      summary: Daftar dependensi masuk dan keluar dengan kedua ujung terlihat
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ItemDependency' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [items]
      operationId: createItemDependency
      summary: Tambah pendahulu bagi Item penerus pada URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [predecessor_id, type]
              properties:
                predecessor_id: { type: string, format: uuid }
                type: { $ref: '#/components/schemas/DependencyType' }
                lag: { type: integer, format: int32, default: 0, description: Lag dalam hari kerja, boleh negatif }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemDependencyMutation' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /dependencies/query:
    post:
      tags: [items]
      operationId: queryDependencies
      summary: Dependensi di antara sekumpulan Item (link Gantt). POST hanya karena daftar ID tidak muat di URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_ids]
              properties:
                item_ids: { type: array, maxItems: 1000, items: { type: string, format: uuid } }
      responses:
        '200':
          description: Dependensi yang kedua ujungnya ada di daftar dan terlihat
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ItemDependency' }
        '422': { $ref: '#/components/responses/Problem' }
  /dependencies/{dependencyId}:
    patch:
      tags: [items]
      operationId: updateItemDependency
      summary: Ubah tipe atau lag dependensi dan geser penerus yang melanggar jadwal
      parameters:
        - { name: dependencyId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                type: { $ref: '#/components/schemas/DependencyType' }
                lag: { type: integer, format: int32, description: Lag dalam hari kerja, boleh negatif }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemDependencyMutation' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [items]
      operationId: deleteItemDependency
      summary: Hapus dependensi dengan izin edit pada penerus
      parameters:
        - { name: dependencyId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Dihapus }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /items/{itemId}/children:
    parameters:
      - { $ref: '#/components/parameters/ItemId' }
    get:
      tags: [items]
      operationId: listItemChildren
      summary: Anak langsung item (project/folder/task) untuk Table dan Board (VIEW-01, VIEW-02)
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/ItemFilterType' }
        - { $ref: '#/components/parameters/ItemFilterStatusGroup' }
        - { $ref: '#/components/parameters/ItemFilterAssignee' }
        - { $ref: '#/components/parameters/ItemSort' }
        - { $ref: '#/components/parameters/ItemFilterField' }
      responses:
        '200': { $ref: '#/components/responses/ItemPage' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /items/{itemId}/reorder:
    post:
      tags: [items]
      operationId: reorderItem
      summary: Ubah urutan item di dalam satu lokasi (drag di Table/Board)
      parameters:
        - { $ref: '#/components/parameters/ItemId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parent_item_id]
              properties:
                space_id: { type: string, format: uuid }
                parent_item_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: Lokasi yang diurutkan; null berarti root Space
                after_item_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: Taruh setelah item ini; null berarti paling atas
      responses:
        '204': { description: Diurutkan }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /items/{itemId}/locations:
    parameters:
      - { $ref: '#/components/parameters/ItemId' }
    put:
      tags: [items]
      operationId: replaceItemLocations
      summary: Ganti seluruh lokasi item (multi-lokasi)
      description: Minimal satu lokasi. Menambah lokasi yang membentuk siklus ditolak dengan 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locations]
              properties:
                locations:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/Location' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '422': { $ref: '#/components/responses/Problem' }
  /items/{itemId}/shares:
    parameters:
      - { $ref: '#/components/parameters/ItemId' }
    get:
      tags: [items]
      operationId: listItemShares
      responses:
        '200': { $ref: '#/components/responses/VersionedShareList' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [items]
      operationId: replaceItemShares
      summary: Ganti seluruh daftar share item (SPC-11)
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShareReplace' }
      responses:
        '200': { $ref: '#/components/responses/VersionedShareList' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /items/{itemId}/views:
    parameters:
      - { $ref: '#/components/parameters/ItemId' }
    get:
      tags: [views]
      operationId: listItemViews
      responses:
        '200': { $ref: '#/components/responses/ViewList' }
        '404': { $ref: '#/components/responses/Problem' }
  /items/{itemId}/followers:
    parameters:
      - { $ref: '#/components/parameters/ItemId' }
    put:
      tags: [items]
      operationId: replaceItemFollowers
      summary: Ganti daftar follower (user yang menerima notifikasi item)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids]
              properties:
                user_ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '204': { description: OK }

  # ───────────────────────── VIEWS ─────────────────────────
  /views:
    post:
      tags: [views]
      operationId: createView
      summary: Tambah view (VIEW-08)
      requestBody:
        required: true
