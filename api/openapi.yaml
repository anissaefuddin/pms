            application/json:
              schema: { $ref: '#/components/schemas/Form' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /public/forms/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    get:
      tags: [forms]
      operationId: getPublicForm
      summary: Definisi form lewat tautan publik, tanpa sesi (SEC-05)
      description: Tidak memuat id internal. Pertanyaan bertipe assignee tidak ditampilkan. Token yang dicabut atau tidak dikenal sama-sama 404.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [name, description, definition]
                properties:
                  name: { type: string }
                  description: { type: string }
                  definition: { $ref: '#/components/schemas/FormDefinition' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /public/forms/{token}/submissions:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    post:
      tags: [forms]
      operationId: submitPublicForm
      summary: Isi form lewat tautan publik, tanpa sesi (SEC-05)
      description: |
        Item dibuat atas nama pengguna placeholder; identitas pengisi disimpan pada pengajuan. Respons hanya tanda terima,
        tanpa id item. Field `website` adalah honeypot: bila terisi, tidak ada item dibuat tetapi balasan tetap 201.
        Batas 30 pengajuan per jam per IP. `multipart/form-data` memakai bagian `answers`, `requester` (JSON), `website`, dan `file:<key>`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers, requester]
              additionalProperties: false
              properties:
                answers: { type: object, additionalProperties: true }
                requester:
                  type: object
                  required: [name, email]
                  properties:
                    name: { type: string, maxLength: 120 }
                    email: { type: string, format: email }
                website: { type: string }
          multipart/form-data:
            schema:
              type: object
              required: [answers, requester]
              additionalProperties: { type: string, format: binary }
      responses:
        '201':
          description: Diterima
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received: { type: boolean }
        '404': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
