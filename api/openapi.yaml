          application/json:
            schema: { $ref: '#/components/schemas/ViewCreate' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/View' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /views/{viewId}:
    parameters:
      - { $ref: '#/components/parameters/ViewId' }
    patch:
      tags: [views]
      operationId: updateView
      summary: Rename, ubah visibilitas, urutan, atau set default (VIEW-08)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ViewUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/View' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [views]
      operationId: deleteView
      summary: Hapus view; view default tidak bisa dihapus
      responses:
        '204': { description: Dihapus }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /views/{viewId}/duplicate:
    post:
      tags: [views]
      operationId: duplicateView
