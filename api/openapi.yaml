    post:
      operationId: startSpaceExcelExport
      description: 'Ekspor seluruh Space: setiap root yang bisa dilihat pemanggil beserta hierarkinya (EXP-03).'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                filter: { type: object, additionalProperties: true }
      responses:
        '202':
          description: Export dijadwalkan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExcelExport' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /excel-exports/{exportId}:
    parameters:
      - { name: exportId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getProjectExcelExport
      responses:
        '200':
          description: Status export
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExcelExport' }
        '404': { $ref: '#/components/responses/Problem' }
  /excel-exports/{exportId}/file:
    parameters:
      - { name: exportId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: downloadProjectExcelExport
      responses:
        '200':
          description: Workbook XLSX
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /excel-imports/{reportId}:
    parameters:
      - { name: reportId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getExcelImportReport
      description: 'Laporan impor milik pemanggil. Akses mengikuti Space laporan, bukan URL.'
      responses:
        '200':
          description: Laporan impor
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
                  dependencies: { type: integer }
                  destination: { type: string }
                  sheet: { type: string }
                  rescheduled: { type: array, items: { type: object, additionalProperties: true } }
        '404': { $ref: '#/components/responses/Problem' }
  /spaces/{spaceId}/excel-imports:
    parameters:
      - { $ref: '#/components/parameters/SpaceId' }
    post:
      operationId: importProjectExcel
      description: Unggah untuk preview. Untuk membuat item, kirim ulang workbook, mapping, dan digest preview dengan commit=true.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: Workbook XLSX maksimum 5 MiB }
                mapping: { type: string, description: JSON object dari nama kolom ke target. String kosong mengabaikan kolom. }
                commit: { type: boolean }
                digest: { type: string }
      responses:
        '200':
          description: Pratinjau dan validasi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExcelPreview' }
        '201':
          description: Item dibuat dalam satu transaksi
          content:
            application/json:
              schema:
                type: object
                required: [item_ids]
                properties:
                  item_ids:
                    type: array
                    items: { type: string, format: uuid }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422':
          description: Workbook atau baris tidak valid
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /items/{itemId}/time-summary:
    parameters:
      - { $ref: '#/components/parameters/ItemId' }
    get:
      operationId: getProjectTimeSummary
      summary: Total menit aktual yang dapat dilihat pemanggil
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [actual_minutes, approved_minutes, pending_minutes, scope, cost_status, budgets]
                properties:
                  actual_minutes: { type: integer, format: int64 }
                  approved_minutes: { type: integer, format: int64, description: Bagian yang sudah disetujui }
                  pending_minutes: { type: integer, format: int64, description: Draf dan diajukan }
                  known_cost_minor: { type: integer, format: int64, description: Subtotal yang diketahui bila cost_status partial; hanya administrator }
                  budgets:
                    type: array
                    items:
                      type: object
                      required: [field_id, name, currency, planned_minor, variance_minor, utilization_percent]
                      properties:
                        field_id: { type: string, format: uuid }
                        name: { type: string }
                        currency: { type: string }
                        planned_minor: { type: integer, format: int64, nullable: true }
                        variance_minor: { type: integer, format: int64, nullable: true, description: planned - actual; negatif berarti melebihi anggaran; null bila biaya tidak lengkap }
                        utilization_percent: { type: number, nullable: true, description: 'null bila anggaran kosong atau nol, atau biaya tidak lengkap' }
                  scope: { type: string, enum: [project, permitted_entries] }
                  cost_status: { type: string, enum: [full, partial, unauthorized], description: 'partial: sebagian entry tidak terlihat atau belum punya tarif, sehingga angka tidak dikirim' }
                  actual_cost_minor: { type: integer, format: int64, description: 'Actual cost (satuan minor per jam x menit/60, entry billable yang disetujui, rate snapshot); hanya untuk administrator yang melihat seluruh entry (scope project)' }
        '404': { $ref: '#/components/responses/Problem' }
  /items/{itemId}/time-entries:
    parameters:
      - { $ref: '#/components/parameters/ItemId' }
    get:
      operationId: listProjectTimeEntries
      summary: Time entry sendiri atau entry pada lokasi Project dengan akses penuh
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
        - { name: user_id, in: query, schema: { type: string, format: uuid } }
        - { name: category, in: query, schema: { type: string } }
        - { name: billing_type, in: query, schema: { type: string, enum: [billable, non_billable] } }
        - { name: locked, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [date, '-date', duration, '-duration', user] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeEntryPage' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /time-entries:
    get:
      operationId: listTimeEntries
      summary: Daftar time entry sendiri yang masih terlihat
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeEntryPage' }
        '422': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createTimeEntry
      summary: Catat waktu sendiri untuk task dan tanggal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/TimeEntryFields' }
                - type: object
                  required: [item_id, date, minutes]
                  properties:
                    item_id: { type: string, format: uuid }
                    date: { type: string, format: date }
                    minutes: { type: integer, minimum: 1, maximum: 1440 }
      responses:
        '201':
          description: Dibuat
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeEntry' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /time-entries/submit:
    post:
      operationId: submitTimeEntries
      summary: Ajukan time entry draf dan ditolak milik sendiri dalam satu periode untuk direview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: { type: string, format: date }
                to: { type: string, format: date }
      responses:
        '200':
          description: Jumlah entry yang diajukan
          content:
            application/json:
              schema:
                type: object
                required: [submitted]
                properties:
                  submitted: { type: integer }
        '422': { $ref: '#/components/responses/Problem' }
  /time-entries/review:
    get:
      operationId: listTimeEntriesToReview
      summary: Entry orang lain yang diajukan pada task dengan akses penuh, terlama dulu
      parameters:
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeEntryPage' }
        '422': { $ref: '#/components/responses/Problem' }
  /time-entries/{entryId}/history:
    parameters:
      - { name: entryId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getTimeEntryHistory
      summary: Riwayat pengajuan, persetujuan, penolakan, dan kunci satu entry
      responses:
        '200':
          description: Urut dari yang paling lama
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [action, actor_name, note, minutes, at]
                      properties:
                        action: { type: string, enum: [submitted, approved, rejected, locked, unlocked] }
                        actor_name: { type: string }
                        note: { type: string }
                        minutes: { type: integer }
                        at: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/Problem' }
  /time-entries/{entryId}/review:
    parameters:
      - { name: entryId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: reviewTimeEntry
      summary: Setujui atau tolak entry orang lain (akses penuh pada task); menolak entry yang disetujui membukanya kembali
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approved, rejected] }
                note: { type: string, maxLength: 1000 }
      responses:
        '200': { $ref: '#/components/responses/TimeEntry' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /time-entries/{entryId}:
    parameters:
      - { name: entryId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getTimeEntry
      responses:
        '200': { $ref: '#/components/responses/TimeEntry' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateTimeEntry
      summary: Pemilik mengubah data entry, pengguna dengan akses penuh mengubah lock secara terpisah
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/TimeEntryFields' }
                - type: object
                  properties:
                    locked: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/TimeEntry' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteTimeEntry
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '204': { description: Dihapus }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }

  # ───────────────────────── AUTH (M0) ─────────────────────────
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Login dengan email dan password (AUTH-01)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Berhasil; cookie session diset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '202':
          description: Password benar tetapi user memakai 2FA; belum ada session. Lanjutkan dengan `POST /auth/login/2fa` dalam 5 menit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwoFactorChallenge' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/login/2fa:
    post:
      tags: [auth]
      operationId: loginSecondStep
      summary: Langkah kedua login dengan kode TOTP 6 digit atau kode cadangan (AUTH-05)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge, code]
              additionalProperties: false
              properties:
                challenge: { type: string }
                code: { type: string, maxLength: 32 }
      responses:
        '200':
          description: Berhasil; cookie session diset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Logout dan cabut session ini (AUTH-02)
      responses:
        '204': { description: Berhasil }
  /auth/password/forgot:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Minta link reset password (AUTH-03); respons selalu sama
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Diterima }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Set password baru dengan token reset (AUTH-03)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, format: password, minLength: 8 }
      responses:
        '204': { description: Password diganti; semua session dicabut }
        '410': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/password/change:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Ganti password (AUTH-04)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password, minLength: 8 }
      responses:
        '204': { description: Berhasil; session lain dicabut }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/invitations/{token}:
    get:
      tags: [auth]
      operationId: getInvitation
      summary: Periksa token undangan (AUTH-06)
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Token valid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationInfo' }
        '410': { $ref: '#/components/responses/Problem' }
  /auth/invitations/accept:
    post:
      tags: [auth]
      operationId: acceptInvitation
      summary: Terima undangan dan aktifkan akun (AUTH-06)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptInvitationRequest' }
      responses:
        '200':
          description: Akun aktif; cookie session diset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '410': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ───────────────────────── PROFIL & USER ─────────────────────────
  /me:
    get:
      tags: [users]
      operationId: getMe
      summary: User yang sedang login beserta pengaturan (SET-02)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [users]
      operationId: updateMe
      summary: Ubah profil dan pengaturan workspace (SET-02)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '422': { $ref: '#/components/responses/Problem' }
  /settings/work-schedule:
    get:
      tags: [settings]
      operationId: getWorkSchedule
      summary: Work schedule workspace (SET-07); semua user yang login boleh membaca
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkSchedule' }
        '401': { $ref: '#/components/responses/Problem' }
    put:
      tags: [settings]
      operationId: replaceWorkSchedule
      summary: Ganti work schedule (admin saja, SET-07)
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkScheduleInput' }
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkSchedule' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /users:
    get:
      tags: [users]
      operationId: listUsers
      summary: Daftar user (USR-03); admin melihat semua status, lainnya hanya yang aktif
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: q, in: query, schema: { type: string }, description: Cari nama atau email }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/UserStatus' } }
        - { name: user_type, in: query, schema: { $ref: '#/components/schemas/UserType' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
  /users/types:
    get:
      tags: [users]
      operationId: listUserTypes
      summary: Matriks izin dari policy (USR-02); admin saja
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [roles, user_types]
                properties:
                  roles:
                    type: object
                    additionalProperties:
                      type: array
                      items: { $ref: '#/components/schemas/Capability' }
                  user_types:
                    type: object
                    additionalProperties:
                      type: array
                      items: { $ref: '#/components/schemas/Capability' }
        '403': { $ref: '#/components/responses/Problem' }
  /clients:
    get:
      tags: [clients]
      operationId: listClients
      summary: Daftar klien (Customer Master). Hanya Workspace Admin
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [all, active, archived], default: all } }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Client' } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    post:
      tags: [clients]
      operationId: createClient
      summary: Buat klien baru dengan kode unik yang dinormalisasi (trim, huruf besar). Hanya Workspace Admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientCreate' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /clients/eligible:
    get:
      tags: [clients]
      operationId: listEligibleClients
      summary: Pilihan klien untuk picker. Default berbasis membership aktif (untuk semua pengguna yang masuk). scope=administrative hanya Workspace Admin dan tidak memberi membership atau akses resource
      parameters:
        - { name: scope, in: query, required: false, schema: { type: string, enum: [membership, administrative], default: membership } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 }, description: "Cari nama, kode, atau nama pendek" }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ClientOption' } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /clients/{clientId}:
    parameters:
      - { name: clientId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [clients]
      operationId: getClient
      summary: Ambil satu klien, termasuk yang diarsipkan. Hanya Workspace Admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [clients]
      operationId: updateClient
      summary: Ubah nama dan nama pendek. Kode dan ID tidak bisa diubah. Klien arsip tidak bisa diubah. Hanya Workspace Admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /clients/{clientId}/archive:
    parameters:
      - { name: clientId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [clients]
      operationId: archiveClient
      summary: Arsipkan klien. Riwayat membership tetap. Mengarsipkan ulang tidak mengubah metadata awal. Hanya Workspace Admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /clients/{clientId}/members:
    parameters:
      - { name: clientId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [clients]
      operationId: listClientMembers
      summary: Membership klien. Hanya yang aktif, kecuali include_revoked=true. Hanya Workspace Admin
      parameters:
        - { name: include_revoked, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ClientMembership' } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [clients]
      operationId: grantClientMember
      summary: Beri kelayakan klien kepada pengguna aktif (admin atau staf). Membership bukan izin resource. Mengulang tidak mengubah apa pun. Hanya Workspace Admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientMembershipGrant' }
      responses:
        '200':
          description: Membership aktif (baru atau sudah ada)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientMembership' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /clients/{clientId}/members/{userId}:
    parameters:
      - { name: clientId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [clients]
      operationId: revokeClientMember
      summary: Cabut membership aktif. Riwayat tetap. Mengulang tidak mengubah apa pun. Hanya Workspace Admin
      responses:
        '200':
          description: Membership yang dicabut
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientMembership' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /users/invitations:
    post:
      tags: [users]
      operationId: inviteUser
      summary: Undang user via email (USR-01); admin saja
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteRequest' }
      responses:
        '201':
          description: Undangan dibuat dan email dijadwalkan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /users/{userId}:
    parameters:
      - { $ref: '#/components/parameters/UserId' }
    get:
      tags: [users]
      operationId: getUser
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [users]
      operationId: updateUser
      summary: Ubah user type (USR-02); admin saja
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_type: { $ref: '#/components/schemas/UserType' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /me/view-expansion/{viewId}:
    put:
      tags: [users]
      operationId: saveViewExpansion
      summary: Simpan expansi hierarki untuk satu view milik user (WA-D05)
      parameters:
        - name: viewId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows, gantt_collapsed]
              properties:
                rows: { type: array, maxItems: 500, items: { type: string, format: uuid } }
                gantt_collapsed: { type: boolean }
      responses:
        '204': { description: Tersimpan }
        '422': { $ref: '#/components/responses/Problem' }
  /me/view-preferences/{scopeId}:
    put:
      tags: [users]
      operationId: saveViewPreferences
      summary: Simpan view tersembunyi dan urutan tab personal per workspace (WA-D07)
      parameters:
        - name: scopeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hidden, order]
              properties:
                hidden: { type: array, maxItems: 100, items: { type: string, format: uuid } }
                order: { type: array, maxItems: 100, items: { type: string, format: uuid } }
      responses:
        '204': { description: Tersimpan }
        '422': { $ref: '#/components/responses/Problem' }
  /me/2fa:
    get:
      tags: [auth]
      operationId: getTwoFactor
      summary: Status 2FA user ini (AUTH-05)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwoFactorStatus' }
  /me/2fa/setup:
    post:
      tags: [auth]
      operationId: setupTwoFactor
      summary: Mulai pendaftaran 2FA; mengembalikan secret dan tautan otpauth untuk kode QR. Belum aktif sampai dikonfirmasi
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauth_uri]
                properties:
                  secret: { type: string }
                  otpauth_uri: { type: string }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /me/2fa/enable:
    post:
      tags: [auth]
      operationId: enableTwoFactor
      summary: Konfirmasi dengan kode 6 digit; mengaktifkan 2FA, membuat kode cadangan (tampil sekali), dan mencabut session lain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              additionalProperties: false
              properties:
                code: { type: string, maxLength: 16 }
      responses:
        '200':
          description: Aktif
          content:
            application/json:
              schema:
                type: object
                required: [enabled_at, backup_codes]
                properties:
                  enabled_at: { type: string, format: date-time }
                  backup_codes: { type: array, items: { type: string } }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /me/2fa/disable:
    post:
      tags: [auth]
      operationId: disableTwoFactor
      summary: Matikan 2FA; butuh password dan kode saat ini; mencabut session lain
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TwoFactorReauth' }
      responses:
        '204': { description: Dimatikan }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /me/2fa/backup-codes:
    post:
      tags: [auth]
      operationId: renewBackupCodes
      summary: Buat kode cadangan baru (yang lama tidak berlaku); butuh password dan kode saat ini
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TwoFactorReauth' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [backup_codes]
                properties:
                  backup_codes: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /users/{userId}/2fa/reset:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [users]
      operationId: resetUserTwoFactor
      summary: Admin menghapus 2FA user (pemulihan); user dikeluarkan dari semua session dan kejadiannya dicatat
      responses:
        '204': { description: Direset }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /users/{userId}/deactivate:
    post:
      tags: [users]
      operationId: deactivateUser
      summary: Nonaktifkan user dan bebaskan seat (USR-03)
      parameters:
        - { $ref: '#/components/parameters/UserId' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '409': { $ref: '#/components/responses/Problem' }
  /users/{userId}/reactivate:
    post:
      tags: [users]
      operationId: reactivateUser
      summary: Aktifkan kembali user (USR-03)
      parameters:
        - { $ref: '#/components/parameters/UserId' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '422': { $ref: '#/components/responses/Problem' }
  /users/{userId}/invitation/resend:
    post:
      tags: [users]
      operationId: resendInvitation
      summary: Kirim ulang atau perbarui undangan (USR-01)
      parameters:
        - { $ref: '#/components/parameters/UserId' }
      responses:
        '204': { description: Email dijadwalkan }
  /account:
    get:
      tags: [users]
      operationId: getAccount
      summary: Info workspace untuk user yang login (SET-04); tanpa status trial karena instance berdiri sendiri
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
    patch:
      tags: [users]
      operationId: renameAccount
      summary: Ubah identitas dan branding workspace (hanya admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                description: { type: string, maxLength: 500 }
                icon: { type: string, maxLength: 8 }
                logo_light_url: { type: string, format: uri, maxLength: 500, description: URL HTTPS atau string kosong }
                logo_dark_url: { type: string, format: uri, maxLength: 500, description: URL HTTPS atau string kosong }
                brand_color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', description: Warna hex atau string kosong }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /branding:
    get:
      tags: [users]
      operationId: getWorkspaceBranding
      summary: Identitas visual Workspace yang aman untuk halaman publik dan aplikasi
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceBranding' }
  /account/branding/{asset}:
    parameters:
      - name: asset
        in: path
        required: true
        schema: { type: string, enum: [icon, logo_light, logo_dark] }
    get:
      tags: [users]
      operationId: getWorkspaceBrandAsset
      summary: Ambil icon atau logo Workspace; publik agar dapat dirender oleh email client
      security: []
      responses:
        '200':
          description: Image bytes
          content:
            application/octet-stream: { schema: { type: string, format: binary, description: 'Runtime Content-Type adalah image/png, image/jpeg, atau image/webp' } }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [users]
      operationId: saveWorkspaceBrandAsset
      summary: Upload icon atau logo Workspace (hanya admin)
      requestBody:
        required: true
        content:
          application/octet-stream: { schema: { type: string, format: binary, description: 'PNG, JPEG, atau WebP; tipe divalidasi dari bytes' } }
      responses:
        '200':
          description: Updated Workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '403': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [users]
      operationId: removeWorkspaceBrandAsset
      summary: Hapus icon atau logo Workspace (hanya admin)
      responses:
        '200':
          description: Updated Workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '403': { $ref: '#/components/responses/Problem' }
  /onboarding/complete:
    post:
      tags: [users]
      operationId: completeOnboarding
      summary: Tandai wizard first-run selesai atau dilewati (AUTH-07); idempoten, hanya admin
      responses:
        '204': { description: Tersimpan }
        '403': { $ref: '#/components/responses/Problem' }
  /seats:
    get:
      tags: [users]
      operationId: getSeats
      summary: Penggunaan seat (USR-03)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Seats' }
  /groups:
    get:
      tags: [users]
      operationId: listGroups
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Group' }
    post:
      tags: [users]
      operationId: createGroup
      summary: Buat grup (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                member_ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
  /groups/{groupId}:
    parameters:
      - { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [users]
      operationId: replaceGroup
      summary: Ganti nama dan anggota grup (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, member_ids]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                member_ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
    delete:
      tags: [users]
      operationId: deleteGroup
      responses:
        '204': { description: Dihapus }

  # ───────────────────────── SPACES ─────────────────────────
  /item-types:
    get:
      tags: [items]
