      parameters:
        - { name: templateId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_id]
              properties:
                request_id: { type: string, format: uuid, description: Kunci idempotensi dari klien }
                name: { type: string, minLength: 1, maxLength: 120, description: Default nama template }
      responses:
        '200':
          description: Diulang dengan request_id yang sama; Space yang sudah ada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Space' }
        '201':
          description: Dibuat
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Space' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /spaces:
    get:
      tags: [spaces]
      operationId: listSpaces
      summary: Space yang bisa diakses, termasuk Personal space (SPC-01, NAV-01)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Space' }
    post:
      tags: [spaces]
      operationId: createSpace
      summary: Buat Space (SPC-01)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpaceCreate' }
      responses:
        '201':
          description: Dibuat
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Space' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /spaces/{spaceId}:
    parameters:
      - { $ref: '#/components/parameters/SpaceId' }
    get:
      tags: [spaces]
      operationId: getSpace
      responses:
        '200':
          description: OK
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Space' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [spaces]
      operationId: updateSpace
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpaceUpdate' }
      responses:
        '200':
          description: OK
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Space' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [spaces]
      operationId: deleteSpace
      summary: Hapus Space beserta isinya ke Recycle bin; Personal space tidak bisa dihapus
      responses:
        '204': { description: Dihapus }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /spaces/{spaceId}/shares:
    parameters:
      - { $ref: '#/components/parameters/SpaceId' }
    get:
      tags: [spaces]
      operationId: listSpaceShares
      responses:
        '200': { $ref: '#/components/responses/VersionedShareList' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [spaces]
      operationId: replaceSpaceShares
      summary: Ganti seluruh daftar share Space (SPC-11)
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShareReplace' }
      responses:
        '200': { $ref: '#/components/responses/VersionedShareList' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /spaces/{spaceId}/custom-fields:
    parameters:
      - { $ref: '#/components/parameters/SpaceId' }
    get:
      tags: [spaces]
      operationId: listCustomFields
      summary: Daftar definisi custom field di Space, termasuk yang diarsipkan
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CustomField' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [spaces]
      operationId: createCustomField
      summary: Tambahkan definisi custom field; perlu akses penuh di Space
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomFieldCreate' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomField' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /spaces/{spaceId}/custom-fields/{fieldId}:
    parameters:
      - { $ref: '#/components/parameters/SpaceId' }
      - { name: fieldId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [spaces]
      operationId: updateCustomField
      summary: Ubah nama, urutan, atau opsi definisi; opsi yang dipakai dipertahankan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomFieldUpdate' }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomField' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [spaces]
      operationId: archiveCustomField
      summary: Arsipkan definisi dan pertahankan nilai yang sudah tersimpan
      responses:
        '204': { description: Diarsipkan }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /spaces/{spaceId}/items:
    parameters:
      - { $ref: '#/components/parameters/SpaceId' }
    get:
      tags: [spaces]
      operationId: listSpaceRootItems
