    post:
      tags: [forms]
      operationId: publishForm
      summary: Terbitkan form sehingga pelapor bisa melihat dan mengirim; minimal satu pertanyaan (RF-06)
      responses:
        '200':
          description: OK; status menjadi published
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Form' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /forms/{formId}/unpublish:
    parameters:
      - { name: formId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [forms]
      operationId: unpublishForm
      summary: Kembalikan form ke draft; pelapor tidak bisa melihat atau mengirim lagi (RF-06)
