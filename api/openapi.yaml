        kind: { type: string, enum: [tasks, series] }
        items:
          type: array
          maxItems: 50
          items:
            type: object
            required: [id, title, status, status_group, due_date, importance]
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              status: { type: string }
              status_group: { type: string }
              due_date: { type: string, description: Kosong jika tidak ada }
              importance: { type: string }
        result: { $ref: '#/components/schemas/AnalyticsResult' }
    AnalyticsLabel:
      type: object
      required: [key, label]
      properties:
        key: { type: string }
        label: { type: string }
    AnalyticsResult:
      type: object
      required: [rows, total]
      properties:
        total: { type: number }
        rows:
          type: array
          items:
            type: object
            required: [group, break, value]
            properties:
              group: { $ref: '#/components/schemas/AnalyticsLabel' }
              break:
                nullable: true
                allOf: [{ $ref: '#/components/schemas/AnalyticsLabel' }]
              value: { type: number }
    ReportDefinition:
