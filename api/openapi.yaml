    get:
      tags: [webhooks]
      operationId: listWebhookDeliveries
      summary: Log pengiriman terbaru (100)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, event_id, event_type, status, attempts, created_at]
