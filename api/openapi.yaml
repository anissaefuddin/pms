  /auth/otp/request:
    post:
      operationId: requestLoginCode
      summary: Kirim kode masuk sekali pakai ke email (AUTH-08); selalu 202 agar tidak membocorkan siapa yang punya akun
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, maxLength: 254 }
      responses:
        '202': { description: Diterima; bila alamat milik pengguna aktif, kode dikirim (satu per menit per orang) }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/otp/verify:
    post:
      operationId: verifyLoginCode
      summary: Masuk dengan kode (AUTH-08); lima percobaan per kode, sekali pakai, berlaku 10 menit
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, code]
              properties:
                email: { type: string, maxLength: 254 }
                code: { type: string, maxLength: 16 }
      responses:
        '200':
          description: Berhasil; cookie session diset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '202':
          description: Kode benar tetapi user memakai 2FA; lanjutkan dengan `POST /auth/login/2fa`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwoFactorChallenge' }
