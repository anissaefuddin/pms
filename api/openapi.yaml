openapi: 3.0.3
info:
  title: PMS API
  version: 0.1.0
  description: |
    Kontrak API PMS untuk milestone M0 + M1 (rilis 1.0 bertahap). Sumber kebenaran:
    kode Go server stub (`oapi-codegen`) dan tipe TypeScript (`openapi-typescript`) dihasilkan dari file ini.

    **Konvensi**
    - Base path `/api/v1`. Autentikasi: cookie session `pms_session` (httpOnly). Tidak ada Bearer token.
    - Request yang mengubah data wajib berasal dari origin yang sama (CSRF: pemeriksaan header `Origin`).
    - Update item/komentar memakai optimistic locking: kirim `If-Match: "<version>"`. Versi usang → 409 `version_conflict`; tanpa header → 428 `precondition_required`. Setiap respons objek berversi memuat `ETag: "<version>"`.
    - Item tanpa akses mengembalikan **404**, bukan 403 (lihat ARCHITECTURE §6.2).
    - Daftar memakai pagination kursor: `?limit=` (default 50, maks 200) dan `?cursor=`; respons `{ items, next_cursor }`.
    - Error memakai `application/problem+json` dengan `code` stabil (lihat WORKFLOWS §10).
    - Rich text (deskripsi, komentar) adalah dokumen ProseMirror JSON, bukan HTML.
servers:
  - url: /api/v1
tags:
  - { name: webhooks, description: "Langganan webhook (API-02)" }
  - { name: auth, description: "Login, session, password, undangan" }
  - { name: users, description: "Profil, user, grup, seat" }
  - { name: spaces, description: "Space dan sharing" }
  - { name: settings, description: "Pengaturan workspace" }
  - { name: items, description: "Project, folder, task" }
  - { name: views, description: "Definisi view Table dan Board" }
  - { name: collaboration, description: "Komentar, lampiran, aktivitas" }
  - { name: inbox, description: "Notifikasi, My to-do, pencarian" }
  - { name: recycle, description: "Recycle bin" }
  - { name: forms, description: "Form permintaan" }
  - { name: blueprints, description: "Blueprint: struktur item yang dipakai ulang" }
  - { name: system, description: "Workflow, realtime, health" }

security:
  - cookieAuth: []
  - bearerKey: []

paths:
  /users/{userId}/capacity:
    parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getResourceCapacity
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceSchedule'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    put:
      operationId: saveResourceCapacity
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceSchedule'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceSchedule'
  /utilization:
    get:
      operationId: getUtilization
      summary: Utilization planned vs actual per orang (RSC-06); menit terencana = effort task + booking, aktual = time entry
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: role, in: query, schema: { type: string } }
        - { name: skill, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/UtilizationRow' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /items/{projectId}/baselines:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listBaselines
      summary: Baseline Gantt sebuah project, terbaru dulu (VIEW-05C)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Baseline' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createBaseline
      summary: Bekukan tanggal item project yang terlihat; baseline tidak dapat diubah atau dihapus (maks 10 per project)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Baseline' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /spaces/{spaceId}/create-menu:
    parameters:
      - { $ref: '#/components/parameters/SpaceId' }
    get:
      tags: [spaces]
      operationId: getSpaceCreateMenu
      summary: Tipe item aktif untuk menu "+" sebuah Space (SPC-14), urutan default tipe; hak View
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CreateMenu' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [spaces]
      operationId: setSpaceCreateMenu
      summary: Pilih tipe yang muncul di menu "+" (hak Edit, If-Match versi Space). Hanya kemudahan UI; API tetap menerima tipe apa pun (D-99)
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: array, minItems: 1, items: { type: string }, description: Kunci tipe aktif }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CreateMenu' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /spaces/{spaceId}/bookmarks:
    parameters:
      - { $ref: '#/components/parameters/SpaceId' }
    get:
      operationId: listSpaceBookmarks
      summary: Bookmark URL eksternal sebuah Space (NAV-08); hak View
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SpaceBookmark' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createSpaceBookmark
      summary: Tambah bookmark; hanya URL http/https (hak Edit, maks 100 per Space)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpaceBookmarkInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceBookmark' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /spaces/{spaceId}/bookmarks/{bookmarkId}:
    parameters:
      - { $ref: '#/components/parameters/SpaceId' }
      - { name: bookmarkId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateSpaceBookmark
      summary: Ubah url, title, description, atau position (hak Edit)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                url: { type: string, maxLength: 2000 }
                title: { type: string, minLength: 1, maxLength: 200 }
                description: { type: string, maxLength: 1000 }
                position: { type: integer, minimum: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceBookmark' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteSpaceBookmark
      summary: Hapus bookmark (hak Edit)
      responses:
        '204': { description: Dihapus }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /feedback:
    get:
      operationId: listFeedback
      summary: Umpan balik terbaru (maks 200); hanya admin (NAV-09)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FeedbackEntry' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createFeedback
      summary: Kirim umpan balik; 5 per pengguna per jam, 429 bila lebih
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject]
              additionalProperties: false
              properties:
                subject: { type: string, minLength: 1, maxLength: 200 }
                rating: { type: integer, minimum: 1, maximum: 5, nullable: true }
                comment: { type: string, maxLength: 4000 }
                page: { type: string, maxLength: 200, description: 'Path aplikasi asal; query dan fragment dibuang' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /baselines/{baselineId}/variance:
    parameters:
      - { name: baselineId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getBaselineVariance
      summary: Selisih tanggal item terhadap baseline, dalam hari (positif = lebih lambat dari rencana)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/BaselineVariance' }
        '404': { $ref: '#/components/responses/Problem' }
  /api-keys:
    get:
      operationId: listApiKeys
      summary: API key milik pemanggil (tanpa nilai rahasia; hanya sesi)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ApiKey' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createApiKey
      summary: Buat API key; nilai penuh hanya dikembalikan sekali di respons ini (hanya sesi)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scope]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                scope: { type: string, enum: [read, write], description: "read = hanya GET; write = semua metode. Hak tetap mengikuti pembuatnya (policy)." }
                expires_at: { type: string, format: date-time, nullable: true }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyCreated' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api-keys/{keyId}/rotate:
    post:
      operationId: rotateApiKey
      summary: Ganti nilai rahasia; nilai lama langsung tidak berlaku (hanya sesi)
      parameters:
        - { name: keyId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyCreated' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api-keys/{keyId}:
    delete:
      operationId: revokeApiKey
      summary: Cabut API key; efektif segera (hanya sesi)
      parameters:
        - { name: keyId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Dicabut }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /rates:
    get:
      operationId: listRates
      summary: Tarif per jam per orang atau job role, berversi menurut tanggal efektif (admin)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/HourlyRate' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createRate
      summary: Tarif baru berlaku mulai tanggal tertentu; entry lama tidak berubah karena rate snapshot (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rate_minor, effective_from]
              additionalProperties: false
              properties:
                user_id: { type: string, format: uuid }
                role_id: { type: string, format: uuid }
                rate_minor: { type: integer, format: int64, minimum: 0, maximum: 100000000 }
                effective_from: { type: string, format: date }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /connectors:
    get:
      operationId: listConnectors
      summary: Admin. Jenis konektor terdaftar dan pemasangan (rahasia hanya nama)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { kinds: { type: array, items: { type: string } }, items: { type: array, items: { $ref: '#/components/schemas/ConnectorInstall' } } } } } } }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: installConnector
      summary: Admin. Pasang konektor; rahasia dienkripsi dengan PMS_CONNECTOR_KEY (422 key_not_configured bila kunci tidak ada)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, name]
              properties:
                kind: { type: string }
                name: { type: string, minLength: 1, maxLength: 120 }
                config: { type: object, additionalProperties: true }
                secrets: { type: object, additionalProperties: { type: string } }
      responses:
        '201': { description: Dibuat, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectorInstall' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /connectors/{connectorId}:
    parameters:
      - { name: connectorId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: configureConnector
      summary: Admin. Ubah nama, config, atau rahasia (digabung per nama; nilai kosong menghapus)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                config: { type: object, additionalProperties: true }
                secrets: { type: object, additionalProperties: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectorInstall' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /connectors/{connectorId}/disable:
    parameters:
      - { name: connectorId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: disableConnector
      summary: Admin. Nonaktifkan; sinkronisasi ditolak (409) sampai diaktifkan lagi
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectorInstall' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /connectors/{connectorId}/enable:
    parameters:
      - { name: connectorId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: enableConnector
      summary: Admin. Aktifkan kembali
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectorInstall' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /connectors/{connectorId}/links:
    parameters:
      - { name: connectorId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: linkConnectorItem
      summary: Admin. Tautkan Item ke record eksternal (tanpa external_id record eksternal dibuat dari Item)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_id]
              properties:
                item_id: { type: string, format: uuid }
                external_id: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { external_id: { type: string } } } } } }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /connectors/{connectorId}/sync:
    parameters:
      - { name: connectorId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: syncConnector
      summary: Admin. Sinkronkan dua arah (idempoten); konflik dicatat, tidak ditimpa
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pushed: { type: integer }
                  pulled: { type: integer }
                  conflicts: { type: integer }
                  pending: { type: integer }
                  skipped: { type: integer }
                  unchanged: { type: integer }
        '409': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /connectors/{connectorId}/github-webhook:
    parameters:
      - { name: connectorId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: githubConnectorWebhook
      summary: Webhook GitHub (tanpa sesi). Tanda tangan HMAC X-Hub-Signature-256 dengan rahasia webhook_secret konektor; event issues menjadwalkan sinkron segera
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        '204': { description: Diterima }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /connectors/{connectorId}/conflicts:
    parameters:
      - { name: connectorId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: status, in: query, required: false, schema: { type: string, enum: [open, all] } }
    get:
      operationId: listConnectorConflicts
      summary: Admin. Konflik sinkronisasi (default hanya yang terbuka)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/ConnectorConflict' } } } } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /connector-conflicts/{conflictId}/resolve:
    parameters:
      - { name: conflictId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: resolveConnectorConflict
      summary: Admin. Pilih sisi yang dipakai (item atau remote); sisi lain ditimpa dengan sengaja, teksnya tetap di catatan konflik
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution]
              properties:
                resolution: { type: string, enum: [item, remote] }
      responses:
        '204': { description: Diselesaikan }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /items/{projectId}/gantt-snapshots:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listGanttSnapshots
      summary: Riwayat snapshot Gantt publik sebuah project (tanpa tautan; tautan hanya tampil sekali saat dibuat)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/GanttSnapshot' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createGanttSnapshot
      summary: Bekukan Gantt project menjadi salinan baca-saja yang dapat dibuka lewat tautan rahasia (butuh Edit)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, expires_at]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                expires_at: { type: string, format: date-time, description: Antara 1 menit dan 90 hari dari sekarang }
                show_assignees: { type: boolean, default: false }
      responses:
        '201':
          description: Dibuat; token hanya muncul di jawaban ini
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GanttSnapshot' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /gantt-snapshots/{snapshotId}:
    parameters:
      - { name: snapshotId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: revokeGanttSnapshot
      summary: Cabut tautan snapshot (butuh Edit pada project)
      responses:
        '204': { description: Dicabut }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /oauth/clients:
    get:
      operationId: listOAuthClients
      summary: Daftar OAuth app terdaftar (admin; secret tidak pernah dikembalikan lagi)
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createOAuthClient
      summary: Daftarkan OAuth app (admin); client_secret hanya tampil sekali di respons ini
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, redirect_uris]
              properties:
                name: { type: string }
                redirect_uris: { type: array, items: { type: string } }
      responses:
        '201': { description: Dibuat }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /oauth/clients/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: deleteOAuthClient
      summary: Hapus OAuth app dan cabut semua grant-nya (admin)
      responses:
        '204': { description: Dihapus }
        '404': { $ref: '#/components/responses/Problem' }
  /oauth/authorize:
    get:
      operationId: getOAuthAuthorizeInfo
      summary: Validasi permintaan otorisasi untuk layar persetujuan (redirect URI harus sama persis, PKCE S256 wajib)
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/Problem' }
    post:
      operationId: approveOAuthAuthorize
      summary: Setujui atau tolak; mengembalikan redirect_to berisi code sekali pakai (60 detik) dan state. Hanya lewat sesi cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, redirect_uri, scope, state, code_challenge, code_challenge_method, approve]
              properties:
                client_id: { type: string }
                redirect_uri: { type: string }
                scope: { type: string, description: 'read, write (dipisah spasi)' }
                state: { type: string }
                code_challenge: { type: string }
                code_challenge_method: { type: string, enum: [S256] }
                approve: { type: boolean }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/Problem' }
  /oauth/token:
    post:
      operationId: oauthToken
      summary: Tukar code (+ code_verifier) atau refresh_token dengan token; form-urlencoded, klien memakai client_id dan client_secret. Token disimpan sebagai hash
      security: []
      responses:
        '200': { description: access_token, refresh_token, token_type, expires_in, scope }
        '400': { description: invalid_grant atau unsupported_grant_type }
        '401': { description: invalid_client }
  /oauth/grants:
    get:
      operationId: listOAuthGrants
      summary: Authorized apps milik pengguna
      responses:
        '200': { description: OK }
  /oauth/grants/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: revokeOAuthGrant
      summary: Cabut app; access dan refresh token langsung tidak berlaku
      responses:
        '204': { description: Dicabut }
        '404': { $ref: '#/components/responses/Problem' }
  /public/gantt/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    get:
      operationId: getPublicGanttSnapshot
      summary: Snapshot Gantt untuk orang tanpa akun; tidak membaca cookie, 404 bila tidak ada, kedaluwarsa, atau dicabut
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicGanttSnapshot' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolio/timeline:
    post:
      operationId: getPortfolioTimeline
      summary: Timeline gabungan 1 sampai 20 project yang terlihat, dengan dependensi lintas project (SCH-01); project tersembunyi dijawab 404
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_ids]
              additionalProperties: false
              properties:
                project_ids: { type: array, minItems: 1, maxItems: 20, items: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [projects, items, dependencies]
                properties:
                  projects:
                    type: array
                    items:
                      type: object
                      required: [id, title]
                      properties:
                        id: { type: string, format: uuid }
                        title: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      required: [project_id, item]
                      properties:
                        project_id: { type: string, format: uuid }
                        item: { $ref: '#/components/schemas/Item' }
                  dependencies:
                    type: array
                    items: { $ref: '#/components/schemas/ItemDependency' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /dashboards/{dashboardId}/public-link:
    parameters:
      - { name: dashboardId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getDashboardPublicLink
      summary: Status tautan publik dashboard (butuh Edit); tidak pernah mengulang token
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardPublicLink' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: putDashboardPublicLink
      summary: Aktifkan tautan publik atau ganti dengan token, kedaluwarsa, dan password baru; token hanya tampil di jawaban ini (DASH-07)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expires_at]
              additionalProperties: false
              properties:
                expires_at: { type: string, format: date-time, description: Antara 1 menit dan 365 hari dari sekarang }
                password: { type: string, description: Opsional; tautan memakai aturan password yang sama dengan akun }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardPublicLink' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteDashboardPublicLink
      summary: Matikan tautan publik
      responses:
        '204': { description: Dimatikan }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /public/dashboards/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    post:
      operationId: viewPublicDashboard
      summary: Lihat dashboard lewat tautan publik; tidak membaca cookie. Data dihitung dengan hak pembuat tautan dan widget finansial disamarkan
      security: []
      requestBody:
        content:
          application/json:
