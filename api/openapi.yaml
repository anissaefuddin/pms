        otp_login_enabled: { type: boolean, description: Izinkan masuk dengan kode sekali pakai lewat email (AUTH-08) }
    AccessPolicy:
      allOf:
        - { $ref: '#/components/schemas/AccessPolicyInput' }
        - type: object
          required: [version, your_ip, override_active]
          properties:
            version: { type: integer }
            your_ip: { type: string, description: Alamat yang dilihat server untuk permintaan ini }
            override_active: { type: boolean, description: PMS_DISABLE_IP_ALLOWLIST aktif sehingga daftar tidak ditegakkan }
    SsoConfigInput:
