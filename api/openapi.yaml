      - { $ref: '#/components/parameters/SpaceId' }
    post:
      tags: [automation]
      operationId: dryRunAutomation
      summary: Uji definisi pada satu item tanpa menjalankan apa pun (AUT-05)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [definition, item_id]
              properties:
                definition: { $ref: '#/components/schemas/AutomationDefinition' }
