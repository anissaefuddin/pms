        kind: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        issuer: { type: string }
        client_id: { type: string }
        secret_set: { type: boolean }
        auto_link: { type: boolean }
        allowed_domains: { type: array, items: { type: string } }
        redirect_url: { type: string, description: Daftarkan persis alamat ini di penyedia }
        key_configured: { type: boolean, description: PMS_SSO_KEY terisi }
        updated_at: { type: string, format: date-time, nullable: true }
        entity_id: { type: string, description: 'SAML: entity ID penyedia layanan ini' }
        acs_url: { type: string, description: 'SAML: alamat ACS (HTTP-POST)' }
        metadata_url: { type: string }
        idp_entity_id: { type: string }
        idp_sign_on_url: { type: string }
        email_attribute: { type: string }
        has_metadata: { type: boolean }
    LinkedIdentity:
      type: object
      required: [kind, provider_name, email, created_at, last_login_at]
      properties:
        kind: { type: string }
        provider_name: { type: string }
        email: { type: string }
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time, nullable: true }
    AuditEvent:
      type: object
      required: [id, at, actor_id, actor_name, action, target_type, target_id, ip, details]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        actor_id: { type: string, format: uuid, nullable: true }
        actor_name: { type: string }
        action: { type: string, description: 'Bentuk "area.verb"' }
        target_type: { type: string }
        target_id: { type: string }
        ip: { type: string }
        details: { type: object, additionalProperties: true }
    AuditPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/AuditEvent' } }
        next_cursor: { type: string, nullable: true }
    DashboardList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DashboardSummary' }
    DashboardWidgetConfig:
      type: object
      additionalProperties: false
      properties:
        show_legend: { type: boolean, description: "Untuk pie, column, bar, line, area, dan burndown" }
        show_labels: { type: boolean, description: "Untuk pie, column, bar, line, area, dan burndown" }
        description: { type: string, maxLength: 500, description: Keterangan singkat di bawah judul widget (DASH-04) }
        pie_style: { type: string, enum: [classic, donut, ring], description: Khusus pie }
        list: { type: string, enum: [todo_this_week, to_review, completed, assigned_to_me], description: Khusus task_list (DASH-01); gunakan list atau template, bukan keduanya }
        template: { type: string, enum: [my_tasks, overdue, followed, backlog, starred], description: Khusus task_list (DASH-02) }
        query: { $ref: '#/components/schemas/AnalyticsQuery' }
    DashboardWidgetInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        type: { type: string, enum: [task_list, indicator, pie, column, bar, line, table, area, pivot, burndown, completion], description: 'burndown memakai metrik count atau effort_minutes tanpa pengelompokan, 30 hari terakhir; pivot butuh group_by dan break_by' }
        position: { type: integer, minimum: 0, maximum: 9999 }
        config: { $ref: '#/components/schemas/DashboardWidgetConfig' }
    DashboardWidget:
      allOf:
        - { $ref: '#/components/schemas/DashboardWidgetInput' }
        - type: object
          required: [id, position, config]
          properties:
            id: { type: string, format: uuid }
            position: { type: integer, minimum: 0, maximum: 9999 }
            config: { $ref: '#/components/schemas/DashboardWidgetConfig' }
    Dashboard:
      allOf:
        - { $ref: '#/components/schemas/DashboardSummary' }
        - type: object
          required: [widgets]
          properties:
            widgets:
              type: array
              maxItems: 100
              items: { $ref: '#/components/schemas/DashboardWidget' }

    ExcelExport:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, ready, failed] }
        error: { type: string }
    ExcelPreview:
      type: object
      required: [columns, rows, errors, sample, digest]
      properties:
        columns: { type: array, items: { type: string } }
        rows: { type: integer }
        digest: { type: string }
        sample:
          type: array
          items: { type: array, items: { type: string } }
        errors:
          type: array
          items:
            type: object
            required: [row, column, message]
            properties:
              row: { type: integer }
              column: { type: string }
              message: { type: string }

    TimeEntryFields:
      type: object
      properties:
        minutes: { type: integer, minimum: 1, maximum: 1440 }
        category: { type: string, maxLength: 80 }
        comment: { type: string, maxLength: 2000 }
        billing_type: { type: string, enum: [billable, non_billable] }
    TimeEntry:
      allOf:
        - { $ref: '#/components/schemas/TimeEntryFields' }
        - type: object
          required: [id, item_id, user_id, date, minutes, category, comment, billing_type, locked, version]
          properties:
            id: { type: string, format: uuid }
            item_id: { type: string, format: uuid }
            user_id: { type: string, format: uuid }
            date: { type: string, format: date }
            minutes: { type: integer, minimum: 1, maximum: 1440 }
            category: { type: string, maxLength: 80 }
            comment: { type: string, maxLength: 2000 }
            billing_type: { type: string, enum: [billable, non_billable] }
            locked: { type: boolean }
            version: { type: integer }
            item_title: { type: string }
            user_name: { type: string }
    TimeEntryPage:
      type: object
      required: [items, next_offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TimeEntry' }
        next_offset: { type: integer, nullable: true }
        total_minutes: { type: integer, description: Total menit seluruh hasil yang difilter (bukan halaman); hanya Timelog project }
        billable_minutes: { type: integer }
        non_billable_minutes: { type: integer }

    # ── Umum ──
    Problem:
      type: object
      required: [type, title, status, code, request_id]
      properties:
        type: { type: string, example: about:blank }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          description: Kode stabil, lihat WORKFLOWS §10
          example: version_conflict
        detail: { type: string }
        request_id: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
    RichText:
      type: object
      description: Dokumen ProseMirror JSON (TipTap). Server memvalidasi node dan mark yang diizinkan.
      required: [type]
      properties:
        type: { type: string, enum: [doc] }
        content:
          type: array
          items: { type: object }
      additionalProperties: true
    Page:
      type: object
      properties:
        next_cursor: { type: string, nullable: true }

    # ── Auth & user ──
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    InvitationInfo:
      type: object
      required: [email, expires_at]
      properties:
        email: { type: string, format: email }
        invited_by_name: { type: string }
        expires_at: { type: string, format: date-time }
    AcceptInvitationRequest:
      type: object
      required: [token, first_name, last_name, password, accept_terms]
      properties:
        token: { type: string }
        first_name: { type: string, minLength: 1, maxLength: 80 }
        last_name: { type: string, minLength: 1, maxLength: 80 }
        password: { type: string, format: password, minLength: 8 }
        department: { type: string, maxLength: 80 }
        job_title: { type: string, maxLength: 80 }
        accept_terms: { type: boolean, enum: [true] }
    UserType:
      type: string
      enum: [admin, regular, external, collaborator, viewer]
    UserStatus:
      type: string
      enum: [invited, active, deactivated]
    User:
      type: object
      required: [id, email, first_name, last_name, user_type, status]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        first_name: { type: string }
        last_name: { type: string }
        user_type: { $ref: '#/components/schemas/UserType' }
        status: { $ref: '#/components/schemas/UserStatus' }
        job_title: { type: string, nullable: true }
        department: { type: string, nullable: true }
        last_login_at: { type: string, format: date-time, nullable: true }
    UserPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/User' }
    TwoFactorChallenge:
      type: object
      required: [two_factor_required, challenge]
      properties:
        two_factor_required: { type: boolean, enum: [true] }
        challenge: { type: string }
    TwoFactorStatus:
      type: object
      required: [configured, enabled, enabled_at, backup_codes_remaining]
      properties:
        configured: { type: boolean, description: false bila server belum punya PMS_2FA_KEY }
        enabled: { type: boolean }
        enabled_at: { type: string, format: date-time, nullable: true }
        backup_codes_remaining: { type: integer, format: int32 }
    TwoFactorReauth:
      type: object
      required: [password, code]
      additionalProperties: false
      properties:
        password: { type: string }
        code: { type: string, maxLength: 32, description: Kode TOTP 6 digit atau kode cadangan }
    Me:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [locale, timezone, date_format, time_format, week_start, personal_space_id, account_name, capabilities, onboarding_pending]
          properties:
            company: { type: string, nullable: true }
            country: { type: string, nullable: true }
            location: { type: string, nullable: true }
            phone: { type: string, nullable: true }
            locale: { type: string, example: en }
            timezone: { type: string, example: Asia/Jakarta }
            date_format: { type: string, enum: [dd/mm/yyyy, mm/dd/yyyy, yyyy-mm-dd] }
            time_format: { type: string, enum: ['12h', '24h'] }
            week_start: { type: string, enum: [monday, sunday, saturday] }
            density: { type: string, enum: [compact, comfortable], default: compact }
            theme: { type: string, enum: [light, dark, system], default: system }
            accent: { type: string, enum: [blue, teal, violet, green], default: blue, description: Tema warna (SET-06) }
            comment_shortcut: { type: string, enum: [mod_enter, enter], default: mod_enter }
            sidebar_hidden:
              type: array
              deprecated: true
              description: Entri sidebar opsional yang disembunyikan user (NAV-02); Search dan Inbox selalu tampil. Dipertahankan satu rilis setelah sidebar_pinned
              items: { $ref: '#/components/schemas/SidebarKey' }
            sidebar_pinned:
              type: array
              description: Entri sidebar yang disematkan user, dalam urutan tampil (paling atas dulu). Tanpa duplikat; kosong berarti tidak ada yang disematkan. Search dan Inbox tidak termasuk
              items: { $ref: '#/components/schemas/SidebarKey' }
            view_expansion:
              type: object
              description: Expansi hierarki per view milik user ini (WA-D05); kunci = id view. Hanya user ini yang membacanya
              additionalProperties:
                type: object
                required: [rows, gantt_collapsed]
                properties:
                  rows: { type: array, items: { type: string, format: uuid } }
                  gantt_collapsed: { type: boolean }
            view_prefs:
              type: object
              description: Preferensi view personal per workspace (WA-D07), kunci = id Space, Project, atau Folder. Hanya user ini yang membacanya
              additionalProperties:
                type: object
                required: [hidden, order]
                properties:
                  hidden: { type: array, items: { type: string, format: uuid } }
                  order: { type: array, items: { type: string, format: uuid } }
            email_muted:
              type: array
              description: Grup email notifikasi yang dimatikan user (SET-05); kosong berarti semua aktif
              items: { $ref: '#/components/schemas/EmailGroup' }
            onboarding_pending: { type: boolean, description: true bagi administrator selama wizard first-run (AUTH-07) belum selesai atau dilewati }
            default_task_duration_days: { type: integer, nullable: true, minimum: 0, maximum: 3650, description: Durasi awal task baru (SET-03) }
            default_task_effort_minutes: { type: integer, nullable: true, minimum: 0, maximum: 525600, description: Effort awal task baru (SET-03) }
            account_name: { type: string, description: Nama workspace }
            personal_space_id: { type: string, format: uuid }
            capabilities:
              type: object
              description: Kemampuan global; kemampuan per item dihitung server
              properties:
                manage_users: { type: boolean }
                create_space: { type: boolean }
    MeUpdate:
      type: object
      properties:
        first_name: { type: string, minLength: 1, maxLength: 80 }
        last_name: { type: string, minLength: 1, maxLength: 80 }
        company: { type: string, maxLength: 120 }
        job_title: { type: string, maxLength: 80 }
        department: { type: string, maxLength: 80 }
        country: { type: string, maxLength: 2 }
        location: { type: string, maxLength: 120 }
        phone: { type: string, maxLength: 32 }
        locale: { type: string, enum: [en] }
        timezone: { type: string }
        date_format: { type: string, enum: [dd/mm/yyyy, mm/dd/yyyy, yyyy-mm-dd] }
        time_format: { type: string, enum: ['12h', '24h'] }
        week_start: { type: string, enum: [monday, sunday, saturday] }
        density: { type: string, enum: [compact, comfortable] }
        theme: { type: string, enum: [light, dark, system] }
        accent: { type: string, enum: [blue, teal, violet, green] }
        comment_shortcut: { type: string, enum: [mod_enter, enter] }
        sidebar_hidden:
          type: array
          deprecated: true
          items: { $ref: '#/components/schemas/SidebarKey' }
        sidebar_pinned:
          type: array
          description: Urutan tampil dipertahankan sesuai kiriman; nilai duplikat ditolak (422)
          items: { $ref: '#/components/schemas/SidebarKey' }
        email_muted:
          type: array
          items: { $ref: '#/components/schemas/EmailGroup' }
        default_task_duration_days: { type: integer, nullable: true, minimum: 0, maximum: 3650 }
        default_task_effort_minutes: { type: integer, nullable: true, minimum: 0, maximum: 525600 }
    EmailGroup:
      type: string
      description: task_changes mencakup perubahan status dan approval; notifikasi komentar tidak pernah dikirim lewat email
      enum: [mention, assigned, shared, task_changes, report]
    Account:
      type: object
      required: [name, created_at, role, joined_at, administrators, seats]
      properties:
        name: { type: string }
        created_at: { type: string, format: date-time }
        role: { $ref: '#/components/schemas/UserType' }
        joined_at: { type: string, format: date-time }
        administrators:
          type: array
          items:
            type: object
            required: [id, name, email]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              email: { type: string, format: email }
        seats: { $ref: '#/components/schemas/Seats' }
    SidebarKey:
      type: string
      enum: [created_by_me, workload, calendars, dashboards, my_todo, request_forms, timesheets, reports, stream, starred, portfolio, reviews]
    InviteRequest:
      type: object
      required: [email, user_type]
      properties:
        email: { type: string, format: email }
        user_type: { $ref: '#/components/schemas/UserType' }
        message: { type: string, maxLength: 500 }
        share:
          type: array
          description: Space atau item yang langsung dibagikan ke user baru
          items:
            type: object
            required: [target_type, target_id, role]
            properties:
              target_type: { $ref: '#/components/schemas/ShareTargetType' }
              target_id: { type: string, format: uuid }
              role: { $ref: '#/components/schemas/ShareRole' }
    Seats:
      type: object
      required: [max, used, pending, available]
      properties:
        max: { type: integer, description: Dari env PMS_MAX_SEATS }
        used: { type: integer, description: User berstatus active }
        pending: { type: integer, description: User berstatus invited }
        available: { type: integer }
    Group:
      type: object
      required: [id, name, member_ids]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        member_ids:
          type: array
          items: { type: string, format: uuid }

    # ── Space & share ──
    SpaceKind:
      type: string
      enum: [shared, personal]
    SpaceTemplate:
      type: object
      required: [id, name, category, description, version, compatible, counts]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        description: { type: string }
        version: { type: integer }
        compatible: { type: boolean, description: false bila template ditulis untuk versi PMS yang lebih baru }
        counts:
          type: object
          required: [projects, tasks, views, forms, custom_fields]
          properties:
            projects: { type: integer }
            tasks: { type: integer }
            views: { type: integer }
            forms: { type: integer }
            custom_fields: { type: integer }
    Space:
      type: object
      required: [id, name, kind, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        kind: { $ref: '#/components/schemas/SpaceKind' }
        version: { type: integer }
        locked: { type: boolean, description: 'Dikunci administrator: isi hanya dibagikan ke orang yang sudah punya akses ke space, dan hanya admin yang mengubah sharing space atau memindahkan item keluar (D-95)' }
        my_capabilities:
          type: array
          items: { $ref: '#/components/schemas/Capability' }
    SpaceCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        shares:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/ShareInput' }
    SpaceUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000, nullable: true }
        locked: { type: boolean, description: Hanya administrator }
    Capability:
      type: string
      enum: [view, comment, change_status, attach, edit, create, delete, share]
    ShareRole:
      type: string
      enum: [read, limited, editor, full]
    ShareTargetType:
      type: string
      enum: [space, item]
    PrincipalType:
      type: string
      enum: [user, group]
    ShareInput:
      type: object
      required: [principal_type, principal_id, role]
      properties:
        principal_type: { $ref: '#/components/schemas/PrincipalType' }
        principal_id: { type: string, format: uuid }
        role: { type: string, pattern: '^(read|limited|editor|full|custom:[0-9a-fA-F-]{36})$', description: 'Peran bawaan atau custom:<id> dari /custom-roles' }
    Share:
      allOf:
        - $ref: '#/components/schemas/ShareInput'
        - type: object
          required: [principal_name]
          properties:
            principal_name: { type: string }
            role_name: { type: string, description: Nama peran kustom (kosong untuk peran bawaan) }
            inherited_from:
              type: string
              format: uuid
              nullable: true
              description: Container tempat share ini berasal bila diwarisi
    WorkScheduleInput:
      type: object
      required: [working_days, daily_hours, exceptions]
      properties:
        working_days:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          description: Hari kerja, 0 = Minggu sampai 6 = Sabtu
          items: { type: integer, minimum: 0, maximum: 6 }
        daily_hours: { type: integer, minimum: 1, maximum: 24 }
        exceptions:
          type: array
          maxItems: 1000
          description: Tanggal libur; tanggal harus unik
          items:
            type: object
            required: [date, name]
            properties:
              date: { type: string, format: date }
              name: { type: string, maxLength: 120 }
    WorkSchedule:
      allOf:
        - $ref: '#/components/schemas/WorkScheduleInput'
        - type: object
          required: [version]
          properties:
            version: { type: integer }
    ShareReplace:
      type: object
      required: [shares]
      properties:
        shares:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/ShareInput' }

    # ── Item ──
    ItemTypeLayout:
      type: object
      description: 'Bagian panel detail: {sections: [{title, fields: [blok bawaan atau id custom field]}]}; kosong = tata letak standar'
      additionalProperties: true
    AutomationDefinition:
      type: object
      description: 'Skema tertutup WHEN/IF/THEN. when.type: item.status_changed (to_status_id), item.assigned (user_id), item.created (item_type), item.due_reached (days_before 0-30), form.submitted (form_id). if: hingga 10 kondisi (field importance, status_group, item_type, assignee, due_date, start_date, fields.<id>). then: 1-10 aksi (set_field, assign, comment, notify, create_item). Kunci yang tidak dikenal ditolak'
      required: [when, then]
      properties:
        when: { type: object, additionalProperties: true }
        if: { type: array, maxItems: 10, items: { type: object, additionalProperties: true } }
        then: { type: array, minItems: 1, maxItems: 10, items: { type: object, additionalProperties: true } }
    AutomationRun:
      type: object
      required: [id, rule_id, version, event_id, event_type, action_index, status, detail, created_at]
      properties:
        id: { type: string, format: uuid }
        rule_id: { type: string, format: uuid }
        version: { type: integer }
        event_id: { type: string, format: uuid }
        event_type: { type: string }
        action_index: { type: integer, description: -1 untuk hasil tingkat aturan }
        item_id: { type: string, format: uuid, nullable: true }
        item_title: { type: string, nullable: true }
        actor_id: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [done, denied, skipped, loop_blocked, quota_blocked, failed] }
        detail: { type: string }
        created_at: { type: string }
    AutomationVersion:
      type: object
      required: [id, version, status, definition, created_at]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        status: { type: string, enum: [draft, published, retired] }
        definition: { $ref: '#/components/schemas/AutomationDefinition' }
        created_at: { type: string }
        published_at: { type: string, nullable: true }
    AutomationRule:
      type: object
      required: [id, space_id, name, owner_id, enabled]
      properties:
        id: { type: string, format: uuid }
        space_id: { type: string, format: uuid }
        container_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        owner_id: { type: string, format: uuid }
        enabled: { type: boolean }
        current_version_id: { type: string, format: uuid, nullable: true }
        versions: { type: array, items: { $ref: '#/components/schemas/AutomationVersion' } }
    ItemTypeRef:
      type: object
      description: Tipe item (bawaan atau kustom); type tetap kelas perilakunya
      required: [id, key, name, icon]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        icon: { type: string }
        layout: { $ref: '#/components/schemas/ItemTypeLayout' }
    ItemTypeDef:
      type: object
      required: [id, key, name, icon, base, is_builtin, active, allowed_children, defaults, layout, version]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        icon: { type: string }
        base: { $ref: '#/components/schemas/ItemType' }
        is_builtin: { type: boolean }
        active: { type: boolean }
        allowed_children:
          type: array
          description: Kosong berarti mengikuti aturan kelas; terisi berarti hanya tipe ini yang boleh menjadi anak
          items: { type: string, format: uuid }
        default_workflow_id: { type: string, format: uuid, nullable: true }
        defaults:
          type: object
          description: 'Nilai awal item baru: importance, duration_days, effort_minutes'
          additionalProperties: true
        layout: { $ref: '#/components/schemas/ItemTypeLayout' }
        version: { type: integer }
    ItemTypeField:
      type: object
      required: [field_id, space_id, name, type, archived, default]
      properties:
        field_id: { type: string, format: uuid }
        space_id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }
        archived: { type: boolean, description: Field yang diarsipkan dilewati saat default diterapkan }
        default: { nullable: true }
    ItemTypeCreate:
      type: object
      required: [key, name, base]
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9_]{1,39}$' }
        name: { type: string, minLength: 1, maxLength: 80 }
        icon: { type: string }
        base: { $ref: '#/components/schemas/ItemType' }
        allowed_children: { type: array, items: { type: string, format: uuid } }
        default_workflow_id: { type: string, format: uuid, nullable: true }
        defaults: { type: object, additionalProperties: true }
        layout: { $ref: '#/components/schemas/ItemTypeLayout' }
    ItemTypeUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        icon: { type: string }
        active: { type: boolean }
        allowed_children: { type: array, items: { type: string, format: uuid } }
        default_workflow_id: { type: string, format: uuid, nullable: true }
        defaults: { type: object, additionalProperties: true }
        layout: { $ref: '#/components/schemas/ItemTypeLayout' }
    ItemType:
      type: string
      enum: [project, folder, task]
    StatusGroup:
      type: string
      enum: [active, completed, deferred, cancelled]
    Status:
      type: object
      required: [id, name, color, group, auto_assign, lock_transitions, allowed_next, required_fields, actor_rule, require_children_done, approval_approver_ids]
      properties:
        required_fields:
          type: array
          description: 'Guard (WF-04): isian yang wajib terisi agar item boleh masuk status ini (due_date, start_date, assignees, description, effort_minutes, atau id custom field)'
          items: { type: string }
        actor_rule: { type: string, enum: [anyone, assignee, admin], description: Siapa yang boleh memindahkan item ke status ini }
        require_children_done: { type: boolean, description: 'Validasi lintas record (WF-05): semua subitem harus selesai atau dibatalkan lebih dulu' }
        approval_approver_ids:
          type: array
          description: 'Approval otomatis (WF-03B): item yang masuk status ini memulai approval untuk pengguna ini'
          items: { type: string, format: uuid }
        approved_status_id: { type: string, format: uuid, nullable: true, description: Status tujuan bila hasil approval Approved }
        rejected_status_id: { type: string, format: uuid, nullable: true, description: Status tujuan bila hasil approval Rejected }
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string, description: "Nama token warna, bukan hex" }
        group: { $ref: '#/components/schemas/StatusGroup' }
        auto_assign: { type: boolean, description: Item yang masuk status ini otomatis menugaskan pengguna yang mengubahnya }
        lock_transitions: { type: boolean, description: "Bila true, item di status ini hanya boleh pindah ke `allowed_next`" }
        allowed_next:
          type: array
          items: { type: string, format: uuid }
    StatusInput:
      type: object
      required: [name, group, color]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        group: { $ref: '#/components/schemas/StatusGroup' }
        color: { type: string, maxLength: 40 }
        auto_assign: { type: boolean }
        lock_transitions: { type: boolean }
    StatusPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        group: { $ref: '#/components/schemas/StatusGroup' }
        color: { type: string, maxLength: 40 }
        auto_assign: { type: boolean }
        lock_transitions: { type: boolean }
        allowed_next:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
        required_fields: { type: array, maxItems: 20, items: { type: string } }
        actor_rule: { type: string, enum: [anyone, assignee, admin] }
        require_children_done: { type: boolean }
        approval_approver_ids: { type: array, maxItems: 20, items: { type: string, format: uuid } }
        approved_status_id: { type: string, format: uuid, nullable: true }
        rejected_status_id: { type: string, format: uuid, nullable: true }
    WorkflowInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
    Approval:
      type: object
      required: [id, item_id, description, due_date, created_by, version, created_at, status, policy, approved_count, total, approvers]
      properties:
        id: { type: string, format: uuid }
        item_id: { type: string, format: uuid }
        description: { type: string }
        due_date: { type: string, format: date, nullable: true }
        created_by: { $ref: '#/components/schemas/UserRef' }
        version: { type: integer, format: int32 }
        created_at: { type: string, format: date-time }
        status:
          type: string
          enum: [pending, approved, rejected]
          description: Any menerima satu persetujuan dan menolak bila semua menolak. All menerima bila semua menyetujui dan menolak pada penolakan pertama.
        policy: { type: string, enum: [any, all] }
        attachment_id: { type: string, format: uuid, nullable: true }
        attachment_version: { type: integer, format: int32, nullable: true }
        approved_count: { type: integer, format: int32, description: Pembilang penghitung "0/2" }
        total: { type: integer, format: int32 }
        approvers:
          type: array
          items:
            type: object
            required: [user, decision, comment, decided_at]
            properties:
              user: { $ref: '#/components/schemas/UserRef' }
              decision: { type: string, enum: [approved, rejected], nullable: true }
              comment: { type: string }
              decided_at: { type: string, format: date-time, nullable: true }
    ApprovalEvent:
      type: object
      required: [id, approval_id, kind, actor, subject, decision, comment, item_version, created_at]
      properties:
        id: { type: integer, format: int64 }
        approval_id: { type: string, format: uuid }
        attachment_id: { type: string, format: uuid, nullable: true, description: 'WA-D08: file yang dirujuk approval; kosong untuk event lama' }
        attachment_version: { type: integer, format: int32, nullable: true }
        kind: { type: string, enum: [approver_requested, approver_removed, decided, withdrawn] }
        actor: { allOf: [{ $ref: '#/components/schemas/UserRef' }], nullable: true }
        subject: { allOf: [{ $ref: '#/components/schemas/UserRef' }], nullable: true }
        decision: { type: string, enum: [approved, rejected], nullable: true }
        comment: { type: string }
        item_version: { type: integer, format: int32, nullable: true, description: Versi item saat peristiwa terjadi }
        created_at: { type: string, format: date-time }
    FileReview:
      type: object
      required: [approval_id, attachment_id, version, filename, size_bytes, description, due_date, decision, comment, requested_by]
      properties:
        approval_id: { type: string, format: uuid }
        attachment_id: { type: string, format: uuid }
        version: { type: integer, format: int32 }
        filename: { type: string }
        size_bytes: { type: integer, format: int64 }
        description: { type: string }
        due_date: { type: string, format: date, nullable: true }
        decision: { type: string, enum: [approved, rejected], nullable: true }
        comment: { type: string }
        requested_by: { type: string }
    ApprovalInput:
      type: object
      required: [approver_ids]
      additionalProperties: false
      properties:
        policy: { type: string, enum: [any, all] }
        description: { type: string, maxLength: 2000 }
        due_date: { type: string, format: date, nullable: true }
        approver_ids:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, format: uuid }
        attachment_id: { type: string, format: uuid, description: "Pin ke versi file (FIL-04); harus bersama attachment_version. Approver bertipe external boleh tanpa akses item dan hanya membaca versi ini" }
        attachment_version: { type: integer, minimum: 1 }
    ApprovalPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        policy: { type: string, enum: [any, all] }
        description: { type: string, maxLength: 2000 }
        due_date: { type: string, format: date, nullable: true }
        approver_ids:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, format: uuid }
    FormElement:
      type: object
      required: [key, kind, label]
      additionalProperties: false
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9_]{0,39}$', description: Stabil di semua revisi form; jawaban tersimpan memakai key ini }
        kind:
          type: string
          enum: [single_line, paragraph, single_choice, multiple_choice, date, number, attachment, assignee, importance, section]
        label: { type: string, minLength: 1, maxLength: 200 }
        help: { type: string, maxLength: 500 }
        required: { type: boolean }
        options: { type: array, maxItems: 50, items: { type: string, maxLength: 100 }, description: Wajib 2-50 untuk single_choice dan multiple_choice }
        min: { type: number }
        max: { type: number }
        max_files: { type: integer, minimum: 1, maximum: 5, description: Wajib untuk attachment }
        multiple: { type: boolean, description: Hanya untuk assignee }
        show_if: { $ref: '#/components/schemas/FormCondition' }
    FormCondition:
      type: object
      description: 'Logika kondisional (FORM-07): tampil hanya bila pertanyaan sebelumnya dijawab tertentu; pertanyaan tersembunyi tidak wajib dan jawabannya dibuang'
      required: [key, op]
      additionalProperties: false
      properties:
        key: { type: string, description: Pertanyaan sebelumnya (bukan section atau attachment) }
        op: { type: string, enum: [equals, not_equals, contains, answered, not_answered] }
        value: { type: string, maxLength: 500 }
    FormPage:
      type: object
      required: [title, elements]
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 120 }
        elements: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/FormElement' } }
    FormDefinition:
      type: object
      required: [pages]
      additionalProperties: false
      properties:
        pages: { type: array, minItems: 1, maxItems: 10, items: { $ref: '#/components/schemas/FormPage' } }
    FormResponseSettings:
      type: object
      required: [item_type, location]
      additionalProperties: false
      properties:
        item_type: { type: string, enum: [task, project] }
        status_id: { type: string, format: uuid, nullable: true, description: Kosong berarti status pertama workflow tujuan }
        location:
          type: object
          required: [space_id]
          additionalProperties: false
          properties:
            space_id: { type: string, format: uuid }
            parent_item_id: { type: string, format: uuid, nullable: true }
        assignee_ids: { type: array, maxItems: 20, items: { type: string, format: uuid } }
        title_question: { type: string, nullable: true, description: Key pertanyaan single_line yang menjadi judul item }
        type_key: { type: string, nullable: true, description: Tipe item kustom yang dibuat (kelasnya harus sama dengan item_type); kosong = tipe bawaan }
        field_map:
          type: object
          description: 'Pemetaan jawaban ke custom field Space tujuan (FORM-09): key pertanyaan ke id field text, number, date, atau select; pilihan dicocokkan lewat label'
          additionalProperties: { type: string, format: uuid }
        email:
          type: object
          nullable: true
          description: 'Wording email konfirmasi untuk pengirim lewat link publik (FORM-04); {title}, {form}, {name} diganti saat dikirim, semua nilai di-escape'
          additionalProperties: false
          properties:
            sender_name: { type: string, maxLength: 80 }
            logo_url: { type: string, maxLength: 500, description: Alamat https saja }
            greeting: { type: string, maxLength: 200 }
            message: { type: string, maxLength: 2000 }
            closing: { type: string, maxLength: 500 }
        routes:
          type: array
          maxItems: 10
          description: Cabang jawaban ke tipe item; rute pertama yang cocok menang
          items:
            type: object
            required: [when, type_key]
            additionalProperties: false
            properties:
              when: { $ref: '#/components/schemas/FormCondition' }
              type_key: { type: string }
              blueprint_id: { type: string, format: uuid, nullable: true, description: 'Blueprint di Space tujuan yang diterapkan pada item cabang ini (struktur anak dan default; isian form menang). Blueprint yang kemudian dihapus dilewati dan item tetap dibuat tanpa struktur' }
        approval:
          type: object
          nullable: true
          required: [approver_ids]
          additionalProperties: false
          properties:
            approver_ids: { type: array, minItems: 1, maxItems: 20, items: { type: string, format: uuid } }
            description: { type: string, maxLength: 2000 }
    FormInput:
      type: object
      required: [name, definition, response]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        definition: { $ref: '#/components/schemas/FormDefinition' }
        response: { $ref: '#/components/schemas/FormResponseSettings' }
    Form:
      type: object
      required: [id, space_id, name, description, definition, response, access, version, created_by, updated_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        space_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        definition: { $ref: '#/components/schemas/FormDefinition' }
        response: { $ref: '#/components/schemas/FormResponseSettings' }
        access: { $ref: '#/components/schemas/FormAccess' }
        public_token: { type: string, nullable: true, description: Token tautan publik; kosong bila tidak ada tautan }
        version: { type: integer, format: int32 }
        created_by: { $ref: '#/components/schemas/UserRef' }
        updated_by: { $ref: '#/components/schemas/UserRef' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FormAccess:
      type: string
      enum: [private, internal]
      description: private = hanya pengelola form di Space; internal = semua user yang login boleh mengisi
    CreateMenu:
      type: object
      required: [items, version]
      properties:
        version: { type: integer }
        items:
          type: array
          items:
            type: object
            required: [key, name, icon, base, enabled]
            properties:
              key: { type: string }
              name: { type: string }
              icon: { type: string }
              base: { $ref: '#/components/schemas/ItemType' }
              enabled: { type: boolean }
    Blueprint:
      type: object
      required: [id, space_id, name, item_type, item_count, created_at]
      properties:
        id: { type: string, format: uuid }
        space_id: { type: string, format: uuid }
        name: { type: string }
        item_type: { type: string, enum: [project, folder, task] }
        item_count: { type: integer }
        created_at: { type: string, format: date-time }
    FormSummary:
      type: object
      required: [id, space_id, space_name, name, description, access, question_count, updated_by, updated_at]
      properties:
        id: { type: string, format: uuid }
        space_id: { type: string, format: uuid }
        space_name: { type: string }
        access: { $ref: '#/components/schemas/FormAccess' }
        public_token: { type: string, nullable: true }
        name: { type: string }
        description: { type: string }
        question_count: { type: integer, format: int32 }
        updated_by: { $ref: '#/components/schemas/UserRef' }
        updated_at: { type: string, format: date-time }
    MyRequest:
      type: object
      required: [id, form_name, item_id, title, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        form_name: { type: string }
        item_id: { type: string, format: uuid }
        title: { type: string }
        status:
          type: object
          required: [id, name, color, group]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            color: { type: string }
            group: { $ref: '#/components/schemas/StatusGroup' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FormAvailable:
      type: object
      required: [id, name, description]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
    FormFill:
      type: object
      required: [id, name, description, definition]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        definition: { $ref: '#/components/schemas/FormDefinition' }
    FormSubmitted:
      type: object
      required: [item_id, title]
      properties:
        item_id: { type: string, format: uuid }
        title: { type: string }
    Workflow:
      type: object
      required: [id, name, is_default, statuses]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        is_default: { type: boolean }
        statuses:
          type: array
          items: { $ref: '#/components/schemas/Status' }
    Location:
      type: object
      required: [space_id]
      properties:
        space_id: { type: string, format: uuid }
        space_name: { type: string }
        parent_item_id:
          type: string
          format: uuid
          nullable: true
          description: null berarti langsung di root Space
    Baseline:
      type: object
      required: [id, project_id, name, created_by, created_at, item_count]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string }
        created_by: { type: string, nullable: true, description: Nama pembuat }
        created_at: { type: string, format: date-time }
        item_count: { type: integer, format: int32 }
    BaselineVariance:
      type: object
      required: [item_id, baseline_start, baseline_due, start, due, start_variance_days, due_variance_days]
      properties:
        item_id: { type: string, format: uuid }
        baseline_start: { type: string, format: date, nullable: true }
        baseline_due: { type: string, format: date, nullable: true }
        start: { type: string, format: date, nullable: true }
        due: { type: string, format: date, nullable: true }
        start_variance_days: { type: integer, format: int32, nullable: true }
        due_variance_days: { type: integer, format: int32, nullable: true }
    ApiKey:
      type: object
      required: [id, name, scope, prefix, expires_at, last_used_at, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scope: { type: string, enum: [read, write] }
        prefix: { type: string }
        expires_at: { type: string, format: date-time, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    ApiKeyCreated:
      type: object
      required: [key, secret]
      properties:
        key: { $ref: '#/components/schemas/ApiKey' }
        secret: { type: string, description: "Dikirim sekali saja; hanya hash yang disimpan" }
    HourlyRate:
      type: object
      required: [id, user_id, role_id, name, rate_minor, effective_from]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid, nullable: true }
        role_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        rate_minor: { type: integer, format: int64 }
        effective_from: { type: string, format: date }
    GanttSnapshot:
      type: object
      required: [id, project_id, name, show_assignees, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string }
        show_assignees: { type: boolean }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        token: { type: string, description: Hanya pada jawaban pembuatan }
    PublicGanttSnapshot:
      type: object
      required: [project_id, project_title, items]
      properties:
        project_id: { type: string, format: uuid }
        project_title: { type: string }
        items:
          type: array
          items:
            type: object
            required: [id, title, parent_id, start_date, due_date, progress_percent]
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              parent_id: { type: string, format: uuid, nullable: true }
              start_date: { type: string, format: date, nullable: true }
              due_date: { type: string, format: date, nullable: true }
              progress_percent: { type: integer, format: int32, nullable: true }
              assignees: { type: array, items: { type: string } }
    DashboardPublicLink:
      type: object
      required: [enabled, expires_at, has_password]
      properties:
        enabled: { type: boolean }
        expires_at: { type: string, format: date-time, nullable: true }
        has_password: { type: boolean }
        token: { type: string, description: Hanya pada jawaban PUT }
    PublicDashboard:
      type: object
      required: [name, layout, widgets]
      properties:
        name: { type: string }
        layout: { type: string, enum: [columns, stack] }
        widgets:
          type: array
          items:
            type: object
            required: [id, name, type, config]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              type: { type: string }
              config: { $ref: '#/components/schemas/DashboardWidgetConfig' }
              data: { $ref: '#/components/schemas/WidgetData' }
              masked: { type: boolean, description: Widget finansial disamarkan }
              failed: { type: boolean }
    UtilizationRow:
      type: object
      required: [id, name, capacity, planned, actual, planned_percent, actual_percent]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        capacity: { type: integer, format: int32 }
        planned: { type: integer, format: int32 }
        actual: { type: integer, format: int32 }
        planned_percent: { type: number }
        actual_percent: { type: number }
    UserRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    AssigneeAllocation:
      type: object
      required: [unit, value]
      properties:
        unit: { type: string, enum: [percent, minutes_per_day] }
        value: { type: integer, format: int32, minimum: 0, maximum: 2147483647 }
    ItemAssignee:
      allOf:
        - { $ref: '#/components/schemas/UserRef' }
        - type: object
          properties:
            allocation: { $ref: '#/components/schemas/AssigneeAllocation' }
    AssigneeAllocationUpdate:
      type: object
      required: [assignee_id, allocation]
      properties:
        assignee_id: { type: string, format: uuid }
        allocation:
          type: object
          nullable: true
          required: [unit, value]
          properties:
            unit: { type: string, enum: [percent, minutes_per_day] }
            value: { type: integer, format: int32, minimum: 0, maximum: 2147483647 }
          description: null menghapus alokasi assignee
    CustomFieldType:
      type: string
      enum: [single_select, multi_select, text, number, currency, percent, people, date, duration, checkbox, relation, formula]
    CustomFieldOption:
      type: object
      required: [id, label, color]
      properties:
        id: { type: string, format: uuid }
        label: { type: string, minLength: 1, maxLength: 120 }
        color: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
    CustomFieldMarker:
      type: object
      required: [operator, value, color]
      properties:
        operator: { type: string, enum: [lt, lte, eq, gte, gt] }
        value: { type: number, format: double, minimum: -1000000000, maximum: 2147483647 }
        color: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
    CustomFieldConfig:
      type: object
      properties:
        project_budget: { type: boolean, description: Khusus Currency dan hanya menerima nilai pada Project }
        currency: { type: string, pattern: '^[A-Z]{3}$', description: Kode ISO 4217 untuk Currency }
        decimals: { type: integer, minimum: 0, maximum: 6, description: Jumlah desimal untuk Currency dengan default 2 }
        allow_over_100: { type: boolean, description: Izinkan nilai Percent melebihi 100 }
        expression: { type: string, maxLength: 500, description: 'Khusus Formula (TASK-11B): angka, [Nama field], + - * /, perbandingan, kurung, min, max, round, abs, if' }
        target_type_key: { type: string, description: Khusus Relation; batasi target ke satu tipe item (kosong = semua) }
        aggregation: { type: string, enum: [sum, average, min, max, count], description: Default untuk field numerik }
        markers:
          type: array
          maxItems: 10
          description: Aturan numerik dalam urutan prioritas, kecocokan pertama berlaku
          items: { $ref: '#/components/schemas/CustomFieldMarker' }
    CustomFieldCreate:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        type: { $ref: '#/components/schemas/CustomFieldType' }
        options:
          type: array
          maxItems: 100
          description: Wajib 1 sampai 100 opsi untuk tipe select, kosong atau dihilangkan untuk tipe lain
          items: { $ref: '#/components/schemas/CustomFieldOption' }
        config: { $ref: '#/components/schemas/CustomFieldConfig' }
    CustomFieldUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        position: { type: integer, minimum: 0, description: Indeks urutan berbasis nol dalam Space }
        options:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/CustomFieldOption' }
        config:
          allOf: [{ $ref: '#/components/schemas/CustomFieldConfig' }]
          description: Mengganti seluruh konfigurasi. Field yang dihilangkan memakai default
    CustomField:
      allOf:
        - $ref: '#/components/schemas/CustomFieldCreate'
        - type: object
          required: [id, space_id, position, options]
          properties:
            id: { type: string, format: uuid }
            space_id: { type: string, format: uuid }
            position: { type: integer, minimum: 0 }
            archived_at: { type: string, format: date-time, nullable: true }
            options:
              type: array
              items: { $ref: '#/components/schemas/CustomFieldOption' }
    CustomFieldPerson:
      allOf:
        - { $ref: '#/components/schemas/UserRef' }
        - type: object
          required: [status]
          properties:
            status: { type: string, enum: [active, invited, deactivated] }
    CustomFieldValues:
      type: object
      description: >-
        Nilai berkunci UUID definisi. Text, Date (YYYY-MM-DD), dan Single select (UUID) memakai string.
        Multiple select dan People memakai array UUID. Number, Currency dan Percent memakai angka desimal.
        Duration adalah jumlah hari bulat nonnegatif. Checkbox memakai boolean. Pada PATCH, null menghapus nilai.
      additionalProperties:
        oneOf:
          - { type: string, nullable: true }
          - { type: number, format: double }
          - { type: boolean }
          - type: array
            uniqueItems: true
            items: { type: string, format: uuid }
    ProjectProgressMethod:
      type: string
      enum: [task_count, weighted_duration, average_percent]
    ProjectProgressRisk:
      type: string
      enum: [green, yellow, red]
    Item:
      type: object
      required: [id, seq, type, title, version, locations, assignees, created_at, updated_at, my_capabilities]
      properties:
        item_type: { $ref: '#/components/schemas/ItemTypeRef' }
        fields: { $ref: '#/components/schemas/CustomFieldValues' }
        field_people:
          type: object
          description: Metadata orang yang sudah dipilih pada nilai People yang terlihat, berkunci UUID user
          additionalProperties: { $ref: '#/components/schemas/CustomFieldPerson' }
        id: { type: string, format: uuid }
        seq: { type: integer, format: int64, description: ID yang ditampilkan ke user }
        type: { $ref: '#/components/schemas/ItemType' }
        title: { type: string }
        description: { $ref: '#/components/schemas/RichText' }
        status: { $ref: '#/components/schemas/Status' }
        start_date: { type: string, format: date, nullable: true }
        due_date: { type: string, format: date, nullable: true }
        duration_days: { type: integer, nullable: true }
        effort_minutes: { type: integer, format: int32, minimum: 0, maximum: 2147483647, nullable: true }
        progress_method: { $ref: '#/components/schemas/ProjectProgressMethod' }
        progress_percent:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          description: Progres manual pada task atau progres hasil perhitungan pada project
        progress_risk: { $ref: '#/components/schemas/ProjectProgressRisk' }
        is_milestone: { type: boolean }
        owner: { allOf: [{ $ref: '#/components/schemas/UserRef' }], nullable: true }
        default_workflow_id: { type: string, format: uuid, nullable: true }
        default_view_type: { type: string, enum: [table, board, gantt, calendar, files, chart], nullable: true }
        assignees:
          type: array
          items: { $ref: '#/components/schemas/ItemAssignee' }
        locations:
          type: array
          items: { $ref: '#/components/schemas/Location' }
        child_count: { type: integer }
        attachment_count: { type: integer }
        comment_count: { type: integer }
        completed_at: { type: string, format: date-time, nullable: true }
        importance: { type: string, enum: [high, normal, low], description: Prioritas item (D-36) }
        status_changed_at: { type: string, format: date-time, description: Terakhir status berubah (days in status di kartu Board) }
        cover_attachment_id: { type: string, format: uuid, description: Lampiran gambar pertama yang masih ada, untuk sampul kartu }
        version: { type: integer }
        created_by: { $ref: '#/components/schemas/UserRef' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time, nullable: true }
        deleted_by: { allOf: [{ $ref: '#/components/schemas/UserRef' }], nullable: true }
        restore_blocked_reason: { type: string, enum: [space_deleted, forbidden], nullable: true }
        my_capabilities:
          type: array
          items: { $ref: '#/components/schemas/Capability' }
    ItemPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Item' }
    ItemCreate:
      type: object
      required: [title, locations]
      description: Kirim type (kelas bawaan) atau type_key (tipe kustom; kelasnya menjadi type)
      properties:
        type: { $ref: '#/components/schemas/ItemType' }
        type_key: { type: string, description: Kunci tipe item aktif, mis. bug }
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { $ref: '#/components/schemas/RichText' }
        status_id: { type: string, format: uuid, description: Default status pertama workflow container }
        start_date: { type: string, format: date, nullable: true }
        due_date: { type: string, format: date, nullable: true }
        duration_days: { type: integer, minimum: 0, nullable: true }
        effort_minutes: { type: integer, format: int32, minimum: 0, maximum: 2147483647, nullable: true }
        progress_method: { $ref: '#/components/schemas/ProjectProgressMethod' }
        progress_percent: { type: integer, minimum: 0, maximum: 100, nullable: true, description: Progres manual khusus task }
        is_milestone: { type: boolean }
        owner_id: { type: string, format: uuid, description: Hanya project }
        default_workflow_id: { type: string, format: uuid, description: Hanya project/folder }
        default_view_type: { type: string, enum: [table, board, gantt, calendar, files, chart], description: Hanya project/folder }
        assignee_ids:
          type: array
          items: { type: string, format: uuid }
        assignee_allocations:
          type: array
          items: { $ref: '#/components/schemas/AssigneeAllocationUpdate' }
        locations:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Location' }
        shares:
          type: array
          description: Hanya project/folder (SPC-05 Sharing)
          items: { $ref: '#/components/schemas/ShareInput' }
    DependencyType:
      type: string
      enum: [FS, SS, FF, SF]
    ItemDependency:
      type: object
      required: [id, predecessor_id, successor_id, type, lag]
      properties:
        id: { type: string, format: uuid }
        predecessor_id: { type: string, format: uuid }
        successor_id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/DependencyType' }
        lag: { type: integer, format: int32, description: Lag dalam hari kerja, boleh negatif }
    ScheduleItemVersion:
      type: object
      required: [id, version]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
    ScheduleItemChange:
      allOf:
        - { $ref: '#/components/schemas/ScheduleItemVersion' }
        - type: object
          required: [start_date, due_date]
          properties:
            start_date: { type: string, format: date, nullable: true }
            due_date: { type: string, format: date, nullable: true }
    ItemDependencyMutation:
      allOf:
        - { $ref: '#/components/schemas/ItemDependency' }
        - type: object
          properties:
            affected_items:
              type: array
              items: { $ref: '#/components/schemas/ScheduleItemChange' }
    ItemPatchResult:
      allOf:
        - { $ref: '#/components/schemas/Item' }
        - type: object
          properties:
            affected_items:
              type: array
              items: { $ref: '#/components/schemas/ScheduleItemChange' }
    ItemUpdate:
      type: object
      properties:
        importance: { type: string, enum: [high, normal, low] }
        fields: { $ref: '#/components/schemas/CustomFieldValues' }
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { $ref: '#/components/schemas/RichText' }
        status_id: { type: string, format: uuid }
        start_date: { type: string, format: date, nullable: true }
        due_date: { type: string, format: date, nullable: true }
        duration_days: { type: integer, minimum: 0, nullable: true }
        effort_minutes: { type: integer, format: int32, minimum: 0, maximum: 2147483647, nullable: true }
        progress_method: { $ref: '#/components/schemas/ProjectProgressMethod' }
        progress_percent: { type: integer, minimum: 0, maximum: 100, nullable: true, description: Progres manual khusus task }
        recalculate_duration:
          type: boolean
          enum: [true]
          description: Hitung durasi hari kerja dari effort dan alokasi terbaru. Kirim tanpa field tanggal, durasi, atau milestone.
        is_milestone: { type: boolean }
        owner_id: { type: string, format: uuid }
        assignee_ids:
          type: array
          items: { type: string, format: uuid }
        assignee_allocations:
          type: array
          description: Ubah alokasi assignee yang tercantum setelah assignee_ids diterapkan
          items: { $ref: '#/components/schemas/AssigneeAllocationUpdate' }

    # ── View ──
    ViewType:
      type: string
      enum: [table, board, gantt, calendar, timelog, files, chart]
    ViewVisibility:
      type: string
      enum: [public, personal]
    View:
      type: object
      required: [id, type, name, visibility, position, is_default]
      properties:
        id: { type: string, format: uuid }
        scope_space_id: { type: string, format: uuid, nullable: true }
        scope_item_id: { type: string, format: uuid, nullable: true }
        type: { $ref: '#/components/schemas/ViewType' }
        name: { type: string }
        visibility: { $ref: '#/components/schemas/ViewVisibility' }
        position: { type: integer }
        is_default: { type: boolean }
        config:
          type: object
          description: Kolom, urutan kolom, grouping, dan preset bawaan view
          additionalProperties: true
    ViewCreate:
      type: object
      required: [type, name, visibility]
      properties:
        scope_space_id: { type: string, format: uuid }
        scope_item_id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/ViewType' }
        name: { type: string, minLength: 1, maxLength: 80 }
        visibility: { $ref: '#/components/schemas/ViewVisibility' }
        config: { type: object, additionalProperties: true }
    ViewUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        visibility: { $ref: '#/components/schemas/ViewVisibility' }
        position: { type: integer }
        is_default: { type: boolean }
        config: { type: object, additionalProperties: true }

    # ── Kolaborasi ──
    Comment:
      type: object
      required: [id, item_id, author, body, version, created_at]
      properties:
        id: { type: string, format: uuid }
        item_id: { type: string, format: uuid }
        author: { $ref: '#/components/schemas/UserRef' }
        body: { $ref: '#/components/schemas/RichText' }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        edited_at: { type: string, format: date-time, nullable: true }
    CommentPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Comment' }
    Attachment:
      type: object
      required: [id, item_id, filename, content_type, size_bytes, uploader, created_at]
      properties:
        id: { type: string, format: uuid }
        item_id: { type: string, format: uuid }
        filename: { type: string }
        content_type: { type: string, description: Hasil deteksi server }
        size_bytes: { type: integer, format: int64 }
        link_url: { type: string, nullable: true, description: Terisi untuk lampiran tautan (tanpa berkas) }
        version: { type: integer, minimum: 1, description: Nomor versi terbaru; filename, ukuran dan unduhan mengikuti versi ini }
        uploader: { $ref: '#/components/schemas/UserRef' }
        created_at: { type: string, format: date-time }
    AttachmentVersion:
      type: object
      required: [attachment_id, version, filename, content_type, size_bytes, uploader, created_at, is_current]
      properties:
        attachment_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        filename: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        is_current: { type: boolean }
        uploader: { $ref: '#/components/schemas/UserRef' }
        created_at: { type: string, format: date-time }
    ProjectFile:
      allOf:
        - $ref: '#/components/schemas/Attachment'
        - type: object
          required: [item_title]
          properties:
            item_title: { type: string }
            review_status:
              type: string
              enum: [not_requested, in_review, approved, rejected, cancelled]
              description: 'WA-D08: status review untuk versi terbaru file ini. cancelled = review ditarik untuk versi ini dan tidak ada approval aktif'
    AttachmentPreview:
      type: object
      required: [attachment_id, version, status, note, pages]
      properties:
        attachment_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [pending, ready, skipped, failed] }
        note: { type: string }
        pages:
          type: array
          items:
            type: object
            required: [page, width, height]
            properties:
              page: { type: integer, minimum: 1 }
              width: { type: integer }
              height: { type: integer }
    AttachmentAnnotation:
      type: object
      required: [id, attachment_id, version, page, x, y, body, resolved, author, created_at]
      properties:
        id: { type: string, format: uuid }
        attachment_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        page: { type: integer, minimum: 1 }
        x: { type: number }
        y: { type: number }
        body: { type: string }
        resolved: { type: boolean }
        author: { $ref: '#/components/schemas/UserRef' }
        created_at: { type: string, format: date-time }
    Activity:
      type: object
      required: [id, actor, action, changes, created_at]
      properties:
        id: { type: integer, format: int64 }
        actor: { $ref: '#/components/schemas/UserRef' }
        action:
          type: string
          example: item.updated
        changes:
          type: object
          description: 'Pasangan `{field: {from, to}}`'
          additionalProperties:
            type: object
            properties:
              from: {}
              to: {}
        created_at: { type: string, format: date-time }
    ActivityPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Activity' }

    StreamEntry:
      type: object
      required: [id, kind, action, changes, auto, created_at, actor, item]
      properties:
        id: { type: string }
        kind: { type: string, enum: [activity, comment] }
        action: { type: string }
        changes: { type: object, additionalProperties: true }
        snippet: { type: string, nullable: true }
        auto: { type: boolean }
        created_at: { type: string, format: date-time }
        actor: { $ref: '#/components/schemas/UserRef' }
        item:
          type: object
          required: [id, title, type]
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
            type: { $ref: '#/components/schemas/ItemType' }
    StreamPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/StreamEntry' }

    # ── Inbox & search ──
    NotificationKind:
      type: string
      enum: [mention, assigned, status_changed, comment, shared, approval_requested, approval_decided, automation, approval_reminder, approval_escalated]
    Notification:
      type: object
      required: [id, kind, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/NotificationKind' }
        actor: { allOf: [{ $ref: '#/components/schemas/UserRef' }], nullable: true }
        recipient: { allOf: [{ $ref: '#/components/schemas/UserRef' }], nullable: true }
        item_id: { type: string, format: uuid, nullable: true }
        item_title: { type: string, nullable: true }
        space_id: { type: string, format: uuid, nullable: true }
        space_title: { type: string, nullable: true }
        snippet: { type: string, nullable: true }
        read_at: { type: string, format: date-time, nullable: true }
        archived_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    NotificationPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items, unread_count]
          properties:
            unread_count: { type: integer }
            items:
              type: array
              items: { $ref: '#/components/schemas/Notification' }
    SearchResults:
      type: object
      required: [items, comments, users]
      properties:
        items:
          type: array
          description: Task, project, dan folder
          items:
            allOf:
              - { $ref: '#/components/schemas/Item' }
              - type: object
                properties:
                  path:
                    type: array
                    description: Induk dari terluar ke terdekat pada penempatan pertama dalam cakupan; berhenti di atas induk yang tidak boleh dilihat pemanggil
                    items:
                      type: object
                      required: [id, title, type]
                      properties:
                        id: { type: string, format: uuid }
                        title: { type: string }
                        type: { type: string }
        comments:
          type: array
          items:
            type: object
            required: [comment_id, item_id, item_title, snippet]
            properties:
              comment_id: { type: string, format: uuid }
              item_id: { type: string, format: uuid }
              item_title: { type: string }
              snippet: { type: string }
        users:
          type: array
          items: { $ref: '#/components/schemas/UserRef' }

    # ── Realtime ──
    RealtimeEvent:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          enum: [item.created, item.updated, item.deleted, item.restored, comment.created, notification.created, resync]
        id: { type: string, format: uuid, description: ID entitas yang berubah }
        item_id: { type: string, format: uuid, description: Untuk event komentar }
        version: { type: integer }
        container_ids:
          type: array
          description: Container yang daftarnya perlu dimuat ulang
          items: { type: string, format: uuid }
        affected_items:
          type: array
          description: Item yang dapat dilihat penerima dalam event item.updated untuk satu perubahan jadwal
          items: { $ref: '#/components/schemas/ScheduleItemVersion' }
