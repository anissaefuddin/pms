        query: { $ref: '#/components/schemas/AnalyticsQuery' }
    ReportSubscription:
      type: object
      additionalProperties: false
      required: [weekday, hour]
      properties:
        weekday: { type: integer, minimum: 0, maximum: 6, nullable: true, description: 0 = Minggu; null = setiap hari }
        hour: { type: integer, minimum: 0, maximum: 23, description: Jam di zona waktu jadwal }
        timezone: { type: string, nullable: true, description: 'Nama zona waktu IANA; null mengikuti zona waktu profil pelanggan' }
    ReportSummary:
      type: object
      required: [id, name, owner, space, sharing, created_at, updated_at, version, subscription]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        owner:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        space:
          nullable: true
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        sharing: { type: string, enum: [private, space] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }
        subscription:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/ReportSubscription' }]
    Report:
