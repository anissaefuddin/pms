        - { name: fieldId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { type: object, required: [field_id, space_id, scope_kind, scope_id, scope_name, created_at], properties: { field_id: { type: string, format: uuid }, space_id: { type: string, format: uuid }, scope_kind: { type: string, enum: [space, project, folder] }, scope_id: { type: string, format: uuid }, scope_name: { type: string }, created_at: { type: string, format: date-time } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [custom-fields]
      operationId: assignField
      summary: Berlakukan field di Space, project, atau folder (akses Full)
      parameters:
        - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: fieldId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope_kind, scope_id]
              properties:
                scope_kind: { type: string, enum: [space, project, folder] }
                scope_id: { type: string, format: uuid }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [field_id, space_id, scope_kind, scope_id, scope_name, created_at]
                properties:
                  field_id: { type: string }
                  space_id: { type: string }
                  scope_kind: { type: string }
                  scope_id: { type: string }
                  scope_name: { type: string }
                  created_at: { type: string }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /spaces/{spaceId}/custom-fields/{fieldId}/assignments/{scopeKind}/{scopeId}:
    delete:
      tags: [custom-fields]
      operationId: unassignField
      summary: Cabut field dari tempat itu; nilai tersimpan tidak dihapus
      parameters:
        - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: fieldId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: scopeKind, in: path, required: true, schema: { type: string, enum: [space, project, folder] } }
        - { name: scopeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: OK
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /item-types/usage:
    get:
      tags: [spaces]
      operationId: getItemTypeUsage
      summary: Jumlah item hidup per tipe (administrator)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: object, additionalProperties: { type: integer } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /spaces/{spaceId}/item-types/usage:
    get:
      tags: [spaces]
      operationId: getSpaceItemTypeUsage
      summary: Jumlah item per tipe dalam satu Space
      parameters:
        - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: object, additionalProperties: { type: integer } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /analytics/operational:
    post:
      tags: [reports]
      operationId: runOperationalAnalytics
      summary: Agregat Workspace tanpa baris item dan tanpa biaya; grup kecil disembunyikan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnalyticsQuery' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsResult'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /spaces/{spaceId}/excel-templates/{kind}:
    get:
      tags: [excel]
      operationId: getExcelTemplate
      summary: Unduh template impor Excel
      parameters:
        - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: kind, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /spaces/{spaceId}/excel-imports/{reportId}:
    get:
      tags: [excel]
      operationId: getSpaceExcelImportReport
      summary: Laporan impor milik pemanggil
      parameters:
        - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: reportId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /spaces/{spaceId}/excel-destinations:
    get:
      tags: [excel]
      operationId: listExcelDestinations
      summary: Project dan folder tujuan impor
      parameters:
        - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: parent, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { type: object, required: [id, title, type, can_create], properties: { id: { type: string, format: uuid }, title: { type: string }, type: { type: string }, can_create: { type: boolean } } } }
                  next_cursor: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: pms_session
    bearerKey:
      type: http
      scheme: bearer
      description: "API key `pmsk_...` (Authorization: Bearer). Bertindak sebagai pembuatnya lewat policy; scope read hanya GET."

  headers:
    ETag:
      description: Versi objek dalam tanda kutip, mis. `"7"`
      schema: { type: string }

  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Versi yang diedit, dalam tanda kutip (mis. `"7"`)
      schema: { type: string }
    SpaceId:
      name: spaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ViewId:
      name: viewId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ItemFilterType:
      name: type
      in: query
      description: Kunci tipe item (bawaan project, folder, task, atau kunci tipe kustom); kunci yang tidak dikenal ditolak 422
      schema:
        type: array
        maxItems: 20
        items: { type: string, maxLength: 64 }
      style: form
      explode: false
    ItemFilterStatusGroup:
      name: status_group
      in: query
      schema:
        type: array
        items: { $ref: '#/components/schemas/StatusGroup' }
      style: form
      explode: false
    ItemFilterAssignee:
      name: assignee
      in: query
      description: ID user, atau `me`, atau `none` untuk belum ditugaskan
      schema: { type: string }
    ItemSort:
      name: sort
      in: query
      description: Kunci urut, atau `field:<UUID definisi>` untuk custom field skalar dan select (bukan multi select atau People)
      schema:
        type: string
        pattern: '^(manual|title|status|due_date|start_date|created_at|updated_at|priority|importance|predecessors|field:[0-9a-fA-F-]{36})$'
        default: manual
    ItemFilterField:
      name: field
      in: query
      description: >-
        Filter custom field `<UUID definisi>:<nilai>`, dapat diulang (AND). Select memakai UUID opsi, Text mencari
        substring, angka/tanggal/checkbox mencocokkan nilai persis, Multiple select dan People memuat UUID tersebut.
      schema: { type: array, maxItems: 10, items: { type: string } }
      style: form
      explode: true

  responses:
    Report:
      description: Report beserta definisi
      headers: { ETag: { $ref: '#/components/headers/ETag' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Report' }
    Dashboard:
      description: Dashboard beserta konfigurasi widget
      headers: { ETag: { $ref: '#/components/headers/ETag' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Dashboard' }

    TimeEntry:
      description: Time entry
      headers: { ETag: { $ref: '#/components/headers/ETag' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TimeEntry' }

    RateLimited:
      description: Batas percobaan tercapai
      headers:
        Retry-After:
          description: Detik sebelum percobaan berikutnya
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ItemPage:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ItemPage' }
    ViewList:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items:
                type: array
                items: { $ref: '#/components/schemas/View' }
    VersionedShareList:
      description: OK
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items:
                type: array
                items: { $ref: '#/components/schemas/Share' }
    ShareList:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items:
                type: array
                items: { $ref: '#/components/schemas/Share' }

  schemas:
    VersionInfo:
      type: object
      required: [version]
      properties:
        version: { type: string }
        commit: { type: string, description: 'Hanya admin. Git commit SHA yang dibangun; "unknown" bila tidak diberikan saat build' }
        built_at: { type: string, description: 'Hanya admin. Waktu build (UTC); "unknown" bila tidak diberikan' }
        image:
          type: object
          description: Hanya admin. Diisi skrip deploy; "unavailable" bila tidak diberikan.
          required: [ref, id, registry_digest]
          properties:
            ref: { type: string, description: 'Referensi image yang dikonfigurasi (biasanya tag, bukan bukti isi)' }
            id: { type: string, description: ID image lokal di host (sha256) }
            registry_digest: { type: string, description: Digest manifest registry; hanya untuk image yang ditarik dari registry }
        schema: { type: integer, description: 'Hanya admin. Versi migrasi database' }
        platform: { type: string, description: 'Hanya admin. OS/arsitektur proses yang berjalan' }
    OverviewTimelineNode:
      type: object
      required: [id, title, type, status_group, in_range, children]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        type: { type: string, description: 'Tipe item: project, folder, task, atau tipe kustom' }
        start_date: { type: string, format: date, nullable: true, description: 'Kosong bila item tidak punya tanggal mulai' }
        due_date: { type: string, format: date, nullable: true, description: 'Kosong bila item tidak punya tanggal jatuh tempo' }
        status_group: { type: string, enum: [active, deferred, completed, cancelled] }
        in_range: { type: boolean, description: 'true bila rentang item (mulai sampai jatuh tempo) beririsan dengan rentang tampilan; false untuk induk yang hanya ditampilkan sebagai konteks' }
        children:
          type: array
          items: { $ref: '#/components/schemas/OverviewTimelineNode' }
    ConnectorInstall:
      type: object
      required: [id, kind, name, config, secret_names, enabled, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        name: { type: string }
        config: { type: object, additionalProperties: true }
        secret_names: { type: array, items: { type: string } }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        last_sync_at: { type: string, format: date-time, nullable: true }
        last_sync_ok: { type: boolean, nullable: true }
        last_sync_message: { type: string, nullable: true }
    ConnectorConflict:
      type: object
      properties:
        id: { type: string, format: uuid }
        external_id: { type: string }
        item_id: { type: string, format: uuid }
        item_title: { type: string }
        remote_title: { type: string }
        base_title: { type: string, nullable: true }
        differs: { type: string, description: 'Kolom yang berbeda, dipisah koma (title, body, done)' }
        resolution: { type: string, enum: [item, remote], nullable: true }
        resolved_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    Webhook:
      type: object
      required: [id, name, url, event_types, enabled, consecutive_failures, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        url: { type: string }
        event_types: { type: array, items: { type: string } }
        enabled: { type: boolean }
        consecutive_failures: { type: integer }
        disabled_reason: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        secret: { type: string, description: Hanya pada respons pembuatan }
    SpaceBookmark:
      type: object
      required: [id, url, title, description, position]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        title: { type: string }
        description: { type: string }
        position: { type: integer }
    SpaceBookmarkInput:
      type: object
      required: [url, title]
      additionalProperties: false
      properties:
        url: { type: string, maxLength: 2000 }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 1000 }
    FeedbackEntry:
      type: object
      required: [id, user, subject, rating, comment, page, created_at]
      properties:
        id: { type: string, format: uuid }
        user: { type: string, nullable: true }
        subject: { type: string }
        rating: { type: integer, nullable: true }
        comment: { type: string }
        page: { type: string }
        created_at: { type: string, format: date-time }
    ResourceSchedule:
      type: object
      properties:
        working_days:
          type: array
          items:
            type: integer
          nullable: true
        daily_hours:
          type: integer
          nullable: true
        leave_dates:
          type: array
          items:
            type: string
            format: date
    ResourceReference:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    ResourcePerson:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        capacity:
          type: array
          items:
            type: integer
        planned:
          type: array
          items:
            type: integer
        booked:
          type: array
          items:
            type: integer
    WorkloadTask:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        version:
          type: integer
        effort:
          type: integer
        assignee_names:
          type: array
          items: { type: string }
        assignee_ids:
          type: array
          items:
            type: string
            format: uuid
        editable:
          type: boolean
    ResourceDirectory:
      type: object
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/ResourceReference'
        skills:
          type: array
          items:
            $ref: '#/components/schemas/ResourceReference'
        users:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              roles:
                type: array
                items:
                  type: string
                  format: uuid
              skills:
                type: array
                items:
                  type: string
                  format: uuid
    ResourceDirectoryInput:
      type: object
      properties:
        kind:
          type: string
          enum:
          - role
          - skill
        id:
          type: string
          format: uuid
        name:
          type: string
        user_id:
          type: string
          format: uuid
        assigned:
          type: boolean
    ResourceBookingInput:
      type: object
      properties:
        project_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        role_id:
          type: string
          format: uuid
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        minutes_per_day:
          type: integer
    ResourceBooking:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          nullable: true
        role_id:
          type: string
          format: uuid
          nullable: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        minutes_per_day:
          type: integer
    Workload:
      type: object
      properties:
        people:
          type: array
          items:
            $ref: '#/components/schemas/ResourcePerson'
        role_demand:
          type: array
          items:
            $ref: '#/components/schemas/ResourcePerson'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/WorkloadTask'
        bookings:
          type: array
          items:
            $ref: '#/components/schemas/ResourceBooking'
    DashboardRename:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
    DashboardUpdate:
      type: object
      additionalProperties: false
      description: Salah satu atau keduanya; nama dan orientasi tata letak (DASH-05)
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        layout: { type: string, enum: [columns, stack], description: 'columns: widget berdampingan; stack: satu di atas yang lain' }
    DashboardDestination:
      allOf:
        - { $ref: '#/components/schemas/DashboardRename' }
        - type: object
          properties:
            space_id: { type: string, format: uuid, nullable: true, description: null atau dihilangkan untuk personal }
    DashboardMove:
      type: object
      required: [space_id]
      properties:
        space_id: { type: string, format: uuid, nullable: true, description: null untuk pindah ke personal milik pemanggil }
    DashboardSummary:
      type: object
      required: [id, owner_id, space_id, name, layout, version]
      properties:
        id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        space_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        layout: { type: string, enum: [columns, stack] }
        version: { type: integer, minimum: 1 }
    AnalyticsFilters:
      type: object
      additionalProperties: false
      properties:
        due_this_week: { type: boolean }
        due_this_month: { type: boolean }
        entry_this_month: { type: boolean }
        no_due_date: { type: boolean }
        awaiting_my_review: { type: boolean }
        status_groups: { type: array, maxItems: 4, items: { type: string, enum: [active, completed, deferred, cancelled] } }
        assignees: { type: array, maxItems: 100, items: { type: string, description: 'UUID pengguna atau "me"' } }
        unassigned: { type: boolean }
        importance: { type: array, maxItems: 3, items: { type: string, enum: [high, normal, low] } }
        type_keys: { type: array, maxItems: 100, items: { type: string }, description: Hanya item bertipe ini (kunci tipe item bawaan atau kustom; S8.1.5) }
        followed: { type: boolean }
        starred: { type: boolean }
        overdue: { type: boolean }
        due_from: { type: string, format: date }
        due_to: { type: string, format: date }
        effort_min: { type: integer, minimum: 0, maximum: 10000000 }
        effort_max: { type: integer, minimum: 0, maximum: 10000000 }
        entry_from: { type: string, format: date }
        entry_to: { type: string, format: date }
        billing: { type: string, enum: [billable, non_billable] }
        exclude_milestones: { type: boolean, description: Milestone tidak dihitung sebagai task (WA-D03); hanya untuk reporting_on tasks }
    AnalyticsQuery:
      type: object
      additionalProperties: false
      required: [reporting_on, metric]
      properties:
        reporting_on: { type: string, enum: [tasks, projects, time_entries] }
        space_ids: { type: array, maxItems: 100, items: { type: string, format: uuid }, description: Kosong berarti semua Space yang terlihat }
        container_ids: { type: array, maxItems: 100, items: { type: string, format: uuid }, description: Project atau Folder; hanya subpohonnya }
        metric: { type: string, enum: [count, effort_minutes, sum_field, avg_field, completion_percent, minutes, billable_minutes, actual_cost_minor, utilization], description: 'tasks/projects: count, effort_minutes, sum_field (jumlah custom field Number, Currency atau Percent, butuh field_id), avg_field (rata-rata per task, tugas tanpa nilai dihitung 0), completion_percent (persen task selesai dari yang ada dalam cakupan); time_entries: minutes, billable_minutes, actual_cost_minor (biaya aktual dalam satuan minor, hanya administrator; selain itu 403), count' }
        field_id: { type: string, format: uuid, description: 'Custom field untuk metric sum_field atau dimensi field (single select); wajib hanya pada keduanya' }
        group_by: { type: string, enum: [assignee, status, status_id, status_group, importance, type, item_type, space, field, due_month, created_month, user, item, category, billing_type, entry_month] }
        break_by: { type: string, enum: [assignee, status, status_id, status_group, importance, type, item_type, space, field, due_month, created_month, user, item, category, billing_type, entry_month] }
        filters: { $ref: '#/components/schemas/AnalyticsFilters' }
    WidgetData:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [tasks, series] }
        items:
          type: array
          maxItems: 50
          items:
            type: object
            required: [id, title, status, status_group, due_date, importance]
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              status: { type: string }
              status_group: { type: string }
              due_date: { type: string, description: Kosong jika tidak ada }
              importance: { type: string }
        result: { $ref: '#/components/schemas/AnalyticsResult' }
    AnalyticsLabel:
      type: object
      required: [key, label]
      properties:
        key: { type: string }
        label: { type: string }
    AnalyticsResult:
      type: object
      required: [rows, total]
      properties:
        total: { type: number }
        cost_status: { type: string, enum: [full, partial], description: 'Hanya pada metrik biaya. partial: sebagian waktu yang disetujui belum punya tarif atau tidak boleh dilihat; angka adalah subtotal yang diketahui' }
        rows:
          type: array
          items:
            type: object
            required: [group, break, value]
            properties:
              group: { $ref: '#/components/schemas/AnalyticsLabel' }
              break:
                nullable: true
                allOf: [{ $ref: '#/components/schemas/AnalyticsLabel' }]
              value: { type: number }
    ReportDefinition:
      type: object
      additionalProperties: false
      required: [layout, query]
      properties:
        layout: { type: string, enum: [table, column] }
        query: { $ref: '#/components/schemas/AnalyticsQuery' }
    ReportSubscription:
      type: object
      additionalProperties: false
      required: [weekday, hour]
      properties:
        weekday: { type: integer, minimum: 0, maximum: 6, nullable: true, description: 0 = Minggu; null = setiap hari }
        hour: { type: integer, minimum: 0, maximum: 23, description: Jam di zona waktu jadwal }
        timezone: { type: string, nullable: true, description: 'Nama zona waktu IANA; null mengikuti zona waktu profil pelanggan' }
    ReportSummary:
      type: object
      required: [id, name, owner, space, sharing, created_at, updated_at, version, subscription]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        owner:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        space:
          nullable: true
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        sharing: { type: string, enum: [private, space] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }
        subscription:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/ReportSubscription' }]
    Report:
      allOf:
        - { $ref: '#/components/schemas/ReportSummary' }
        - type: object
          required: [definition]
          properties:
            definition: { $ref: '#/components/schemas/ReportDefinition' }
    ReportList:
      type: object
      required: [items]
      properties:
        items: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/ReportSummary' } }
    ReportCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        space_id: { type: string, format: uuid, nullable: true, description: Null untuk report pribadi }
        sharing: { type: string, enum: [private, space], default: private }
        definition: { $ref: '#/components/schemas/ReportDefinition' }
        template: { type: string, enum: [active_tasks_by_assignee, weekly_project_status, overdue, due_this_month, unassigned, time_spent, utilization], description: Pakai definisi template; tidak boleh bersama definition }
    ReportUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        sharing: { type: string, enum: [private, space] }
        definition: { $ref: '#/components/schemas/ReportDefinition' }
    CustomRoleInput:
      type: object
      additionalProperties: false
      required: [name, capabilities]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        description: { type: string, maxLength: 300 }
        capabilities: { type: array, minItems: 1, maxItems: 11, uniqueItems: true, items: { $ref: '#/components/schemas/Capability' }, description: Wajib memuat view }
    CustomRole:
      allOf:
        - { $ref: '#/components/schemas/CustomRoleInput' }
        - type: object
          required: [id, description, version, in_use, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer }
            in_use: { type: integer, description: Jumlah share yang memakai peran ini }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    CustomRoleList:
      type: object
      required: [items]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/CustomRole' } }
    ScimResource:
      type: object
      additionalProperties: true
      description: Sumber daya SCIM 2.0 (User, Group, ListResponse, PatchOp atau Error); bentuk lengkap mengikuti RFC 7643/7644
    ScimTokenInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        default_user_type: { type: string, enum: [regular, external, collaborator, viewer], description: Tipe untuk pengguna yang dibuat lewat token ini (admin tidak boleh) }
    ScimToken:
      type: object
      required: [id, name, prefix, default_user_type, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string }
        default_user_type: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        token: { type: string, description: Hanya ada saat dibuat }
    ScimTokenList:
      type: object
      required: [items, base_url]
      properties:
        base_url: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/ScimToken' } }
    AccountOwnership:
      type: object
      required: [owner, is_owner, candidates]
      properties:
        owner:
          nullable: true
          type: object
          required: [id, name, email]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            email: { type: string }
        is_owner: { type: boolean }
        candidates:
          type: array
          items:
            type: object
            required: [id, name, email]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              email: { type: string }
    AccessPolicyInput:
      type: object
      additionalProperties: false
      required: [ip_allowlist_enabled, ip_allowlist, otp_login_enabled]
      properties:
        ip_allowlist_enabled: { type: boolean }
        ip_allowlist: { type: array, maxItems: 50, items: { type: string, maxLength: 64, description: Alamat IP atau jaringan CIDR } }
        otp_login_enabled: { type: boolean, description: Izinkan masuk dengan kode sekali pakai lewat email (AUTH-08) }
    AccessPolicy:
      allOf:
        - { $ref: '#/components/schemas/AccessPolicyInput' }
        - type: object
          required: [version, your_ip, override_active]
          properties:
            version: { type: integer }
            your_ip: { type: string, description: Alamat yang dilihat server untuk permintaan ini }
            override_active: { type: boolean, description: PMS_DISABLE_IP_ALLOWLIST aktif sehingga daftar tidak ditegakkan }
    PydioStorageInput:
      type: object
      additionalProperties: false
      required: [version, enabled, base_url, root, customer_roots]
      properties:
        version: { type: integer, minimum: 0 }
        enabled: { type: boolean }
        base_url: { type: string, maxLength: 500 }
        root: { type: string, maxLength: 400, description: 'Folder utama, misalnya pms-files' }
        customer_roots: { type: object, additionalProperties: { type: string, maxLength: 400 }, description: Kode Customer ke folder penyimpanannya }
        code_field_id: { type: string, format: uuid, nullable: true, description: Field Text yang memuat kode project }
        token: { type: string, maxLength: 4000, writeOnly: true, description: 'Wajib saat pertama kali dan saat alamat berubah; kosong mempertahankan' }
    PydioStorage:
      type: object
      required: [version, enabled, base_url, root, customer_roots, token_set, key_configured]
      properties:
        version: { type: integer }
        enabled: { type: boolean }
        base_url: { type: string }
        root: { type: string }
        customer_roots: { type: object, additionalProperties: { type: string } }
        code_field_id: { type: string, format: uuid, nullable: true }
        token_set: { type: boolean }
        key_configured: { type: boolean, description: PMS_CONNECTOR_KEY tersedia }
    PydioFolderInput:
      type: object
      additionalProperties: false
      required: [folder]
      properties:
        folder: { type: string, maxLength: 400 }
    PydioFolder:
      type: object
      required: [folder, source, enabled]
      properties:
        project_id: { type: string, format: uuid }
        folder: { type: string }
        source: { type: string, enum: [project, customer, default] }
        enabled: { type: boolean }
    PydioSettingsInput:
      type: object
      additionalProperties: false
      required: [version, enabled, base_url, roots, customer_roots]
      properties:
        version: { type: integer, minimum: 0 }
        enabled: { type: boolean }
        base_url: { type: string, maxLength: 500, description: Alamat https Cells tanpa kredensial dan path }
        roots: { type: array, minItems: 1, maxItems: 50, items: { type: string, maxLength: 500 }, description: Path workspace yang boleh ditautkan }
        customer_roots:
          type: object
          maxProperties: 500
          description: Kode Customer ke daftar folder yang disetujui; tiap folder berada di dalam roots
          additionalProperties: { type: array, minItems: 1, maxItems: 50, items: { type: string, maxLength: 500 } }
        max_upload_mb: { type: integer, minimum: 1, maximum: 1024, description: Batas per file untuk upload ke Pydio. Dihilangkan berarti nilai tersimpan dipertahankan (100 saat membuat) }
        allowed_extensions:
          type: array
          maxItems: 100
          items: { type: string }
          description: Ekstensi yang boleh diupload ke Pydio, disimpan huruf kecil tanpa titik. Daftar kosong berarti semua tipe; dihilangkan berarti nilai tersimpan dipertahankan
    PydioSettings:
      type: object
      required: [source, version, enabled, base_url, roots, customer_roots, max_upload_mb, allowed_extensions, listing_enabled, listing_token_available]
      properties:
        source: { type: string, enum: [database, environment, none] }
        version: { type: integer, description: 0 bila belum ada pengaturan tersimpan }
        enabled: { type: boolean }
        base_url: { type: string }
        roots: { type: array, items: { type: string } }
        customer_roots: { type: object, additionalProperties: { type: array, items: { type: string } } }
        max_upload_mb: { type: integer, description: Batas per file untuk upload ke Pydio; 100 bila belum disimpan. Belum dipakai karena upload ke Pydio belum tersedia }
        allowed_extensions: { type: array, items: { type: string }, description: Kosong berarti semua tipe file }
        listing_enabled: { type: boolean, description: PMS_PYDIO_LISTING; hanya diatur operator }
        listing_token_available: { type: boolean, description: Token environment berlaku hanya bila base_url sama dengan PMS_PYDIO_LINK_URL }
    SsoConfigInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        enabled: { type: boolean }
        idp_metadata_xml: { type: string, maxLength: 262144, description: 'SAML: metadata penyedia; kosong mempertahankan yang tersimpan. OIDC memakai issuer, client_id, client_secret' }
        email_attribute: { type: string, maxLength: 200, description: 'SAML: nama atribut yang memuat email (opsional)' }
        issuer: { type: string, description: URL https penyedia OpenID Connect }
        client_id: { type: string, maxLength: 255 }
        client_secret: { type: string, maxLength: 1000, nullable: true, description: Hilangkan untuk mempertahankan rahasia yang tersimpan; string kosong menghapusnya }
        auto_link: { type: boolean, description: Tautkan masuk pertama ke pengguna aktif dengan email terverifikasi yang sama }
        allowed_domains: { type: array, maxItems: 50, items: { type: string } }
    SsoConfig:
      type: object
      required: [configured, kind, name, enabled, issuer, client_id, secret_set, auto_link, allowed_domains, redirect_url, key_configured]
      properties:
        configured: { type: boolean }
        kind: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        issuer: { type: string }
        client_id: { type: string }
        secret_set: { type: boolean }
        auto_link: { type: boolean }
        allowed_domains: { type: array, items: { type: string } }
        redirect_url: { type: string, description: Daftarkan persis alamat ini di penyedia }
        key_configured: { type: boolean, description: PMS_SSO_KEY terisi }
        updated_at: { type: string, format: date-time, nullable: true }
        entity_id: { type: string, description: 'SAML: entity ID penyedia layanan ini' }
        acs_url: { type: string, description: 'SAML: alamat ACS (HTTP-POST)' }
        metadata_url: { type: string }
        idp_entity_id: { type: string }
        idp_sign_on_url: { type: string }
        email_attribute: { type: string }
        has_metadata: { type: boolean }
    LinkedIdentity:
      type: object
      required: [kind, provider_name, email, created_at, last_login_at]
      properties:
        kind: { type: string }
        provider_name: { type: string }
        email: { type: string }
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time, nullable: true }
    AuditEvent:
      type: object
      required: [id, at, actor_id, actor_name, action, target_type, target_id, ip, details, request_id]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        actor_id: { type: string, format: uuid, nullable: true }
        actor_name: { type: string }
        action: { type: string, description: 'Bentuk "area.verb"' }
        target_type: { type: string }
        target_id: { type: string }
        ip: { type: string }
        details: { type: object, additionalProperties: true }
        request_id: { type: string, description: Sama dengan X-Request-ID dan log aplikasi; kosong untuk event lama dan pekerjaan latar }
    AuditPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/AuditEvent' } }
        next_cursor: { type: string, nullable: true }
    DashboardList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DashboardSummary' }
    DashboardWidgetConfig:
      type: object
      additionalProperties: false
      properties:
        show_legend: { type: boolean, description: "Untuk pie, column, bar, line, area, dan burndown" }
        show_labels: { type: boolean, description: "Untuk pie, column, bar, line, area, dan burndown" }
        description: { type: string, maxLength: 500, description: Keterangan singkat di bawah judul widget (DASH-04) }
        pie_style: { type: string, enum: [classic, donut, ring], description: Khusus pie }
        list: { type: string, enum: [todo_this_week, to_review, completed, assigned_to_me], description: 'Khusus task_list (DASH-01); gunakan list atau template, bukan keduanya' }
        template: { type: string, enum: [my_tasks, overdue, followed, backlog, starred], description: Khusus task_list (DASH-02) }
        query: { $ref: '#/components/schemas/AnalyticsQuery' }
    DashboardWidgetInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        type: { type: string, enum: [task_list, indicator, pie, column, bar, line, table, area, pivot, burndown, completion], description: 'burndown memakai metrik count atau effort_minutes tanpa pengelompokan, 30 hari terakhir; pivot butuh group_by dan break_by' }
        position: { type: integer, minimum: 0, maximum: 9999 }
        config: { $ref: '#/components/schemas/DashboardWidgetConfig' }
    DashboardWidget:
      allOf:
        - { $ref: '#/components/schemas/DashboardWidgetInput' }
        - type: object
          required: [id, position, config]
          properties:
            id: { type: string, format: uuid }
            position: { type: integer, minimum: 0, maximum: 9999 }
            config: { $ref: '#/components/schemas/DashboardWidgetConfig' }
    Dashboard:
      allOf:
        - { $ref: '#/components/schemas/DashboardSummary' }
        - type: object
          required: [widgets]
          properties:
            widgets:
              type: array
              maxItems: 100
              items: { $ref: '#/components/schemas/DashboardWidget' }

    ExcelExport:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, ready, failed] }
        scope: { type: string, enum: [project, space] }
        error: { type: string }
        total_items:
          type: integer
          description: Items the export holds, counted from the tree when the worker starts.
        processed_items:
          type: integer
          description: Items written so far. This is a count of real items, not an estimate.
    ExcelPreview:
      type: object
      required: [columns, rows, errors, sample, digest]
      properties:
        columns: { type: array, items: { type: string } }
        rows: { type: integer }
        digest: { type: string }
        sample:
          type: array
          items: { type: array, items: { type: string } }
        errors:
          type: array
          items:
            type: object
            required: [row, column, message]
            properties:
              row: { type: integer }
              column: { type: string }
              message: { type: string }

    TimeEntryFields:
      type: object
      properties:
        minutes: { type: integer, minimum: 1, maximum: 1440 }
        category: { type: string, maxLength: 80 }
        comment: { type: string, maxLength: 2000 }
        billing_type: { type: string, enum: [billable, non_billable] }
    TimeEntry:
      allOf:
        - { $ref: '#/components/schemas/TimeEntryFields' }
        - type: object
          required: [id, item_id, user_id, date, minutes, category, comment, billing_type, locked, version, status, review_note]
          properties:
            id: { type: string, format: uuid }
            item_id: { type: string, format: uuid }
            user_id: { type: string, format: uuid }
            date: { type: string, format: date }
            minutes: { type: integer, minimum: 1, maximum: 1440 }
            category: { type: string, maxLength: 80 }
            comment: { type: string, maxLength: 2000 }
            billing_type: { type: string, enum: [billable, non_billable] }
            locked: { type: boolean }
            version: { type: integer }
            status: { type: string, enum: [draft, submitted, approved, rejected] }
            review_note: { type: string, maxLength: 1000 }
            item_title: { type: string }
            user_name: { type: string }
    TimeEntryPage:
      type: object
      required: [items, next_offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TimeEntry' }
        next_offset: { type: integer, nullable: true }
        total_minutes: { type: integer, description: Total menit seluruh hasil yang difilter (bukan halaman); hanya Timelog project }
        billable_minutes: { type: integer }
        non_billable_minutes: { type: integer }

    # ── Umum ──
    Problem:
      type: object
      required: [type, title, status, code, request_id]
      properties:
        type: { type: string, example: about:blank }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          description: Kode stabil, lihat WORKFLOWS §10
          example: version_conflict
        detail: { type: string }
        request_id: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
    RichText:
      type: object
      description: Dokumen ProseMirror JSON (TipTap). Server memvalidasi node dan mark yang diizinkan.
      required: [type]
      properties:
        type: { type: string, enum: [doc] }
        content:
          type: array
          items: { type: object }
      additionalProperties: true
    Page:
      type: object
      properties:
        next_cursor: { type: string, nullable: true }

    # ── Auth & user ──
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    InvitationInfo:
      type: object
      required: [email, expires_at]
      properties:
        email: { type: string, format: email }
        invited_by_name: { type: string }
        expires_at: { type: string, format: date-time }
    AcceptInvitationRequest:
      type: object
      required: [token, first_name, last_name, password, accept_terms]
      properties:
        token: { type: string }
        first_name: { type: string, minLength: 1, maxLength: 80 }
        last_name: { type: string, minLength: 1, maxLength: 80 }
        password: { type: string, format: password, minLength: 8 }
        department: { type: string, maxLength: 80 }
        job_title: { type: string, maxLength: 80 }
        accept_terms: { type: boolean, enum: [true] }
    UserType:
      type: string
      enum: [admin, regular, external, collaborator, viewer]
    UserStatus:
      type: string
      enum: [invited, active, deactivated]
    User:
      type: object
      required: [id, email, first_name, last_name, user_type, status]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        first_name: { type: string }
        last_name: { type: string }
        user_type: { $ref: '#/components/schemas/UserType' }
        status: { $ref: '#/components/schemas/UserStatus' }
        job_title: { type: string, nullable: true }
        department: { type: string, nullable: true }
        last_login_at: { type: string, format: date-time, nullable: true }
    UserPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/User' }
    TwoFactorChallenge:
      type: object
      required: [two_factor_required, challenge]
      properties:
        two_factor_required: { type: boolean, enum: [true] }
        challenge: { type: string }
    TwoFactorStatus:
      type: object
      required: [configured, enabled, enabled_at, backup_codes_remaining]
      properties:
        configured: { type: boolean, description: false bila server belum punya PMS_2FA_KEY }
        enabled: { type: boolean }
        enabled_at: { type: string, format: date-time, nullable: true }
        backup_codes_remaining: { type: integer, format: int32 }
    TwoFactorReauth:
      type: object
      required: [password, code]
      additionalProperties: false
      properties:
        password: { type: string }
        code: { type: string, maxLength: 32, description: Kode TOTP 6 digit atau kode cadangan }
    Me:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [locale, timezone, date_format, time_format, week_start, personal_space_id, account_name, capabilities, onboarding_pending, avatar_version, joined_at]
          properties:
            company: { type: string, nullable: true }
            country: { type: string, nullable: true }
            location: { type: string, nullable: true }
            phone: { type: string, nullable: true }
            locale: { type: string, example: en }
            timezone: { type: string, example: Asia/Jakarta }
            date_format: { type: string, enum: [dd/mm/yyyy, mm/dd/yyyy, yyyy-mm-dd] }
            time_format: { type: string, enum: ['12h', '24h'] }
            week_start: { type: string, enum: [monday, sunday, saturday] }
            density: { type: string, enum: [compact, comfortable], default: compact }
            theme: { type: string, enum: [light, dark, system], default: system }
            accent: { type: string, enum: [blue, teal, violet, green], default: blue, description: Tema warna (SET-06) }
            comment_shortcut: { type: string, enum: [mod_enter, enter], default: mod_enter }
            sidebar_hidden:
              type: array
              deprecated: true
              description: Entri sidebar opsional yang disembunyikan user (NAV-02); Search dan Inbox selalu tampil. Dipertahankan satu rilis setelah sidebar_pinned
              items: { $ref: '#/components/schemas/SidebarKey' }
            sidebar_pinned:
              type: array
              description: Entri sidebar yang disematkan user, dalam urutan tampil (paling atas dulu). Tanpa duplikat; kosong berarti tidak ada yang disematkan. Search dan Inbox tidak termasuk
              items: { $ref: '#/components/schemas/SidebarKey' }
            view_expansion:
              type: object
              description: Expansi hierarki per view milik user ini (WA-D05); kunci = id view. Hanya user ini yang membacanya
              additionalProperties:
                type: object
                required: [rows, gantt_collapsed]
                properties:
                  rows: { type: array, items: { type: string, format: uuid } }
                  gantt_collapsed: { type: boolean }
            view_prefs:
              type: object
              description: Preferensi view personal per workspace (WA-D07), kunci = id Space, Project, atau Folder. Hanya user ini yang membacanya
              additionalProperties:
                type: object
                required: [hidden, order]
                properties:
                  hidden: { type: array, items: { type: string, format: uuid } }
                  order: { type: array, items: { type: string, format: uuid } }
            email_muted:
              type: array
              description: Grup email notifikasi yang dimatikan user (SET-05); kosong berarti semua aktif
              items: { $ref: '#/components/schemas/EmailGroup' }
            due_reminders: { $ref: '#/components/schemas/DueReminderPreferences' }
            onboarding_pending: { type: boolean, description: true bagi administrator selama wizard first-run (AUTH-07) belum selesai atau dilewati }
            avatar_version: { type: integer, format: int64, description: 'Foto profil: epoch ms saat terakhir diunggah, 0 berarti tidak ada foto. Dipakai sebagai penanda cache pada GET /api/v1/me/avatar' }
            joined_at: { type: string, format: date-time, description: Tanggal user bergabung ke workspace }
            default_task_duration_days: { type: integer, nullable: true, minimum: 0, maximum: 3650, description: Durasi awal task baru (SET-03) }
            default_task_effort_minutes: { type: integer, nullable: true, minimum: 0, maximum: 525600, description: Effort awal task baru (SET-03) }
            account_name: { type: string, description: Nama workspace }
            personal_space_id: { type: string, format: uuid }
            capabilities:
              type: object
              description: Kemampuan global; kemampuan per item dihitung server
              properties:
                manage_users: { type: boolean }
                create_space: { type: boolean }
    WorkspaceBranding:
      type: object
      required: [name, brand_color, icon_image_version, logo_light_version, logo_dark_version]
      properties:
        name: { type: string }
        brand_color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        icon_image_version: { type: integer, format: int64 }
        logo_light_version: { type: integer, format: int64 }
        logo_dark_version: { type: integer, format: int64 }
    MeUpdate:
      type: object
      properties:
        first_name: { type: string, minLength: 1, maxLength: 80 }
        last_name: { type: string, minLength: 1, maxLength: 80 }
        company: { type: string, maxLength: 120 }
        job_title: { type: string, maxLength: 80 }
        department: { type: string, maxLength: 80 }
        country: { type: string, maxLength: 2 }
        location: { type: string, maxLength: 120 }
        phone: { type: string, maxLength: 32 }
        locale: { type: string, enum: [en, id] }
        timezone: { type: string }
        date_format: { type: string, enum: [dd/mm/yyyy, mm/dd/yyyy, yyyy-mm-dd] }
        time_format: { type: string, enum: ['12h', '24h'] }
        week_start: { type: string, enum: [monday, sunday, saturday] }
        density: { type: string, enum: [compact, comfortable] }
        theme: { type: string, enum: [light, dark, system] }
        accent: { type: string, enum: [blue, teal, violet, green] }
        comment_shortcut: { type: string, enum: [mod_enter, enter] }
        sidebar_hidden:
          type: array
          deprecated: true
          items: { $ref: '#/components/schemas/SidebarKey' }
        sidebar_pinned:
          type: array
          description: Urutan tampil dipertahankan sesuai kiriman; nilai duplikat ditolak (422)
          items: { $ref: '#/components/schemas/SidebarKey' }
        email_muted:
          type: array
          items: { $ref: '#/components/schemas/EmailGroup' }
        due_reminders: { $ref: '#/components/schemas/DueReminderPreferences' }
        default_task_duration_days: { type: integer, nullable: true, minimum: 0, maximum: 3650 }
        default_task_effort_minutes: { type: integer, nullable: true, minimum: 0, maximum: 525600 }
    EmailGroup:
      type: string
      description: task_changes mencakup perubahan status dan approval; notifikasi komentar tidak pernah dikirim lewat email
      enum: [mention, assigned, shared, task_changes, report]
    DueReminderPreferences:
      type: object
      required: [enabled, days_before, overdue, overdue_every_days, delivery, hour]
      properties:
        enabled: { type: boolean }
        days_before: { type: array, uniqueItems: true, items: { type: integer, enum: [0, 1, 3] } }
        overdue: { type: boolean }
        overdue_every_days: { type: integer, minimum: 1, maximum: 30 }
        delivery: { type: string, enum: [digest, individual] }
        hour: { type: integer, minimum: 0, maximum: 23 }
    Account:
      type: object
      required: [name, description, icon, logo_light_url, logo_dark_url, brand_color, icon_image_version, logo_light_version, logo_dark_version, created_at, role, joined_at, administrators, seats]
      properties:
        name: { type: string }
        description: { type: string }
        icon: { type: string }
        logo_light_url: { type: string }
        logo_dark_url: { type: string }
        brand_color: { type: string }
        icon_image_version: { type: integer, format: int64 }
        logo_light_version: { type: integer, format: int64 }
        logo_dark_version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        role: { $ref: '#/components/schemas/UserType' }
        joined_at: { type: string, format: date-time }
        administrators:
          type: array
          items:
            type: object
            required: [id, name, email]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              email: { type: string, format: email }
        seats: { $ref: '#/components/schemas/Seats' }
    SidebarKey:
      type: string
      enum: [created_by_me, workload, calendars, dashboards, my_todo, request_forms, timesheets, reports, stream, starred, portfolio, reviews]
    InviteRequest:
      type: object
      required: [email, user_type]
      properties:
        email: { type: string, format: email }
        user_type: { $ref: '#/components/schemas/UserType' }
        message: { type: string, maxLength: 500 }
        share:
          type: array
          description: Space atau item yang langsung dibagikan ke user baru
          items:
            type: object
            required: [target_type, target_id, role]
            properties:
              target_type: { $ref: '#/components/schemas/ShareTargetType' }
              target_id: { type: string, format: uuid }
              role: { $ref: '#/components/schemas/ShareRole' }
    Seats:
      type: object
      required: [max, used, pending, available]
      properties:
        max: { type: integer, description: Dari env PMS_MAX_SEATS }
        used: { type: integer, description: User berstatus active }
        pending: { type: integer, description: User berstatus invited }
        available: { type: integer }
    Group:
      type: object
      required: [id, name, member_ids]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        member_ids:
          type: array
          items: { type: string, format: uuid }

    # ── Space & share ──
    SpaceKind:
      type: string
      enum: [shared, personal]
    SpaceTemplate:
      type: object
      required: [id, name, category, description, version, compatible, saved, mine, counts]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        description: { type: string }
        version: { type: integer }
        compatible: { type: boolean, description: false bila template ditulis untuk versi PMS yang lebih baru }
        saved: { type: boolean, description: Dibuat dari sebuah Space; false untuk template bawaan }
        mine: { type: boolean, description: Disimpan oleh pemanggil dan dapat dihapusnya }
        counts:
          type: object
          required: [projects, tasks, views, forms, custom_fields]
          properties:
            projects: { type: integer }
            tasks: { type: integer }
            views: { type: integer }
            forms: { type: integer }
            custom_fields: { type: integer }
    Space:
      type: object
      required: [id, name, kind, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        kind: { $ref: '#/components/schemas/SpaceKind' }
        version: { type: integer }
        locked: { type: boolean, description: 'Dikunci administrator: isi hanya dibagikan ke orang yang sudah punya akses ke space, dan hanya admin yang mengubah sharing space atau memindahkan item keluar (D-95)' }
        visibility: { type: string, enum: [public, private], description: 'Public: ditemukan dan bisa diikuti (Read) oleh pengguna internal yang memenuhi syarat. Private: hanya yang diberi akses (D-01)' }
        archived: { type: boolean, description: 'Archived space: hanya bisa dibaca; item dan konfigurasi tetap (D-03)' }
        icon_key: { type: string, nullable: true, description: 'Kunci ikon dari katalog GET /space-icons (D-04)' }
        is_space_admin: { type: boolean, description: 'Explicit Space Admin; tidak diberikan oleh share Full saja (D-SA1)' }
        has_active_admin: { type: boolean, description: Hanya pada pembacaan satu Space shared; false berarti arsip dan penunjukan admin belum bisa dilakukan }
        my_capabilities:
          type: array
          items: { $ref: '#/components/schemas/Capability' }
        customer:
          $ref: '#/components/schemas/CustomerRef'
    CustomerRef:
      type: object
      description: 'Customer pemilik Customer Space. Diturunkan dari kepemilikan Space (B5-01); tidak diedit terpisah'
      required: [id, code, name, archived]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        archived: { type: boolean }
    SpaceMember:
      type: object
      required: [user_id, name, role, capped_by_user_type, sources]
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string }
        user_type: { type: string }
        role: { type: string, description: 'read, limited, editor, full, atau custom' }
        capabilities: { type: array, items: { $ref: '#/components/schemas/Capability' } }
        capped_by_user_type: { type: boolean, description: 'Gabungan grant melebihi batas jenis user (D-06)' }
        sources:
          type: array
          description: 'Setiap grant yang memberi akses: langsung (direct) atau lewat group'
          items:
            type: object
            required: [kind, role]
            properties:
              kind: { type: string, enum: [direct, group] }
              name: { type: string }
              group_id: { type: string, format: uuid }
              role: { type: string }
              role_name: { type: string }
    SpaceDefaultWorkflows:
      type: object
      properties:
        task: { type: string, format: uuid, nullable: true, description: 'Workflow untuk root Task yang tidak menyebut workflow lain (B)' }
        project: { type: string, format: uuid, nullable: true, description: 'Workflow untuk root Project yang tidak menyebut workflow lain (B)' }
    SpaceCreate:
      type: object
      description: Pemilihan kepemilikan wajib (B3-SC). Tidak ada default; tanpa scope_state permintaan ditolak
      required: [name, scope_state]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        scope_state: { $ref: '#/components/schemas/SpaceScopeState' }
        client_id: { type: string, format: uuid, nullable: true, description: Wajib untuk client; harus Customer aktif tempat pembuat menjadi anggota aktif }
        shares:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/ShareInput' }
    SpaceScopeState:
      type: string
      description: internal (tanpa client_id) atau client (dengan client_id). unresolved tidak dapat dikirim
      enum: [internal, client]
    SpaceUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000, nullable: true }
        locked: { type: boolean, description: Hanya administrator }
    Capability:
      type: string
      enum: [view, comment, change_status, attach, edit, create, delete, share, use_blueprint, create_blueprint, manage_blueprint]
    ShareRole:
      type: string
      enum: [read, limited, editor, full]
    ShareTargetType:
      type: string
      enum: [space, item]
    PrincipalType:
      type: string
      enum: [user, group]
    ShareInput:
      type: object
      required: [principal_type, principal_id, role]
      properties:
        principal_type: { $ref: '#/components/schemas/PrincipalType' }
        principal_id: { type: string, format: uuid }
        role: { type: string, pattern: '^(read|limited|editor|full|custom:[0-9a-fA-F-]{36})$', description: 'Peran bawaan atau custom:<id> dari /custom-roles' }
    Share:
      allOf:
        - $ref: '#/components/schemas/ShareInput'
        - type: object
          required: [principal_name]
          properties:
            principal_name: { type: string }
            role_name: { type: string, description: Nama peran kustom (kosong untuk peran bawaan) }
            inherited_from:
              type: string
              format: uuid
              nullable: true
              description: Container tempat share ini berasal bila diwarisi
    WorkScheduleInput:
      type: object
      required: [working_days, daily_hours, exceptions]
      properties:
        timezone: { type: string, maxLength: 64, description: 'Zona waktu Workspace (IANA, mis. Asia/Jakarta). Kosong mempertahankan yang sekarang; UTC bila belum diatur' }
        working_days:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          description: Hari kerja, 0 = Minggu sampai 6 = Sabtu
          items: { type: integer, minimum: 0, maximum: 6 }
        daily_hours: { type: integer, minimum: 1, maximum: 24 }
        exceptions:
          type: array
          maxItems: 1000
          description: Tanggal libur; tanggal harus unik
          items:
            type: object
            required: [date, name]
            properties:
              date: { type: string, format: date }
              name: { type: string, maxLength: 120 }
    WorkSchedule:
      allOf:
        - $ref: '#/components/schemas/WorkScheduleInput'
        - type: object
          required: [version]
          properties:
            version: { type: integer }
    ShareReplace:
      type: object
      required: [shares]
      properties:
        shares:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/ShareInput' }

    # ── Item ──
    ItemTypeLayout:
      type: object
      description: 'Bagian panel detail: {sections: [{title, fields: [blok bawaan atau id custom field]}]}; kosong = tata letak standar'
      additionalProperties: true
    AutomationDefinition:
      type: object
      description: 'Skema tertutup WHEN/IF/THEN. when.type: item.status_changed (to_status_id), item.assigned (user_id), item.created (item_type), item.due_reached (days_before -30..30, negatif = lewat due; calendar: work = hari kerja; tanggal dievaluasi pada hari lokal zona waktu Workspace, UTC jika belum diatur), item.inactive (days 1..365), form.submitted (form_id), approval.decided (decision approved|rejected), comment.created. then.type: set_field, assign, comment, mention (text; user_ids, followers, dan group_ids dihitung saat run; hanya yang bisa melihat item yang menerima; maksimum 50 orang), notify, create_item (under=item untuk subitem), move (container_id: proyek atau folder di Space ini).'
      required: [when, then]
      properties:
        when: { type: object, additionalProperties: true }
        if: { type: array, maxItems: 10, items: { type: object, additionalProperties: true } }
        then: { type: array, minItems: 1, maxItems: 10, items: { type: object, additionalProperties: true } }
    AutomationRun:
      type: object
      required: [id, rule_id, version, event_id, event_type, action_index, status, detail, created_at]
      properties:
        id: { type: string, format: uuid }
        rule_id: { type: string, format: uuid }
        version: { type: integer }
        event_id: { type: string, format: uuid }
        event_type: { type: string }
        action_index: { type: integer, description: -1 untuk hasil tingkat aturan }
        item_id: { type: string, format: uuid, nullable: true }
        item_title: { type: string, nullable: true }
        actor_id: { type: string, format: uuid, nullable: true }
        action_type: { type: string, nullable: true, description: 'set_field, assign, comment, notify, create_item; null untuk hasil tingkat aturan' }
        status: { type: string, enum: [done, denied, skipped, loop_blocked, quota_blocked, failed, stopped] }
        reason: { type: string, description: 'Kode alasan yang stabil, mis. forbidden, not_found, field_invalid, guard, owner_no_access, field_missing, status_missing, rule_quota, workspace_quota, space_quota, origin_outside_targets, ambiguous_context, not_in_target' }
        execution_space_id: { type: string, format: uuid, nullable: true, description: 'Space tempat run dieksekusi; kosong untuk run yang di-skip' }
        matched_space_ids: { type: array, items: { type: string, format: uuid }, description: 'Semua target yang dicocokkan item' }
        detail: { type: string }
        created_at: { type: string }
    AutomationVersion:
      type: object
      required: [id, version, status, definition, created_at]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        status: { type: string, enum: [draft, published, retired] }
        definition: { $ref: '#/components/schemas/AutomationDefinition' }
        created_at: { type: string }
        published_at: { type: string, nullable: true }
    AutomationCounter:
      type: object
      required: [used, limit, state]
      properties:
        used: { type: integer }
        limit: { type: integer }
        state: { type: string, enum: [ok, warning, exhausted], description: 'warning dari 80%, exhausted dari 100%' }
    AutomationLimits:
      type: object
      required: [rule_per_hour, workspace_per_hour, space_per_hour]
      properties:
        rule_per_hour: { type: integer, minimum: 1, maximum: 100000, description: 'Per aturan Workspace (awal 50)' }
        workspace_per_hour: { type: integer, minimum: 1, maximum: 100000, description: 'Semua aturan Workspace (awal 500)' }
        space_per_hour: { type: integer, minimum: 1, maximum: 100000, description: 'Per Space, termasuk aturan Workspace yang bekerja di Space itu (awal 500)' }
    AutomationRule:
      type: object
      required: [id, space_id, name, owner_id, enabled]
      properties:
        id: { type: string, format: uuid }
        space_id: { type: string, format: uuid }
        container_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        owner_id: { type: string, format: uuid }
        enabled: { type: boolean }
        current_version_id: { type: string, format: uuid, nullable: true }
        owner_name: { type: string }
        container_title: { type: string, nullable: true }
        trigger: { type: string }
        action_count: { type: integer }
        has_draft: { type: boolean }
        last_run_at: { type: string, nullable: true }
        last_run_status: { type: string, nullable: true }
        error_count: { type: integer, description: 'Jumlah run gagal, ditolak, atau berhenti dalam 7 hari terakhir' }
        health: { type: string, enum: [ok, paused, invalid], description: 'paused: pemiliknya tidak bisa menjalankan aturan; invalid: ada yang dirujuk sudah tidak ada' }
        health_reason: { type: string, description: 'Kode alasan, mis. owner_inactive, owner_no_access, status_missing, item_type_missing, user_inactive, field_missing, container_missing' }
        archived_at: { type: string, nullable: true }
        scope: { type: string, enum: [space, workspace], description: 'workspace: aturan Workspace; space_id kosong, target_space_ids menyebut Space tempat aturan boleh jalan' }
        target_space_ids: { type: array, items: { type: string, format: uuid } }
        versions: { type: array, items: { $ref: '#/components/schemas/AutomationVersion' } }
    ItemTypeRef:
      type: object
      description: Tipe item (bawaan atau kustom); type tetap kelas perilakunya
      required: [id, key, name, icon]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        icon: { type: string }
        layout: { $ref: '#/components/schemas/ItemTypeLayout' }
    ItemTypeDef:
      type: object
      required: [id, key, name, icon, base, is_builtin, active, allowed_children, defaults, layout, version]
      properties:
        id: { type: string, format: uuid }
        space_id: { type: string, format: uuid, nullable: true, description: Space pemilik type; kosong berarti Workspace type }
        key: { type: string }
        name: { type: string }
        icon: { type: string }
        base: { $ref: '#/components/schemas/ItemType' }
        is_builtin: { type: boolean }
        active: { type: boolean }
        quick_access: { type: boolean, description: 'CIT-D05: tampil sebagai pintasan di menu Create. Hanya tipe custom aktif; tidak memberi atau mencabut izin' }
        allowed_children:
          type: array
          description: Kosong berarti mengikuti aturan kelas; terisi berarti hanya tipe ini yang boleh menjadi anak
          items: { type: string, format: uuid }
        default_workflow_id: { type: string, format: uuid, nullable: true }
        defaults:
          type: object
          description: 'Nilai awal item baru: importance, duration_days, effort_minutes'
          additionalProperties: true
        layout: { $ref: '#/components/schemas/ItemTypeLayout' }
        version: { type: integer }
    ItemTypeField:
      type: object
      required: [field_id, space_id, name, type, archived, default]
      properties:
        field_id: { type: string, format: uuid }
        space_id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }
        archived: { type: boolean, description: Field yang diarsipkan dilewati saat default diterapkan }
        default: { nullable: true }
    ItemTypeCreate:
      type: object
      required: [key, name, base]
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9_]{1,39}$' }
        space_id: { type: string, format: uuid, nullable: true, description: Kosong untuk Workspace type (admin); isi Space untuk Space type (pengelola Space) }
        name: { type: string, minLength: 1, maxLength: 80 }
        icon: { type: string }
        base: { $ref: '#/components/schemas/ItemType' }
        allowed_children: { type: array, items: { type: string, format: uuid } }
        default_workflow_id: { type: string, format: uuid, nullable: true }
        defaults: { type: object, additionalProperties: true }
        layout: { $ref: '#/components/schemas/ItemTypeLayout' }
    ItemTypeUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        icon: { type: string }
        active: { type: boolean }
        quick_access: { type: boolean }
        allowed_children: { type: array, items: { type: string, format: uuid } }
        default_workflow_id: { type: string, format: uuid, nullable: true }
        defaults: { type: object, additionalProperties: true }
        layout: { $ref: '#/components/schemas/ItemTypeLayout' }
    ItemType:
      type: string
      enum: [project, folder, task]
    StatusGroup:
      type: string
      enum: [active, completed, deferred, cancelled]
    Status:
      type: object
      required: [id, name, color, group, auto_assign, lock_transitions, allowed_next, required_fields, actor_rule, require_children_done, approval_approver_ids]
      properties:
        required_fields:
          type: array
          description: 'Guard (WF-04): isian yang wajib terisi agar item boleh masuk status ini (due_date, start_date, assignees, description, effort_minutes, atau id custom field)'
          items: { type: string }
        actor_rule: { type: string, enum: [anyone, assignee, admin], description: Siapa yang boleh memindahkan item ke status ini }
        require_children_done: { type: boolean, description: 'Validasi lintas record (WF-05): semua subitem harus selesai atau dibatalkan lebih dulu' }
        approval_approver_ids:
          type: array
          description: 'Approval otomatis (WF-03B): item yang masuk status ini memulai approval untuk pengguna ini'
          items: { type: string, format: uuid }
