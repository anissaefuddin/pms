        '422': { $ref: '#/components/responses/Problem' }
  /item-types/{typeId}:
    patch:
      tags: [items]
      operationId: updateItemType
      summary: Ubah atau nonaktifkan tipe item (hanya admin); data item lama tidak berubah
      parameters:
        - { name: typeId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemTypeUpdate' }
      responses:
        '200':
          description: OK
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemTypeDef' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /item-types/{typeId}/fields:
    get:
      tags: [items]
      operationId: listItemTypeFields
      summary: Custom field yang berlaku untuk sebuah tipe item beserta nilai defaultnya (S8.1.2; hanya admin)
      parameters:
        - { name: typeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ItemTypeField' } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /item-types/{typeId}/fields/{fieldId}:
    put:
      tags: [items]
      operationId: setItemTypeField
      summary: Pasang custom field pada tipe item, dengan default opsional yang divalidasi menurut tipe field (hanya admin)
      parameters:
        - { name: typeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: fieldId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                default: { description: 'Nilai awal item baru bertipe ini; null atau kosong = tanpa default. Tidak untuk field people, relation, formula', nullable: true }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemTypeField' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [items]
      operationId: deleteItemTypeField
      summary: Lepas custom field dari tipe item (hanya admin)
      parameters:
        - { name: typeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: fieldId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Dihapus }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
