      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [event_id, type, attempts, last_error, created_at]
                      properties:
                        event_id: { type: string, format: uuid }
                        type: { type: string }
                        item_id: { type: string, format: uuid, nullable: true }
                        attempts: { type: integer }
                        last_error: { type: string }
                        created_at: { type: string }
