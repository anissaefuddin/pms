      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_ids]
              properties:
                item_ids: { type: array, maxItems: 1000, items: { type: string, format: uuid } }
      responses:
        '200':
          description: Dependensi yang kedua ujungnya ada di daftar dan terlihat
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ItemDependency' }
        '422': { $ref: '#/components/responses/Problem' }
  /dependencies/{dependencyId}:
    patch:
      tags: [items]
      operationId: updateItemDependency
      summary: Ubah tipe atau lag dependensi dan geser penerus yang melanggar jadwal
      parameters:
        - { name: dependencyId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                type: { $ref: '#/components/schemas/DependencyType' }
                lag: { type: integer, format: int32, description: 'Lag dalam hari kerja, boleh negatif' }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemDependencyMutation' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [items]
      operationId: deleteItemDependency
      summary: Hapus dependensi dengan izin edit pada penerus
      parameters:
        - { name: dependencyId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Dihapus }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /items/{itemId}/children:
    parameters:
      - { $ref: '#/components/parameters/ItemId' }
    get:
      tags: [items]
      operationId: listItemChildren
      summary: Anak langsung item (project/folder/task) untuk Table dan Board (VIEW-01, VIEW-02)
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/ItemFilterType' }
        - { $ref: '#/components/parameters/ItemFilterStatusGroup' }
        - { $ref: '#/components/parameters/ItemFilterAssignee' }
        - { $ref: '#/components/parameters/ItemSort' }
        - { $ref: '#/components/parameters/ItemFilterField' }
      responses:
        '200': { $ref: '#/components/responses/ItemPage' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /items/{itemId}/reorder:
    post:
      tags: [items]
      operationId: reorderItem
      summary: Ubah urutan item di dalam satu lokasi (drag di Table/Board)
      parameters:
        - { $ref: '#/components/parameters/ItemId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parent_item_id]
              properties:
                space_id: { type: string, format: uuid }
                parent_item_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: Lokasi yang diurutkan; null berarti root Space
                after_item_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: Taruh setelah item ini; null berarti paling atas
      responses:
        '204': { description: Diurutkan }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /items/{itemId}/locations:
    parameters:
      - { $ref: '#/components/parameters/ItemId' }
    put:
      tags: [items]
      operationId: replaceItemLocations
      summary: Ganti seluruh lokasi item (multi-lokasi)
      description: Minimal satu lokasi. Menambah lokasi yang membentuk siklus ditolak dengan 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locations]
              properties:
                locations:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/Location' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '422': { $ref: '#/components/responses/Problem' }
  /items/{itemId}/shares:
    parameters:
      - { $ref: '#/components/parameters/ItemId' }
    get:
      tags: [items]
      operationId: listItemShares
      responses:
        '200': { $ref: '#/components/responses/VersionedShareList' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [items]
      operationId: replaceItemShares
      summary: Ganti seluruh daftar share item (SPC-11)
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShareReplace' }
      responses:
        '200': { $ref: '#/components/responses/VersionedShareList' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /items/{itemId}/views:
    parameters:
      - { $ref: '#/components/parameters/ItemId' }
    get:
      tags: [views]
      operationId: listItemViews
      responses:
        '200': { $ref: '#/components/responses/ViewList' }
        '404': { $ref: '#/components/responses/Problem' }
  /items/{itemId}/followers:
    parameters:
      - { $ref: '#/components/parameters/ItemId' }
    put:
      tags: [items]
      operationId: replaceItemFollowers
      summary: Ganti daftar follower (user yang menerima notifikasi item)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids]
              properties:
                user_ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '204': { description: OK }

  # ───────────────────────── VIEWS ─────────────────────────
  /views:
    post:
      tags: [views]
      operationId: createView
      summary: Tambah view (VIEW-08)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ViewCreate' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/View' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /views/{viewId}:
    parameters:
      - { $ref: '#/components/parameters/ViewId' }
    patch:
      tags: [views]
      operationId: updateView
      summary: Rename, ubah visibilitas, urutan, atau set default (VIEW-08)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ViewUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/View' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [views]
      operationId: deleteView
      summary: Hapus view; view default tidak bisa dihapus
      responses:
        '204': { description: Dihapus }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /views/{viewId}/duplicate:
    post:
      tags: [views]
      operationId: duplicateView
      summary: Duplikat view (VIEW-08)
      parameters:
        - { $ref: '#/components/parameters/ViewId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, visibility]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                visibility: { $ref: '#/components/schemas/ViewVisibility' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/View' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  # ───────────────────────── COLLABORATION ─────────────────────────
  /items/{itemId}/comments:
    parameters:
      - { $ref: '#/components/parameters/ItemId' }
    get:
      tags: [collaboration]
      operationId: listComments
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentPage' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    post:
      tags: [collaboration]
      operationId: createComment
      summary: Tambah komentar dengan @mention (TASK-07); memerlukan `comment`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { $ref: '#/components/schemas/RichText' }
      responses:
        '201':
          description: Dibuat
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /comments/{commentId}:
    parameters:
      - { name: commentId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [collaboration]
      operationId: updateComment
      summary: Edit komentar sendiri (atau semua bila `full`)
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { $ref: '#/components/schemas/RichText' }
      responses:
        '200':
          description: OK
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [collaboration]
      operationId: deleteComment
      summary: Hapus komentar sendiri (atau semua bila `full`)
      responses:
        '204': { description: Dihapus }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /items/{itemId}/attachments:
    parameters:
      - { $ref: '#/components/parameters/ItemId' }
    get:
      tags: [collaboration]
      operationId: listAttachments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, max_upload_bytes]
                properties:
                  max_upload_bytes: { type: integer, format: int64, minimum: 1 }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Attachment' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [collaboration]
      operationId: uploadAttachment
      summary: Unggah file (TASK-08A, SEC-01); memerlukan `attach`
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Tersimpan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /items/{projectId}/files:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [collaboration]
      operationId: listProjectFiles
      summary: File lintas item dalam project (VIEW-10); hanya item yang boleh dilihat pemanggil, tanpa akses ke project = 404
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProjectFile' }
        '404': { $ref: '#/components/responses/Problem' }
  /items/{itemId}/attachment-links:
    post:
      tags: [collaboration]
      operationId: createAttachmentLink
      summary: Lampiran berupa tautan http(s) (TASK-08B); memerlukan `attach`. Tidak ada berkas, jadi tidak ada unduhan atau versi baru (422)
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, maxLength: 2048, description: http(s) tanpa kredensial }
                title: { type: string, maxLength: 255, description: Default host URL }
      responses:
        '201':
          description: Tersimpan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /attachments/{attachmentId}/download:
    get:
      tags: [collaboration]
      operationId: downloadAttachment
      summary: Unduh file; izin dicek terhadap item pemilik (SEC-01)
      parameters:
        - { name: attachmentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Isi file
          headers:
            Content-Disposition: { schema: { type: string }, description: Selalu `attachment` }
            X-Content-Type-Options: { schema: { type: string, enum: [nosniff] } }
            Content-Security-Policy: { schema: { type: string, enum: [sandbox] } }
            Cache-Control: { schema: { type: string, enum: ['private, no-store'] } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Problem' }
  /attachments/{attachmentId}/versions:
    parameters:
      - { name: attachmentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [collaboration]
      operationId: listAttachmentVersions
      summary: Riwayat versi file, terbaru dulu (FIL-01); memerlukan `view` pada item
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AttachmentVersion' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [collaboration]
      operationId: uploadAttachmentVersion
      summary: Unggah versi baru (FIL-01); memerlukan `attach`. Aturan jenis file sama dengan lampiran baru
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Versi tersimpan; lampiran kini menunjuk versi ini
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /attachments/{attachmentId}/versions/{version}/download:
    get:
      tags: [collaboration]
      operationId: downloadAttachmentVersion
      summary: Unduh satu versi; izin dicek terhadap item pemilik. Header sama dengan unduhan lampiran
      parameters:
        - { name: attachmentId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Isi file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Problem' }
  /attachments/{attachmentId}/versions/{version}/preview:
    parameters:
      - { name: attachmentId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [collaboration]
      operationId: getAttachmentPreview
      summary: Status pratinjau satu versi (FIL-02); memerlukan `view`. Pertama kali dibuka antre render bila belum ada
      responses:
        '200':
          description: "`pending` (belum dirender), `ready` (halaman tersedia), `skipped` (jenis/ukuran tidak didukung), `failed` (file rusak)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentPreview' }
        '404': { $ref: '#/components/responses/Problem' }
  /attachment-compare:
    get:
      tags: [collaboration]
      operationId: compareAttachmentVersions
      summary: Pratinjau dua versi file yang sama untuk tampilan berdampingan (FIL-03); memerlukan `view` pada keduanya
      parameters:
        - { name: left_attachment, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: left_version, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: right_attachment, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: right_version, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Pratinjau tiap sisi (bentuk sama dengan getAttachmentPreview)
          content:
            application/json:
              schema:
                type: object
                required: [left, right]
                properties:
                  left: { $ref: '#/components/schemas/AttachmentPreview' }
                  right: { $ref: '#/components/schemas/AttachmentPreview' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /attachments/{attachmentId}/versions/{version}/preview/{page}:
    get:
      tags: [collaboration]
      operationId: getAttachmentPreviewPage
      summary: Gambar PNG satu halaman pratinjau (hasil render ulang, bukan file asli, maks 1600 px)
      parameters:
        - { name: attachmentId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: page, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: PNG
          content:
            image/png:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Problem' }
  /attachments/{attachmentId}/versions/{version}/annotations:
    parameters:
      - { name: attachmentId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [collaboration]
      operationId: listAttachmentAnnotations
      summary: Anotasi yang dipin pada satu versi; versi lain tidak ikut (FIL-02). Memerlukan `view`
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AttachmentAnnotation' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [collaboration]
      operationId: createAttachmentAnnotation
      summary: Pin komentar pada posisi relatif (0..1) di sebuah halaman; memerlukan `comment`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [x, y, body]
              properties:
                page: { type: integer, minimum: 1, default: 1 }
                x: { type: number, minimum: 0, maximum: 1 }
                y: { type: number, minimum: 0, maximum: 1 }
                body: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentAnnotation' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /attachments/{attachmentId}/versions/{version}/annotations/{annotationId}:
    parameters:
      - { name: attachmentId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
      - { name: annotationId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [collaboration]
      operationId: updateAttachmentAnnotation
      summary: Tandai selesai atau buka lagi; memerlukan `comment`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolved]
              properties:
                resolved: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentAnnotation' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [collaboration]
      operationId: deleteAttachmentAnnotation
      summary: Hapus anotasi; penulisnya atau pemilik `delete` pada item
      responses:
        '204': { description: Dihapus }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /attachments/{attachmentId}:
    delete:
      tags: [collaboration]
      operationId: deleteAttachment
      parameters:
        - { name: attachmentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Dihapus }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /items/{itemId}/relations:
    parameters:
      - { $ref: '#/components/parameters/ItemId' }
    get:
      tags: [items]
      operationId: listItemRelations
      summary: Target field relasi sebuah item; target tanpa hak View hanya dihitung, tidak diberi nama (CUST-05)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [field_id, name, items, hidden]
                      properties:
                        field_id: { type: string, format: uuid }
                        name: { type: string }
                        hidden: { type: integer }
                        items:
                          type: array
                          items:
                            type: object
                            required: [id, title, type, type_key]
                            properties:
                              id: { type: string, format: uuid }
                              title: { type: string }
                              type: { $ref: '#/components/schemas/ItemType' }
                              type_key: { type: string }
        '404': { $ref: '#/components/responses/Problem' }
  /items/{itemId}/activity:
    parameters:
      - { $ref: '#/components/parameters/ItemId' }
    get:
      tags: [collaboration]
      operationId: listActivity
      summary: Riwayat perubahan item (SPC-07)
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityPage' }

  /stream:
    get:
      tags: [inbox]
      operationId: listStream
      summary: Stream aktivitas dan komentar pada item yang boleh dilihat (NAV-04)
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: filter, in: query, schema: { type: string, enum: [everything, followed, assigned, conversations], default: everything } }
        - { name: hide_auto, in: query, schema: { type: boolean, default: false }, description: Sembunyikan perubahan otomatis (penjadwalan) }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StreamPage' }
        '422': { $ref: '#/components/responses/Problem' }

  # ───────────────────────── INBOX, TO-DO, SEARCH ─────────────────────────
  /notifications:
    get:
      tags: [inbox]
      operationId: listNotifications
      summary: Inbox (NAV-03)
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: unread_only, in: query, schema: { type: boolean, default: false } }
        - name: box
          in: query
          description: incoming (default), archive (milik sendiri yang diarsipkan), sent (notifikasi yang dipicu pemanggil untuk orang lain; hanya yang masih bisa dilihat pemanggil; unread_count selalu 0 di luar incoming)
          schema: { type: string, enum: [incoming, archive, sent], default: incoming }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPage' }
        '422': { $ref: '#/components/responses/Problem' }
  /notifications/read-all:
    post:
      tags: [inbox]
      operationId: markAllNotificationsRead
      summary: Mark all as read (NAV-03)
      responses:
        '204': { description: OK }
  /notifications/archive-all:
    post:
      tags: [inbox]
      operationId: archiveAllNotifications
      summary: Archive all (NAV-03)
      responses:
        '204': { description: OK }
  /notifications/{notificationId}:
    patch:
      tags: [inbox]
      operationId: updateNotification
      summary: Tandai dibaca atau arsipkan satu notifikasi
      parameters:
        - { name: notificationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                read: { type: boolean }
                archived: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /me/todo:
    get:
      tags: [inbox]
      operationId: listMyTodo
      summary: My to-do (NAV-05)
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - name: filter
          in: query
          schema: { type: string, enum: [all, active, overdue], default: active }
        - name: sort
          in: query
          schema:
            type: string
            enum: [priority, date, date_modified, date_created, status, importance, title]
            default: date
      responses:
        '200': { $ref: '#/components/responses/ItemPage' }
        '422': { $ref: '#/components/responses/Problem' }
  /me/shared:
    get:
      tags: [inbox]
      operationId: listSharedWithMe
      summary: Item yang dibagikan langsung ke saya dan tidak berada di Space yang bisa saya akses (NAV-01)
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { $ref: '#/components/responses/ItemPage' }
  /search:
    get:
      tags: [inbox]
      operationId: search
      summary: Pencarian global (NAV-06)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: space_id, in: query, schema: { type: string, format: uuid } }
        - { name: container_id, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 }, description: Maksimum per grup }
        - { name: assigned_to_me, in: query, schema: { type: boolean, default: false }, description: Hanya item yang ditugaskan ke saya (NAV-07) }
        - { name: status_group, in: query, schema: { type: string, enum: [active, completed, deferred, cancelled] }, description: Hanya item dengan grup status ini (NAV-07) }
        - { name: type_key, in: query, schema: { type: string }, description: 'Hanya item (dan komentar pada item) bertipe ini, mis. bug (S8.1.5)' }
        - { name: sort, in: query, schema: { type: string, enum: [relevance, date_modified], default: relevance } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }, description: 'Lewati sekian hasil yang boleh dilihat per grup, untuk paginasi' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResults' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  # ───────────────────────── RECYCLE ─────────────────────────
  /recycle-bin:
    get:
      tags: [recycle]
      operationId: listRecycleBin
      summary: Item yang dihapus dan masih bisa dipulihkan (BIN-01)
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/ItemType' } }
        - { name: sort, in: query, schema: { type: string, enum: [deleted_at, title], default: deleted_at } }
      responses:
        '200': { $ref: '#/components/responses/ItemPage' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [recycle]
      operationId: emptyRecycleBin
      summary: Hapus permanen semua entri yang boleh dihapus pemanggil (BIN-03); tidak bisa dibatalkan
      responses:
        '200':
          description: Jumlah entri yang dihapus
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties: { deleted: { type: integer } }
  /recycle-bin/{itemId}/restore:
    post:
      tags: [recycle]
      operationId: restoreItem
      summary: Pulihkan item beserta turunannya (BIN-02)
      parameters:
        - { $ref: '#/components/parameters/ItemId' }
      responses:
        '200':
          description: Dipulihkan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  # ───────────────────────── SYSTEM ─────────────────────────
  /workflows:
    get:
      tags: [system]
      operationId: listWorkflows
      summary: Workflow dan statusnya (WF-01, WF-02, WF-03A); semua user yang login boleh membaca
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Workflow' }
    post:
      tags: [system]
      operationId: createWorkflow
      summary: Buat workflow dengan status awal (admin saja, WF-02)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /workflows/{workflowId}:
    parameters:
      - { name: workflowId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [system]
      operationId: renameWorkflow
      summary: Ubah nama workflow (admin saja)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [system]
      operationId: deleteWorkflow
      summary: Hapus workflow yang tidak dipakai (admin saja); workflow default atau yang dipakai item ditolak
      responses:
        '204': { description: Dihapus }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /workflows/{workflowId}/revisions/{revision}:
    get:
      operationId: getWorkflowRevision
      summary: Salinan beku aturan workflow pada satu revisi (administrator)
      parameters:
        - { name: workflowId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: revision, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [workflow_id, revision, created_at, definition]
                properties:
                  workflow_id: { type: string, format: uuid }
                  revision: { type: integer }
                  created_at: { type: string, format: date-time }
                  definition: { type: object, additionalProperties: true }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /workflows/{workflowId}/statuses:
    parameters:
      - { name: workflowId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [system]
      operationId: createStatus
      summary: Tambah status di akhir workflow (admin saja, WF-03A)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /workflows/{workflowId}/status-order:
    parameters:
      - { name: workflowId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [system]
      operationId: reorderStatuses
      summary: Urutkan status; harus memuat semua status workflow, dan status pertama harus Active
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status_ids]
              additionalProperties: false
              properties:
                status_ids:
                  type: array
                  maxItems: 50
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /statuses/{statusId}:
    parameters:
      - { name: statusId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [system]
      operationId: updateStatus
      summary: Ubah nama, grup, warna, auto-assign, kunci transisi, atau transisi yang diizinkan (admin saja)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [system]
      operationId: deleteStatus
      summary: Hapus status. Bila dipakai item, `move_to` (status lain di workflow yang sama) wajib
      parameters:
        - { name: move_to, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Workflow setelah perubahan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /items/{itemId}/approvals:
    parameters:
      - { $ref: '#/components/parameters/ItemId' }
    get:
      tags: [items]
      operationId: listItemApprovals
      summary: Approval pada item beserta keputusan tiap approver (SPC-12)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Approval' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [items]
      operationId: createItemApproval
      summary: Minta approval (butuh kemampuan edit; approver harus bisa melihat item)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalInput' }
      responses:
        '201':
          description: Dibuat
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /items/{itemId}/approval-events:
    parameters:
      - { $ref: '#/components/parameters/ItemId' }
    get:
      tags: [items]
      operationId: listItemApprovalEvents
      summary: Riwayat approval append-only pada item, terbaru dulu; keputusan dipin ke versi item (S9.2.3)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ApprovalEvent' }
        '404': { $ref: '#/components/responses/Problem' }
  /file-reviews:
    get:
      tags: [items]
      operationId: listFileReviews
      summary: Approval file yang menunjuk saya sebagai approver, tanpa nama item (FIL-04)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FileReview' }
  /approvals/{approvalId}:
    parameters:
      - { name: approvalId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [items]
      operationId: updateApproval
      summary: Ubah kebijakan, deskripsi, tenggat, atau reassign daftar approver dengan If-Match. Keputusan approver yang dipertahankan tetap berlaku; penghapusan dan penambahan dicatat pada riwayat.
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalPatch' }
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [items]
      operationId: deleteApproval
      responses:
        '204': { description: Dihapus }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /approvals/{approvalId}/decision:
    parameters:
      - { name: approvalId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [items]
      operationId: decideApproval
      summary: Approve atau reject; hanya approver yang disebut. Suara boleh diubah selama hasil belum final; setelah final 409 `approval_final` (APR-03)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              additionalProperties: false
              properties:
                decision: { type: string, enum: [approved, rejected] }
                comment: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /spaces/{spaceId}/forms:
    parameters:
      - { $ref: '#/components/parameters/SpaceId' }
    get:
      tags: [forms]
      operationId: listSpaceForms
      summary: Form di Space (butuh kemampuan edit pada Space; FORM-05)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FormSummary' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [forms]
      operationId: createForm
      summary: Buat form (FORM-01, FORM-02); butuh edit pada Space dan hak membuat item di tujuan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormInput' }
      responses:
        '201':
          description: Dibuat
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Form' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /spaces/{spaceId}/blueprints:
    parameters:
      - { $ref: '#/components/parameters/SpaceId' }
    get:
      tags: [blueprints]
      operationId: listBlueprints
      summary: Blueprint di Space (butuh view pada Space; SPC-13)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Blueprint' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [blueprints]
      operationId: createBlueprint
      summary: Simpan item beserta turunan yang terlihat sebagai blueprint (butuh edit pada Space dan view pada item)
      description: >
        Menyalin satu kali; blueprint tidak tertaut ke sumber. Status, assignee, durasi, field kustom, dependensi antar
        item, dan tanggal (sebagai selisih hari) ikut tersimpan. Komentar, lampiran, approval, dan share tidak.
        Maksimal 200 item.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, source_item_id]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                source_item_id: { type: string, format: uuid }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Blueprint' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /blueprints/{blueprintId}:
    parameters:
      - { name: blueprintId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [blueprints]
      operationId: getBlueprint
      summary: Baca satu blueprint beserta strukturnya (butuh view pada Space). Field restricted tidak ditampilkan.
      responses:
        '200':
          description: Blueprint dan tree-nya
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Blueprint' }
                  - type: object
                    required: [tree]
                    properties:
                      tree: { $ref: '#/components/schemas/BlueprintTree' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [blueprints]
      operationId: editBlueprint
      summary: Ubah nama dan/atau struktur blueprint (butuh manage_blueprint pada Space). Item yang sudah dibuat tidak berubah.
      description: >
        `version` harus sama dengan versi yang dibaca; jika tidak, 409. `tree` mengganti seluruh struktur dan diperiksa
        seperti saat menyimpan. Field kustom yang dibatasi (restricted) dibuang dari tree.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
                name: { type: string, minLength: 1, maxLength: 120 }
                tree: { $ref: '#/components/schemas/BlueprintTree' }
      responses:
        '200':
          description: Blueprint setelah perubahan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Blueprint' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [blueprints]
      operationId: deleteBlueprint
      summary: Hapus blueprint (butuh manage_blueprint pada Space); item yang sudah dibuat darinya tidak berubah
      responses:
        '204': { description: Dihapus }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /blueprints/{blueprintId}/preview:
    parameters:
      - { name: blueprintId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [blueprints]
      operationId: previewBlueprint
      summary: Pratinjau item dan tanggal yang akan dibuat dari blueprint (tidak menulis apa pun; butuh use_blueprint)
      description: Memakai aturan tanggal yang sama dengan pembuatan item, sehingga hasilnya sama dengan `createItemsFromBlueprint`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, description: Mengganti judul item akar }
                start_date: { type: string, format: date }
                finish_date: { type: string, format: date }
      responses:
        '200':
          description: Daftar item dalam urutan blueprint
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/BlueprintPreviewItem' } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /account-blueprints:
    get:
      tags: [blueprints]
      operationId: listAccountBlueprints
      summary: Blueprint akun yang boleh dilihat pemanggil (miliknya; semua untuk admin instance)
      responses:
        '200':
          description: Daftar blueprint akun
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Blueprint' } }
  /blueprints/{blueprintId}/items:
    parameters:
      - { name: blueprintId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [blueprints]
      operationId: createItemsFromBlueprint
      summary: Buat item (dan seluruh turunannya) dari blueprint dalam satu transaksi
      description: >
        `locations` berlaku untuk item akar; turunan dibuat di bawahnya. Tanggal dihitung dari `start_date` atau `finish_date`; tanpa
        keduanya item baru tidak punya tanggal. Assignee yang sudah nonaktif dan nilai field kustom yang tidak
        lagi cocok dengan Space tujuan dilewati.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locations]
              properties:
                locations:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/Location' }
                title: { type: string, description: Mengganti judul item akar }
                start_date: { type: string, format: date, description: Tanggal mulai yang menjadi jangkar tanggal turunan. Tidak boleh bersama finish_date. }
                finish_date: { type: string, format: date, description: Tanggal selesai yang menjadi jangkar item terakhir dalam blueprint (tanggal paling akhir selesai pada tanggal ini). Tidak boleh bersama start_date. }
      responses:
        '201':
          description: Item akar yang dibuat
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /forms/{formId}:
    parameters:
      - { name: formId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [forms]
      operationId: getForm
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Form' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [forms]
      operationId: replaceForm
