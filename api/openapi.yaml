          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          nullable: true
        role_id:
          type: string
          format: uuid
          nullable: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        minutes_per_day:
          type: integer
    Workload:
      type: object
      properties:
        people:
          type: array
          items:
            $ref: '#/components/schemas/ResourcePerson'
        role_demand:
          type: array
          items:
            $ref: '#/components/schemas/ResourcePerson'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/WorkloadTask'
        bookings:
          type: array
          items:
            $ref: '#/components/schemas/ResourceBooking'
    DashboardRename:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
    DashboardUpdate:
      type: object
      additionalProperties: false
      description: Salah satu atau keduanya; nama dan orientasi tata letak (DASH-05)
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        layout: { type: string, enum: [columns, stack], description: 'columns: widget berdampingan; stack: satu di atas yang lain' }
    DashboardDestination:
      allOf:
        - { $ref: '#/components/schemas/DashboardRename' }
        - type: object
          properties:
            space_id: { type: string, format: uuid, nullable: true, description: null atau dihilangkan untuk personal }
    DashboardMove:
      type: object
      required: [space_id]
      properties:
        space_id: { type: string, format: uuid, nullable: true, description: null untuk pindah ke personal milik pemanggil }
    DashboardSummary:
      type: object
      required: [id, owner_id, space_id, name, layout, version]
      properties:
        id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        space_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        layout: { type: string, enum: [columns, stack] }
        version: { type: integer, minimum: 1 }
    AnalyticsFilters:
      type: object
      additionalProperties: false
      properties:
        due_this_week: { type: boolean }
        due_this_month: { type: boolean }
        entry_this_month: { type: boolean }
        no_due_date: { type: boolean }
        awaiting_my_review: { type: boolean }
        status_groups: { type: array, maxItems: 4, items: { type: string, enum: [active, completed, deferred, cancelled] } }
        assignees: { type: array, maxItems: 100, items: { type: string, description: 'UUID pengguna atau "me"' } }
        unassigned: { type: boolean }
        importance: { type: array, maxItems: 3, items: { type: string, enum: [high, normal, low] } }
        type_keys: { type: array, maxItems: 100, items: { type: string }, description: Hanya item bertipe ini (kunci tipe item bawaan atau kustom; S8.1.5) }
        followed: { type: boolean }
        starred: { type: boolean }
        overdue: { type: boolean }
        due_from: { type: string, format: date }
        due_to: { type: string, format: date }
        effort_min: { type: integer, minimum: 0, maximum: 10000000 }
        effort_max: { type: integer, minimum: 0, maximum: 10000000 }
        entry_from: { type: string, format: date }
        entry_to: { type: string, format: date }
        billing: { type: string, enum: [billable, non_billable] }
        exclude_milestones: { type: boolean, description: Milestone tidak dihitung sebagai task (WA-D03); hanya untuk reporting_on tasks }
    AnalyticsQuery:
      type: object
      additionalProperties: false
      required: [reporting_on, metric]
      properties:
        reporting_on: { type: string, enum: [tasks, projects, time_entries] }
        space_ids: { type: array, maxItems: 100, items: { type: string, format: uuid }, description: Kosong berarti semua Space yang terlihat }
        container_ids: { type: array, maxItems: 100, items: { type: string, format: uuid }, description: Project atau Folder; hanya subpohonnya }
        metric: { type: string, enum: [count, effort_minutes, sum_field, avg_field, completion_percent, minutes, billable_minutes, actual_cost_minor, utilization], description: 'tasks/projects: count, effort_minutes, sum_field (jumlah custom field Number, Currency atau Percent, butuh field_id), avg_field (rata-rata per task, tugas tanpa nilai dihitung 0), completion_percent (persen task selesai dari yang ada dalam cakupan); time_entries: minutes, billable_minutes, actual_cost_minor (biaya aktual dalam satuan minor, hanya administrator; selain itu 403), count' }
        field_id: { type: string, format: uuid, description: 'Custom field untuk metric sum_field atau dimensi field (single select); wajib hanya pada keduanya' }
        group_by: { type: string, enum: [assignee, status, status_id, status_group, importance, type, item_type, space, field, due_month, created_month, user, item, category, billing_type, entry_month] }
        break_by: { type: string, enum: [assignee, status, status_id, status_group, importance, type, item_type, space, field, due_month, created_month, user, item, category, billing_type, entry_month] }
        filters: { $ref: '#/components/schemas/AnalyticsFilters' }
    WidgetData:
