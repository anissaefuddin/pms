      - { $ref: '#/components/parameters/SpaceId' }
    get:
      tags: [automation]
      operationId: listAutomationRules
      summary: Aturan otomasi sebuah Space (AUT-02); butuh hak Edit
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AutomationRule' } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [automation]
      operationId: createAutomationRule
      summary: Buat aturan sebagai draft; pembuatnya menjadi pemilik dan aturan berjalan dengan hak pemilik (AUT-03)
