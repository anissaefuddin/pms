      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutomationRule' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /automation-rules/{ruleId}:
    parameters:
      - { name: ruleId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [automation]
      operationId: getAutomationRule
      summary: Aturan beserta semua versinya
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutomationRule' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [automation]
      operationId: updateAutomationRule
      summary: Ganti nama atau aktif/nonaktifkan; aktif hanya bila ada versi terbit. Pemilik atau admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                enabled: { type: boolean }
      responses:
        '200':
          description: OK
          content:
