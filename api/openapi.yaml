            schema: { $ref: '#/components/schemas/ItemTypeCreate' }
      responses:
        '201':
          description: Dibuat
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemTypeDef' }
