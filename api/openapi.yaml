        idp_metadata_xml: { type: string, maxLength: 262144, description: 'SAML: metadata penyedia; kosong mempertahankan yang tersimpan. OIDC memakai issuer, client_id, client_secret' }
        email_attribute: { type: string, maxLength: 200, description: 'SAML: nama atribut yang memuat email (opsional)' }
        issuer: { type: string, description: URL https penyedia OpenID Connect }
        client_id: { type: string, maxLength: 255 }
        client_secret: { type: string, maxLength: 1000, nullable: true, description: Hilangkan untuk mempertahankan rahasia yang tersimpan; string kosong menghapusnya }
        auto_link: { type: boolean, description: Tautkan masuk pertama ke pengguna aktif dengan email terverifikasi yang sama }
        allowed_domains: { type: array, maxItems: 50, items: { type: string } }
    SsoConfig:
      type: object
      required: [configured, kind, name, enabled, issuer, client_id, secret_set, auto_link, allowed_domains, redirect_url, key_configured]
