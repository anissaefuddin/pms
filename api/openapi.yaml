        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /webhooks:
    get:
      tags: [webhooks]
      operationId: listWebhooks
      summary: Langganan webhook milik pengguna (tanpa secret)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, event_types]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Webhook' } }
                  event_types: { type: array, items: { type: string } }
    post:
      tags: [webhooks]
      operationId: createWebhook
      summary: Buat langganan; secret hanya muncul di respons ini
      description: |
        Setiap pengiriman adalah POST JSON dengan header X-PMS-Event, X-PMS-Delivery (id event, tetap sama pada retry; gunakan untuk dedupe),
        X-PMS-Timestamp (detik unix) dan X-PMS-Signature = "v1=" + hex(HMAC-SHA256(secret, timestamp + "." + body)).
        Penerima WAJIB memverifikasi tanda tangan dan menolak permintaan bila timestamp berselisih > 5 menit dari jam penerima (anti-replay).
        Hanya event atas item yang boleh dilihat pemilik langganan yang dikirim. URL harus https dan tidak boleh menuju alamat internal.
        Gagal berturut-turut 10 kali menonaktifkan langganan; retry dengan backoff 1m, 4m, 16m, 64m, 4j (maks 6 percobaan per pengiriman).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url, event_types]
              properties:
                name: { type: string, maxLength: 100 }
                url: { type: string, format: uri }
                event_types: { type: array, minItems: 1, items: { type: string } }
      responses:
        '201':
          description: Dibuat; berisi secret
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Webhook' }
        '422': { $ref: '#/components/responses/Problem' }
  /webhooks/{webhookId}:
    parameters:
      - { name: webhookId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [webhooks]
      operationId: updateWebhook
      summary: Ubah atau aktifkan kembali (enabled=true mereset penghitung gagal)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                url: { type: string, format: uri }
                event_types: { type: array, minItems: 1, items: { type: string } }
                enabled: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Webhook' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [webhooks]
      operationId: deleteWebhook
      summary: Hapus langganan
      responses:
        '204': { description: Dihapus }
        '404': { $ref: '#/components/responses/Problem' }
  /webhooks/{webhookId}/deliveries:
    parameters:
      - { name: webhookId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [webhooks]
      operationId: listWebhookDeliveries
      summary: Log pengiriman terbaru (100)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, event_id, event_type, status, attempts, created_at]
                      properties:
                        id: { type: string, format: uuid }
                        event_id: { type: string, format: uuid }
                        event_type: { type: string }
                        status: { type: string, enum: [pending, success, failed] }
                        attempts: { type: integer }
                        response_status: { type: integer, nullable: true }
                        last_error: { type: string, nullable: true }
                        created_at: { type: string, format: date-time }
                        delivered_at: { type: string, format: date-time, nullable: true }
        '404': { $ref: '#/components/responses/Problem' }
