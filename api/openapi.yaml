      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [SAMLResponse, RelayState]
              properties:
                SAMLResponse: { type: string, description: Base64 dari XML Response bertanda tangan }
                RelayState: { type: string }
      responses:
        '302': { description: "Alasan gagal: state, failed, unavailable, unlinked, unverified, inactive, domain, session, already_linked" }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/sso/saml/metadata:
    get:
      operationId: samlServiceProviderMetadata
      summary: Metadata penyedia layanan untuk administrator penyedia identitas (publik; tanpa rahasia)
      security: []
      responses:
        '200':
          description: EntityDescriptor
          content:
            application/samlmetadata+xml:
              schema: { type: string }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/sso/{kind}/start:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string, enum: [oidc, saml] } }
    get:
      operationId: startSso
      summary: Mulai masuk (atau menautkan, link=1 butuh sesi) dan arahkan peramban ke penyedia identitas
      security: []
      parameters:
        - { name: next, in: query, schema: { type: string, maxLength: 500 }, description: Hanya jalur relatif di situs ini; selain itu menjadi / }
        - { name: link, in: query, schema: { type: string, enum: ['1'] } }
      responses:
        '302': { description: 'Pengalihan ke penyedia identitas, atau ke /login tanpa sesi bila link=1' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/sso/{kind}/callback:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string, enum: [oidc, saml] } }
    get:
      operationId: finishSso
      summary: Tujuan pengalihan penyedia. Sukses memulai sesi dan mengalihkan ke next; gagal mengalihkan ke /login?sso_error=<alasan>
      security: []
      parameters:
        - { name: state, in: query, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        '302': { description: "Alasan gagal: state, denied, failed, unavailable, unlinked, unverified, inactive, domain, session, already_linked" }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /sso/{kind}:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string, enum: [oidc, saml] } }
    get:
      operationId: getSsoConfig
      summary: Konfigurasi penyedia (admin); rahasia klien tidak pernah dikembalikan
      responses:
        '200':
          description: Konfigurasi, atau nilai bawaan bila belum diatur
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SsoConfig' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: putSsoConfig
      summary: Simpan penyedia (admin); mengaktifkan butuh rahasia tersimpan dan discovery yang berhasil
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SsoConfigInput' }
      responses:
        '200':
          description: Tersimpan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SsoConfig' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteSsoConfig
      summary: Hapus penyedia beserta semua identitas tertaut (admin)
      responses:
        '204': { description: Dihapus }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /me/identities:
    get:
      operationId: listMyIdentities
      summary: Identitas SSO yang tertaut ke pemanggil
      responses:
        '200':
          description: Daftar
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LinkedIdentity' }
  /me/identities/{kind}:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string, enum: [oidc, saml] } }
    delete:
      operationId: unlinkMyIdentity
      summary: Lepas tautan; ditolak 409 bila pemanggil tidak punya password
      responses:
        '204': { description: Dilepas }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /audit-events:
    get:
      operationId: listAuditEvents
      summary: Jejak audit keamanan (hanya admin), terbaru dulu
      parameters:
        - { name: action, in: query, schema: { type: string, maxLength: 80 }, description: 'Aksi persis, misalnya auth.login' }
        - { name: category, in: query, schema: { type: string, maxLength: 40 }, description: 'Area, misalnya auth, user, share, role, sso, api_key' }
        - { name: actor_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Satu halaman
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /audit-events/export:
    get:
      operationId: exportAuditEvents
      summary: Ekspor CSV (maksimal 10.000 baris, sel berawalan rumus diberi tanda kutip); ekspor itu sendiri dicatat
      parameters:
        - { name: action, in: query, schema: { type: string, maxLength: 80 } }
        - { name: category, in: query, schema: { type: string, maxLength: 40 } }
        - { name: actor_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: CSV
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /overview:
    get:
      tags: [overview]
      operationId: getOverview
      summary: Workspace Overview lintas Space, hanya Space yang bisa dilihat pengguna (D-17.1); cache beberapa menit pada klien
      parameters:
        - { name: space_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: include_archived, in: query, required: false, schema: { type: boolean, default: false } }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [name, overdue, progress, last_activity], default: name } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [generated_at, timezone, kpis, spaces, total]
                properties:
                  generated_at: { type: string, format: date-time }
                  timezone: { type: string, description: 'Zona waktu pengguna yang dipakai untuk batas hari dan minggu' }
                  kpis:
                    type: object
                    required: [accessible_spaces, active_projects, overdue_tasks, completed_this_week, at_risk_projects]
                    properties:
                      accessible_spaces: { type: integer }
                      active_projects: { type: integer, description: 'Project berstatus grup active, dihitung distinct per ID' }
                      overdue_tasks: { type: integer, description: 'Task grup active dengan due_date sebelum hari ini (zona pengguna)' }
                      completed_this_week: { type: integer, description: 'Task grup completed sejak Senin 00:00 zona pengguna' }
                      at_risk_projects: { type: object, properties: { status: { type: string, enum: [NOT_AVAILABLE] } } }
                  spaces:
                    type: array
                    items:
                      type: object
                      required: [id, name, archived, project_count, task_count, done_task_count, progress_percent, overdue_count, health, last_activity, effective_access]
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        icon_key: { type: string }
                        archived: { type: boolean }
                        project_count: { type: integer }
                        task_count: { type: integer }
                        done_task_count: { type: integer }
                        progress_percent: { type: integer, nullable: true }
                        overdue_count: { type: integer }
                        health: { type: string, enum: [empty, attention, on_track] }
                        last_activity: { type: string, format: date-time, nullable: true }
                        effective_access: { type: string, enum: [space_admin, full, editor, limited, read] }
                        customer:
                          $ref: '#/components/schemas/CustomerRef'
                  next_cursor: { type: string, nullable: true }
                  total: { type: integer }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /overview/timeline:
    get:
      tags: [overview]
      operationId: getOverviewTimeline
      summary: Project dan Task yang jatuh tempo dalam rentang tanggal, dikelompokkan per Space yang bisa dilihat pengguna (read-only)
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date }, description: 'Tanggal awal; kosong berarti hari ini di zona pengguna' }
        - { name: days, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 400, default: 60 } }
        - { name: space_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: include_archived, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [timezone, from, to, spaces, truncated]
                properties:
                  timezone: { type: string }
                  from: { type: string, format: date, description: 'Inklusif' }
                  to: { type: string, format: date, description: 'Inklusif' }
                  truncated: { type: boolean, description: 'true bila baris melebihi batas pembacaan (2000)' }
                  spaces:
                    type: array
                    items:
                      type: object
                      required: [id, name, effective_access, nodes]
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        icon_key: { type: string }
                        effective_access: { type: string, enum: [space_admin, full, editor, limited, read] }
                        nodes:
                          type: array
                          description: 'Item tingkat atas Space (tanpa induk di Space ini), dalam hierarki nyata: Folder atau Project, Task, Subtask'
                          items: { $ref: '#/components/schemas/OverviewTimelineNode' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /overview/agenda:
    get:
      tags: [overview]
      operationId: getOverviewAgenda
      summary: Project dan Task jatuh tempo, diurutkan tanggal, dengan penanda terlambat (read-only); item selesai dan dibatalkan tidak ditampilkan
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date }, description: 'Tanggal awal; kosong berarti hari ini di zona pengguna' }
        - { name: days, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 31, default: 14 } }
        - { name: space_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: type, in: query, required: false, schema: { type: string, enum: [project, task] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
        - { name: include_archived, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [timezone, today, from, to, items, overdue_count, truncated]
                properties:
                  timezone: { type: string }
                  today: { type: string, format: date }
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  overdue_count: { type: integer, description: 'Semua Task aktif yang sudah lewat jatuh tempo, di luar rentang' }
                  truncated: { type: boolean }
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, title, type, due_date, status_group, space_id, space_name, overdue]
                      properties:
                        id: { type: string, format: uuid }
                        title: { type: string }
                        type: { type: string, enum: [project, task] }
                        due_date: { type: string, format: date }
                        status_group: { type: string, enum: [active, deferred] }
                        space_id: { type: string, format: uuid }
                        space_name: { type: string }
                        overdue: { type: boolean }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /overview/tasks:
    get:
      tags: [overview]
      operationId: getOverviewTasks
      summary: Task lintas Space yang terlihat, dengan filter bebas (read-only). Preset overdue dan completed_week memakai aturan yang sama dengan angka ringkasan.
      parameters:
        - { name: preset, in: query, required: false, schema: { type: string, enum: [overdue, completed_week] } }
        - { name: space_id, in: query, required: false, description: 'Boleh diulang; kosong berarti semua Space yang terlihat', schema: { type: array, items: { type: string, format: uuid } }, style: form, explode: true }
        - { name: assignee_id, in: query, required: false, description: 'Boleh diulang; Task yang punya salah satu penerima', schema: { type: array, items: { type: string, format: uuid } }, style: form, explode: true }
        - { name: status, in: query, required: false, description: 'Boleh diulang; grup status', schema: { type: array, items: { type: string, enum: [active, deferred, completed, cancelled] } }, style: form, explode: true }
        - { name: due_from, in: query, required: false, schema: { type: string, format: date } }
        - { name: due_to, in: query, required: false, schema: { type: string, format: date } }
        - { name: q, in: query, required: false, description: 'Judul mengandung teks ini (tidak peka huruf besar)', schema: { type: string, maxLength: 120 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
        - { name: include_archived, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [timezone, today, items, truncated]
                properties:
                  timezone: { type: string }
                  today: { type: string, format: date }
                  truncated: { type: boolean }
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, title, status_group, status_name, space_id, space_name, overdue, assignees]
                      properties:
                        id: { type: string, format: uuid }
                        title: { type: string }
                        due_date: { type: string, format: date, nullable: true }
                        start_date: { type: string, format: date, nullable: true }
                        status_group: { type: string, enum: [active, deferred, completed, cancelled] }
                        status_name: { type: string }
                        completed_at: { type: string, nullable: true }
                        space_id: { type: string, format: uuid }
                        space_name: { type: string }
                        overdue: { type: boolean }
                        assignees:
                          type: array
                          items:
                            type: object
                            required: [id, name]
                            properties:
                              id: { type: string, format: uuid }
                              name: { type: string }
        '422': { $ref: '#/components/responses/Problem' }
  /dashboards:
