      operationId: streamEvents
      summary: Aliran event realtime (SSE)
      description: |
        `text/event-stream`. Nama event: `item.created`, `item.updated`, `item.deleted`, `item.restored`, `comment.created`,
        `notification.created`, `resync`. Data hanya berisi ID, tipe, dan versi (lihat `RealtimeEvent`);
