        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /space-templates:
    get:
      tags: [spaces]
      operationId: listSpaceTemplates
      summary: Template Space bawaan per kategori (SPC-18)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SpaceTemplate' }
  /space-templates/{templateId}/spaces:
