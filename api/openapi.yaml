  # ───────────────────────── ITEMS ─────────────────────────
  /items:
    post:
      tags: [items]
      operationId: createItem
      summary: Buat project, folder, atau task (SPC-05, SPC-06, TASK-01, TASK-02)
      description: |
        `locations` wajib berisi minimal satu lokasi. Untuk subtask, isi `parent_item_id` dengan task induk.
        `default_view_type` hanya berlaku untuk project/folder; nilainya table, board, gantt, calendar, files, atau chart.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemCreate' }
      responses:
        '201':
          description: Dibuat
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /items/{itemId}:
    parameters:
      - { $ref: '#/components/parameters/ItemId' }
    get:
      tags: [items]
      operationId: getItem
      summary: Detail item (SPC-07, TASK-03)
      responses:
        '200':
          description: OK
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [items]
      operationId: updateItem
      summary: Ubah item (nama, status, tanggal, deskripsi, assignee, milestone)
      description: |
        `status_id` memerlukan kemampuan `change_status`; field lain memerlukan `edit`.
        Perubahan tanggal atau durasi dapat menggeser jadwal dalam transaksi yang sama.
        Effort dan allocation mengubah jadwal hanya saat `recalculate_duration` bernilai true.
        `affected_items` berisi penerus yang bergeser dan dapat dilihat pemanggil.
        Pergeseran urutan memakai endpoint `reorder`.
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemUpdate' }
      responses:
        '200':
          description: OK
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemPatchResult' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [items]
      operationId: deleteItem
      summary: Pindahkan item dan turunannya ke Recycle bin (BIN-01)
      responses:
        '204': { description: Dipindahkan ke Recycle bin }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /items/{itemId}/dependencies:
    parameters:
      - { $ref: '#/components/parameters/ItemId' }
    get:
      tags: [items]
      operationId: listItemDependencies
      summary: Daftar dependensi masuk dan keluar dengan kedua ujung terlihat
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ItemDependency' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [items]
      operationId: createItemDependency
      summary: Tambah pendahulu bagi Item penerus pada URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [predecessor_id, type]
              properties:
                predecessor_id: { type: string, format: uuid }
                type: { $ref: '#/components/schemas/DependencyType' }
                lag: { type: integer, format: int32, default: 0, description: 'Lag dalam hari kerja, boleh negatif' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemDependencyMutation' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /dependencies/query:
    post:
      tags: [items]
      operationId: queryDependencies
