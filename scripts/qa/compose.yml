# Instance QA terisolasi LOKAL (Mac). Tidak menyentuh server dev-lens. Dipakai oleh up.sh/down.sh/seed.sh.
name: pms-qa-${QA_INSTANCE:-a}
services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: pms
      POSTGRES_USER: pms
      POSTGRES_PASSWORD: ${QA_PG_PASSWORD:-qa-local-pw}
    ports: ["127.0.0.1:${QA_PG_PORT:-55514}:5432"]
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pms -d pms"]
      interval: 3s
      timeout: 3s
      retries: 30
  app:
    image: ${QA_IMAGE:?set QA_IMAGE}
    environment:
      DB_HOST: postgres
      DB_PASSWORD: ${QA_PG_PASSWORD:-qa-local-pw}
      PUBLIC_URL: http://localhost:${QA_APP_PORT:-18091}
      COOKIE_SECURE: "false"
      MAX_SEATS: "25"
    ports: ["127.0.0.1:${QA_APP_PORT:-18091}:8080"]
    volumes: [files:/data/files]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  pg:
  files:
