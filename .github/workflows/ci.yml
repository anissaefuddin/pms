name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: pms_test, POSTGRES_USER: pms, POSTGRES_PASSWORD: pms }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pms -d pms_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: gofmt
        run: |
          unformatted=$(gofmt -l server)
          [ -z "$unformatted" ] || { echo "Not gofmt-formatted:"; echo "$unformatted"; exit 1; }
      - run: go vet ./server/...
      - run: go test -count=1 ./server/...
        env: { PMS_TEST_DATABASE_URL: "postgres://pms:pms@localhost:5432/pms_test?sslmode=disable" }
      - run: npm ci && npm run generate && npm run lint && npm run typecheck && npm test
        working-directory: web
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Browser regression and accessibility
        run: npm run test:e2e -- --workers=2
        working-directory: web
      - name: Browser workflows with PostgreSQL
        run: go test -count=1 ./server/internal/httpserver -run '^TestBrowser(Collaboration|CustomFields|ProjectProgress|M2Flows|M3Flows|M4Flows|M5Flows|M9Flows|Workload|ExcelRoundTrip)$'
        env:
          PMS_TEST_DATABASE_URL: "postgres://pms:pms@localhost:5432/pms_test?sslmode=disable"
          PMS_TEST_BROWSER: "1"
      - name: Keep browser results when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: web/test-results
          retention-days: 7
          if-no-files-found: ignore
      - name: Generated code is up to date
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          go tool oapi-codegen --config api/oapi-codegen.yaml api/openapi.yaml
          "$(go env GOPATH)/bin/sqlc" generate
          git diff --exit-code -- server/internal/apigen server/internal/dbgen web/src/api || { echo "Generated code is stale: run 'make generate' and commit"; exit 1; }
      - name: Build container
        run: docker build --build-arg VERSION="$GITHUB_REF_NAME" -t pms:test .

  # Its own job so it can be named as a required check (S1.1.4) without waiting for the whole suite; a repository setting, not code,
  # makes it block merges, and GitHub refuses that setting on a private repository without a paid plan (HTTP 403).
  authorization-matrix:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: pms_test, POSTGRES_USER: pms, POSTGRES_PASSWORD: pms }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pms -d pms_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - run: go test -count=1 ./server/internal/httpserver ./server/internal/policy -run 'Authorization|AccessRules|Matrix|Capabilit'
        env: { PMS_TEST_DATABASE_URL: "postgres://pms:pms@localhost:5432/pms_test?sslmode=disable" }

  # S12.2.1: the twelve parity scenarios (docs/PMS_WRIKE_PARITY_DEVELOPMENT_BASELINE.md, E2E-PAR-01..12) in three visible groups.
  # Each pattern names the tests that carry the scenario; a pattern that matches nothing fails (-run with no match passes, so the
  # step counts what ran).
  parity-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: pms_test, POSTGRES_USER: pms, POSTGRES_PASSWORD: pms }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pms -d pms_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PMS_TEST_DATABASE_URL: "postgres://pms:pms@localhost:5432/pms_test?sslmode=disable"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - name: E2E-PAR-01..04 (custom types, read-only refusal, status guards, automation)
        run: scripts/parity-e2e.sh 01-04
      - name: E2E-PAR-05..08 (form branching, approvals, workload, baselines)
        run: scripts/parity-e2e.sh 05-08
      - name: E2E-PAR-09..12 (file approval pinning, formulas and reports, API and webhooks, SCIM)
        run: scripts/parity-e2e.sh 09-12

  image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ghcr.io/anissaefuddin/pms:${{ github.ref_name }}
